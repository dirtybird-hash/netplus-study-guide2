   '<div id="pCard"></div></div>';
  pScore=0;pAsked=0;nextPort();
}
function nextPort(){
  const dir=Math.random()<0.5?'toPort':'toProto';
  const item=PORTS[Math.floor(Math.random()*PORTS.length)];
  pq={dir,item};
  const c=$('#pCard');
  if(dir==='toPort'){
    c.innerHTML='<div class="card"><div class="prompt">Which port does this use?<span class="big">'+esc(item.n)+'</span></div>'+
      '<div class="row"><input class="numin" id="pIn" inputmode="numeric" autocomplete="off" placeholder="port"><button class="btn" id="pGo">Check</button></div>'+
      '<div id="pOut"></div></div>';
    const go=()=>gradePort($('#pIn').value.trim());
    $('#pGo').onclick=go;
    $('#pIn').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    $('#pIn').focus();
  }else{
    const opts=shuffle([item].concat(shuffle(PORTS.filter(p=>p.p!==item.p)).slice(0,3)));
    c.innerHTML='<div class="card"><div class="prompt">What runs on this port?<span class="big">'+esc(String(item.p).split('/')[0])+'</span></div>'+
      '<div class="answers" id="pAns"></div><div id="pOut"></div></div>';
    opts.forEach(o=>{
      const b=document.createElement('button'); b.className='ans'; b.textContent=o.n;
      b.onclick=()=>{
        document.querySelectorAll('#pAns .ans').forEach(x=>{x.disabled=true;
          if(x.textContent===item.n)x.classList.add('correct');});
        if(o.n!==item.n)b.classList.add('wrong');
        finishPort(o.n===item.n);
      };
      $('#pAns').appendChild(b);
    });
  }
}
function gradePort(val){
  const accepted=String(pq.item.p).split('/');
  const ok=accepted.includes(val);
  $('#pIn').disabled=true;$('#pGo').disabled=true;
  $('#pIn').classList.add(ok?'ok':'no');
  finishPort(ok);
}
function finishPort(ok){
  pAsked++; if(ok)pScore++;
  S.ports.runs++;
  if(pScore>S.ports.best){S.ports.best=pScore;}
  save();
  $('#pRun').textContent=pScore+' / '+pAsked;
  $('#pBest').textContent=S.ports.best;
  const o=$('#pOut');
  o.innerHTML='<p class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct.':'Not this time.')+'</p>'+
    '<p class="explain"><strong>'+esc(pq.item.n)+'</strong> — port <strong>'+esc(String(pq.item.p))+'</strong> ('+esc(pq.item.t)+')'+(pq.item.note?'. '+esc(pq.item.note):'')+'</p>'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="pNext">Next</button><button class="btn ghost" id="pEnd">End run</button></div>';
  $('#pNext').onclick=nextPort;
  $('#pEnd').onclick=renderPorts;
}

/* ---------- SUBNET ---------- */
let sq=null;
function renderSubnet(){
  main.innerHTML='<div class="drill"><h2>Subnet trainer</h2>'+
   '<p class="lede">Randomly generated, endlessly. Work it with the magic number method — the worked solution appears after you check.</p>'+
   '<div class="scorebar"><div>Correct<b id="sR">'+S.subnet.right+' / '+S.subnet.total+'</b></div><div>Streak<b id="sS">'+S.subnet.streak+'</b></div><div>Best streak<b id="sB">'+S.subnet.bestStreak+'</b></div></div>'+
   '<div id="sCard"></div></div>';
  newSubnet();
}
function newSubnet(){
  let o=[],lo;
  const type=Math.floor(Math.random()*3);
  if(type===0){o=[10,rnd(256),rnd(256),rnd(256)]; lo=8;}
  else if(type===1){o=[172,16+rnd(16),rnd(256),rnd(256)]; lo=12;}
  else {o=[192,168,rnd(256),rnd(256)]; lo=16;}
  const cidr=lo+Math.floor(Math.random()*(31-lo));
  const ip=o.join('.');
  sq={ip,cidr,...calcSubnet(ip,cidr)};
  $('#sCard').innerHTML='<div class="card">'+
    '<div class="prompt">Subnet this address<span class="big">'+ip+' /'+cidr+'</span></div>'+
    '<div class="subnetgrid">'+
      f('net','Network address')+f('bc','Broadcast address')+f('first','First usable')+f('last','Last usable')+f('hosts','Usable hosts')+f('mask','Subnet mask')+
    '</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="sGo">Check answers</button><button class="btn ghost" id="sSkip">Skip</button></div>'+
    '<div id="sOut"></div></div>';
  $('#sGo').onclick=gradeSubnet;
  $('#sSkip').onclick=newSubnet;
  $('#f_net').focus();
  function f(id,label){return '<div class="field"><label for="f_'+id+'">'+label+'</label><input id="f_'+id+'" autocomplete="off" spellcheck="false"></div>';}
}
function rnd(n){return Math.floor(Math.random()*n);}
function calcSubnet(ip,cidr){
  const a=ip.split('.').map(Number);
  const ipn=((a[0]<<24)>>>0)+(a[1]<<16)+(a[2]<<8)+a[3];
  const maskn=cidr===0?0:(0xFFFFFFFF<<(32-cidr))>>>0;
  const net=(ipn & maskn)>>>0;
  const bc=(net | (~maskn>>>0))>>>0;
  const hostBits=32-cidr;
  const hosts=hostBits<=1?(hostBits===1?0:1):Math.pow(2,hostBits)-2;
  return {net:d(net),bc:d(bc),first:hosts>0?d(net+1):'—',last:hosts>0?d(bc-1):'—',hosts:String(hosts),mask:d(maskn),maskn,net_n:net};
}
function d(n){return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');}
function gradeSubnet(){
  const keys=['net','bc','first','last','hosts','mask'];
  let allOk=true;
  keys.forEach(k=>{
    const el=$('#f_'+k); const v=el.value.trim();
    const ok=v.replace(/\s/g,'')===String(sq[k]);
    el.classList.add(ok?'ok':'no'); el.disabled=true;
    if(!ok)allOk=false;
  });
  S.subnet.total++;
  if(allOk){S.subnet.right++;S.subnet.streak++;if(S.subnet.streak>S.subnet.bestStreak)S.subnet.bestStreak=S.subnet.streak;}
  else S.subnet.streak=0;
  save();
  $('#sR').textContent=S.subnet.right+' / '+S.subnet.total;
  $('#sS').textContent=S.subnet.streak; $('#sB').textContent=S.subnet.bestStreak;
  $('#sGo').disabled=true;
  const onBoundary = sq.cidr%8===0;
  const oct = onBoundary ? sq.cidr/8 - 1 : Math.floor(sq.cidr/8);
  const mv = sq.mask.split('.')[oct];
  const magic = 256-Number(mv);
  const head = onBoundary
    ? 'Mask lands on an octet boundary.\nOctet #'+(oct+1)+' is the last full 255, so no magic number is needed —\nthe network is every address sharing the first '+(oct+1)+' octet(s).'
    : 'Interesting octet  =  #'+(oct+1)+'  (value '+mv+')\n'+
      'Magic number  =  256 − '+mv+'  =  '+magic+'\n'+
      'Blocks step by '+magic+' in octet #'+(oct+1);
  const work=
    'Mask for /'+sq.cidr+'  =  '+sq.mask+'\n'+
    head+'\n\n'+
    'Network    '+sq.net+'\n'+
    'Broadcast  '+sq.bc+'\n'+
    'Usable     '+sq.first+'  →  '+sq.last+'\n'+
    'Hosts      2^'+(32-sq.cidr)+' − 2  =  '+sq.hosts;
  $('#sOut').innerHTML='<p class="verdict '+(allOk?'ok':'no')+'">'+(allOk?'All six correct.':'Check the highlighted fields.')+'</p>'+
    '<div class="work">'+esc(work)+'</div>'+
    '<div class="row" style="margin-top:14px"><button class="btn" id="sNext">Next address</button></div>';
  $('#sNext').onclick=newSubnet;
}

let deck=[],di=0,flipped=false,deckFilter='all';
function renderCards(){
  main.innerHTML='<div class="drill"><h2>Recall cards</h2>'+
    '<p class="lede">Every memorize-this and exam-trap note from the guide, one at a time. Name the point before you flip.</p>'+
    '<div class="selectrow">'+
      '<select id="dFilter"><option value="all">All cards</option><option value="pin">Memorize only</option><option value="trap">Exam traps only</option><option value="unknown">Needs review only</option></select>'+
      '<button class="btn ghost" id="dShuffle">Shuffle</button>'+
    '</div>'+
    '<div class="scorebar"><div>Card<b id="dPos">—</b></div><div>Marked known<b id="dKnown">0</b></div></div>'+
    '<div id="dCard"></div></div>';
  $('#dFilter').value=deckFilter;
  $('#dFilter').onchange=e=>{deckFilter=e.target.value;buildDeck();};
  $('#dShuffle').onclick=()=>{deck=shuffle(deck);di=0;flipped=false;showCard();};
  buildDeck();
}
function buildDeck(){
  let all=[];
  DATA.forEach(s=>s.callouts.forEach((c,j)=>all.push({...c,sec:s.title,num:s.num,id:s.id+'#'+j})));
  if(deckFilter==='pin')all=all.filter(c=>c.kind==='pin');
  else if(deckFilter==='trap')all=all.filter(c=>c.kind==='trap');
  else if(deckFilter==='unknown')all=all.filter(c=>(S.cards||{})[c.id]!=='known');
  deck=shuffle(all); di=0; flipped=false; showCard();
}
function showCard(){
  const el=$('#dCard');
  $('#dKnown').textContent=Object.values(S.cards||{}).filter(v=>v==='known').length;
  if(!deck.length){el.innerHTML='<div class="card"><p style="margin:0">Nothing in this deck. Every card here is marked known — switch the filter to review them again.</p></div>';$('#dPos').textContent='0';return;}
  const c=deck[di%deck.length];
  $('#dPos').textContent=((di%deck.length)+1)+' / '+deck.length;
  const kindLabel=c.kind==='pin'?'Memorize':'Exam trap';
  el.innerHTML='<div class="card flip">'+
    '<div class="cardmeta '+c.kind+'">'+kindLabel+' — '+esc(c.num+' '+c.sec)+'</div>'+
    (flipped?'<div class="cardbody">'+c.html+'</div>'
            :'<p style="color:var(--ink-3);font-family:var(--sans);font-size:15px;margin:0">Recall the point, then reveal.</p>')+
    '</div>'+
    '<div class="row">'+
      (flipped
        ? '<button class="btn good" id="dKnow">I knew it</button><button class="btn ghost" id="dAgain">Review again</button>'
        : '<button class="btn" id="dFlip">Reveal</button>')+
      '<span class="pill">'+(S.cards[c.id]==='known'?'known':'unseen')+'</span>'+
    '</div>';
  if(flipped){
    $('#dKnow').onclick=()=>{S.cards[c.id]='known';save();di++;flipped=false;showCard();};
    $('#dAgain').onclick=()=>{S.cards[c.id]='review';save();di++;flipped=false;showCard();};
  } else $('#dFlip').onclick=()=>{flipped=true;showCard();};
}

/* ---------- QUIZ ---------- */
let qSet=[],qi=0,qScore=0,qDomain='all',qAnswered=false;
function renderQuiz(){
  main.innerHTML='<div class="drill"><h2>Practice questions</h2>'+
    '<p class="lede">Written to match how the exam phrases things. Every answer explains itself and points back to the section.</p>'+
    '<div class="selectrow">'+
      '<select id="qDom"><option value="all">All domains</option>'+
        [1,2,3,4,5].map(n=>'<option value="'+n+'">Domain '+n+'.0</option>').join('')+
      '</select><button class="btn" id="qStart">Start</button></div>'+
    '<div id="qCard"></div></div>';
  $('#qDom').value=qDomain;
  $('#qStart').onclick=()=>{qDomain=$('#qDom').value;startQuiz();};
  $('#qCard').innerHTML='<div class="card"><p style="margin:0;color:var(--ink-2)">'+
    'Pick a domain and start. Best scores so far: '+
    (Object.keys(S.quiz).length?Object.entries(S.quiz).map(([k,v])=>'<strong>'+esc(k)+'</strong> '+v.best+'/'+v.of).join(' · '):'none yet')+'.</p></div>';
}
function startQuiz(){
  qSet=shuffle(QUIZ.filter(q=>qDomain==='all'||String(q.d)===qDomain));
  qi=0;qScore=0;qAnswered=false;showQ();
}
function showQ(){
  if(qi>=qSet.length){
    const k='Domain '+(qDomain==='all'?'mixed':qDomain);
    const rec=S.quiz[k]||{best:0,of:qSet.length};
    if(qScore>rec.best)S.quiz[k]={best:qScore,of:qSet.length};
    save();
    const pct=Math.round(qScore/qSet.length*100);
    $('#qCard').innerHTML='<div class="card"><div class="prompt">'+qScore+' of '+qSet.length+' — '+pct+'%</div>'+
      '<p class="explain">'+(pct>=80?'That is passing territory. Push into the sections you missed.':pct>=60?'Close. The gap is usually two or three specific facts, not the whole domain.':'Worth rereading the sections behind the ones you missed before drilling again.')+'</p>'+
      '<div class="row" style="margin-top:14px"><button class="btn" id="qAgain">Run it again</button></div></div>';
    $('#qAgain').onclick=startQuiz; return;
  }
  const q=qSet[qi];qAnswered=false;
  $('#qCard').innerHTML='<div class="card">'+
    '<div class="cardmeta pin" style="color:var(--ink-3)">Question '+(qi+1)+' of '+qSet.length+' — section '+esc(q.s)+'</div>'+
    '<div class="prompt" style="font-size:19px">'+esc(q.q)+'</div>'+
    '<div class="answers" id="qAns"></div><div id="qOut"></div></div>';
  const order=shuffle(q.a.map((t,i)=>({t,i})));
  order.forEach(o=>{
    const b=document.createElement('button');b.className='ans';b.textContent=o.t;
    b.onclick=()=>{
      if(qAnswered)return; qAnswered=true;
      document.querySelectorAll('#qAns .ans').forEach((x,ix)=>{x.disabled=true;
        if(x.textContent===q.a[q.c])x.classList.add('correct');});
      if(o.i!==q.c)b.classList.add('wrong'); else qScore++;
      $('#qOut').innerHTML='<p class="verdict '+(o.i===q.c?'ok':'no')+'">'+(o.i===q.c?'Correct.':'The answer is '+esc(q.a[q.c])+'.')+'</p>'+
        '<p class="explain">'+esc(q.e)+'</p>'+
        '<div class="row" style="margin-top:14px"><button class="btn" id="qNext">'+(qi===qSet.length-1?'See score':'Next question')+'</button></div>';
      $('#qNext').onclick=()=>{qi++;showQ();};
    };
    $('#qAns').appendChild(b);
  });
}

/* ---------- PROGRESS ---------- */
function renderProgress(){
  const done=DATA.filter(s=>S.studied[s.id]).length;
  const known=Object.values(S.cards||{}).filter(v=>v==='known').length;
  let totalCards=0; DATA.forEach(s=>totalCards+=s.callouts.length);
  main.innerHTML='<div class="drill"><h2>Progress</h2>'+
    '<p class="lede">Kept in this browser only. Each square is a section — click one to jump to it.</p>'+
    '<div class="scorebar">'+
      '<div>Sections studied<b>'+done+' / '+DATA.length+'</b></div>'+
      '<div>Cards known<b>'+known+' / '+totalCards+'</b></div>'+
      '<div>Subnet accuracy<b>'+(S.subnet.total?Math.round(S.subnet.right/S.subnet.total*100)+'%':'—')+'</b></div>'+
      '<div>Best port run<b>'+S.ports.best+'</b></div>'+
      '<div>Sections with notes<b>'+Object.keys(S.notes||{}).length+'</b></div>'+
    '</div>'+
    '<div class="progressgrid" id="pg"></div>'+
    '<p class="explain" style="margin-top:18px">Readiness is not the number of squares filled. It is whether you can subnet cold, name the ports both directions, and state the next troubleshooting step from any scenario.</p>'+
    '<div class="row" style="margin-top:22px"><button class="btn" id="exportBtn">Export my notes</button><button class="btn ghost" id="resetBtn">Reset all progress</button></div></div>';
  const pg=$('#pg');
  DATA.forEach((s,i)=>{
    const c=document.createElement('button');
    c.className='pcell'+(S.studied[s.id]?' done':'');
    c.textContent=s.num.replace(/[A-Z]/g,x=>x); c.title=s.title;
    c.onclick=()=>{cur=i;setView('read');};
    pg.appendChild(c);
  });
  $('#exportBtn').onclick=()=>{
    const n=S.notes||{};
    if(!Object.keys(n).length){alert('No notes yet.');return;}
    let out='# My Network+ notes\n\n';
    DATA.forEach(x=>{ if(n[x.id]) out+='## '+x.num+' '+x.title+'\n\n'+n[x.id]+'\n\n'; });
    const b=new Blob([out],{type:'text/markdown'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='my-netplus-notes.md';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
  $('#resetBtn').onclick=()=>{
    if(!confirm('Clear studied sections, card marks and drill scores? This cannot be undone.'))return;
    S=FRESH();
    save();renderProgress();buildRail($('#search').value);
  };
}

/* ---------- util ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

buildRail();
setView('read');
</script>
</body>
</html>
