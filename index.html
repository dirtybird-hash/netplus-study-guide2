<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network+ N10-009 — Interactive Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pair-blue:#2F5FD6; --pair-green:#1F8A5C; --pair-orange:#A9791C; --pair-brown:#A0522D;
  --ink:#171B1F; --ink-2:#5A6570; --ink-3:#7B858D;
  --surface:#F6F5F2; --panel:#FFFFFF; --line:#DBE0E3; --line-2:#EEF1F2;
  --blue-wash:#E9EEFB; --green-wash:#E7F4EE; --orange-wash:#FBF1D9;
  --shadow:0 1px 2px rgba(20,24,28,.06),0 4px 14px rgba(20,24,28,.06);
  --r-lg:16px; --r:10px; --r-sm:8px; --r-xs:5px;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:'Source Serif 4',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --pair-blue:#7EA2FF; --pair-green:#55D69A; --pair-orange:#E0B24D; --pair-brown:#E0A071;
    --ink:#E7EDF1; --ink-2:#93A2AC; --ink-3:#78858E;
    --surface:#0D1216; --panel:#151C22; --line:#2B363E; --line-2:#1B242B;
    --blue-wash:#16203A; --green-wash:#12291F; --orange-wash:#332A15;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --pair-blue:#7EA2FF; --pair-green:#55D69A; --pair-orange:#E0B24D; --pair-brown:#E0A071;
    --ink:#E7EDF1; --ink-2:#93A2AC; --ink-3:#78858E;
    --surface:#0D1216; --panel:#151C22; --line:#2B363E; --line-2:#1B242B;
    --blue-wash:#16203A; --green-wash:#12291F; --orange-wash:#332A15;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.62;
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
a{color:var(--pair-blue)}

/* ---------- rack strip (top bar) ---------- */
.rack{
  position:sticky; top:0; z-index:40;
  background:var(--panel); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 16px;
}
.brand{font-family:var(--display); font-weight:600; letter-spacing:-.01em; font-size:16px; line-height:1.1}
.brand span{display:block; font-weight:500; font-size:11.5px; color:var(--ink-3); letter-spacing:.01em}
.modes{display:flex; gap:2px; margin-left:auto; flex-wrap:wrap}
.mode{
  font-family:var(--sans); font-size:13.5px; font-weight:600;
  background:transparent; border:1px solid transparent; border-radius:var(--r);
  padding:6px 11px; cursor:pointer; color:var(--ink-2);
}
.mode:hover{background:var(--line-2)}
.mode[aria-selected="true"]{background:var(--pair-blue); color:#fff; border-color:var(--pair-blue)}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--ink-2)}
.iconbtn:hover{background:var(--line-2)}

/* ---------- layout ---------- */
.shell{display:flex; align-items:flex-start; max-width:1400px; margin:0 auto}
.rail{
  width:286px; flex:0 0 286px; position:sticky; top:57px;
  height:calc(100vh - 57px); overflow-y:auto;
  border-right:1px solid var(--line); background:var(--panel);
  padding:14px 0 40px;
}
.main{flex:1; min-width:0; padding:26px 40px 90px; max-width:860px}

/* ---------- patch panel nav ---------- */
.panelgroup{padding:0 14px; margin-bottom:16px}
.panelgroup h4{
  font-family:var(--display); font-size:11px; font-weight:600; color:var(--ink-3);
  margin:12px 0 7px; letter-spacing:.02em;
}
.port{
  display:flex; align-items:center; gap:9px; width:100%;
  background:transparent; border:1px solid var(--line-2); border-radius:var(--r-sm);
  padding:6px 8px; margin-bottom:3px; cursor:pointer; text-align:left;
  font-family:var(--sans); font-size:13px; line-height:1.3; color:var(--ink-2);
}
.port:hover{border-color:var(--pair-blue); color:var(--ink)}
.port[aria-current="true"]{background:var(--blue-wash); border-color:var(--pair-blue); color:var(--ink); font-weight:600}
.led{
  flex:0 0 8px; width:8px; height:8px; border-radius:50%;
  background:var(--line); border:1px solid var(--line);
}
.port.done .led{background:var(--pair-green); border-color:var(--pair-green); box-shadow:0 0 5px var(--pair-green)}
.port .pnum{font-family:var(--mono); font-size:11px; color:var(--ink-3); flex:0 0 auto; min-width:26px}

/* ---------- content ---------- */
.sectionhead{border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:20px}
.sectionhead .eyebrow{font-family:var(--display);font-size:11.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--pair-blue);margin-bottom:3px}
.sectionhead h2{font-family:var(--display); font-size:28px; font-weight:600; letter-spacing:-.01em; margin:0; line-height:1.15}
.doc h1{display:none}
.doc h2{display:none}
.doc h3{font-family:var(--sans); font-size:20px; font-weight:700; letter-spacing:-.015em; margin:32px 0 10px; padding-top:4px}
.doc h4{font-family:var(--sans); font-size:16px; font-weight:700; margin:22px 0 6px}
.doc p{margin:0 0 13px}
.doc ul,.doc ol{margin:0 0 14px; padding-left:22px}
.doc li{margin-bottom:5px}
.doc strong{font-weight:600}
.doc em{font-style:italic}
.doc code{font-family:var(--mono); font-size:.86em; background:var(--line-2); padding:1px 5px; border-radius:var(--r-xs)}
.doc pre{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--pair-brown); padding:14px 16px; overflow-x:auto; border-radius:var(--r-sm); margin:0 0 16px}
.doc pre code{background:none; padding:0; font-size:13px; line-height:1.6}
.doc hr{border:none; border-top:1px solid var(--line); margin:30px 0}
.doc blockquote{border-left:3px solid var(--line); margin:0 0 14px; padding-left:14px; color:var(--ink-2)}
.tablewrap{overflow-x:auto; margin:0 0 18px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel)}
.doc table{border-collapse:collapse; width:100%; font-family:var(--sans); font-size:14px}
.doc th{
  text-align:left; font-weight:700; background:var(--line-2);
  padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
}
.doc td{padding:8px 12px; border-bottom:1px solid var(--line-2); vertical-align:top}
.doc tr:last-child td{border-bottom:none}
.doc td code{font-size:.9em}

/* callouts */
.callout{border-left:3px solid; padding:11px 15px; margin:0 0 15px; border-radius:0 var(--r-sm) var(--r-sm) 0; font-size:16.5px}
.callout.pin{border-color:var(--pair-green); background:var(--green-wash)}
.callout.trap{border-color:var(--pair-orange); background:var(--orange-wash)}
.callout.both{border-color:var(--pair-orange); background:var(--orange-wash); box-shadow:inset 3px 0 0 var(--pair-green)}
.callout p:last-child{margin-bottom:0}
.lab{border:1px dashed var(--pair-brown); background:var(--panel); padding:14px 16px; border-radius:var(--r-sm); margin:22px 0}
.lab h3{margin-top:0 !important; color:var(--pair-brown); font-size:16px}

.notes{margin-top:30px;border:1px solid var(--line);border-left:3px solid var(--pair-brown);border-radius:var(--r-sm);background:var(--panel);padding:13px 15px}
.noteshead{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--pair-brown);margin-bottom:7px}
.notestate{font-weight:500;color:var(--ink-3);font-size:11.5px}
.notes textarea{width:100%;min-height:105px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-family:var(--serif);font-size:15.5px;line-height:1.55;padding:9px 11px}
.notes textarea:focus{outline:2px solid var(--pair-blue);outline-offset:-1px}
.hasnote{margin-left:auto;flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--pair-brown)}
.secfoot{display:flex; gap:10px; align-items:center; margin-top:34px; padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap}
.btn{
  font-family:var(--sans); font-size:14px; font-weight:600; cursor:pointer;
  background:var(--pair-blue); color:#fff; border:1px solid var(--pair-blue);
  border-radius:var(--r); padding:8px 15px;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn.ghost:hover{background:var(--line-2); color:var(--ink)}
.btn.good{background:var(--pair-green); border-color:var(--pair-green)}
.btn:disabled{opacity:.45; cursor:default}

/* ---------- search ---------- */
.searchbox{padding:0 14px 10px}
.searchbox input{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); font-family:var(--sans); font-size:13.5px;
}
.searchbox input:focus{outline:2px solid var(--pair-blue); outline-offset:-1px}

/* ---------- drills ---------- */
.drill{max-width:720px}
.drill h2{font-family:var(--display); font-size:26px; font-weight:600; letter-spacing:-.01em; margin:0 0 4px}
.drill .lede{color:var(--ink-2); margin:0 0 22px; font-size:16px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:22px; margin-bottom:16px; box-shadow:var(--shadow)}
.prompt{font-family:var(--sans); font-size:21px; font-weight:600; line-height:1.35; margin:0 0 16px}
.prompt .big{font-family:var(--mono); font-size:34px; font-weight:600; color:var(--pair-blue); display:block; margin:4px 0 2px}
.answers{display:grid; gap:7px}
.ans{
  font-family:var(--sans); font-size:15px; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 13px;
}
.ans:hover:not(:disabled){border-color:var(--pair-blue)}
.ans.correct{background:var(--green-wash); border-color:var(--pair-green); font-weight:600}
.ans.wrong{background:var(--orange-wash); border-color:var(--pair-orange)}
.ans:disabled{cursor:default}
.numin{
  font-family:var(--mono); font-size:22px; width:150px; padding:9px 12px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
}
.numin:focus{outline:2px solid var(--pair-blue); outline-offset:-1px}
.verdict{font-family:var(--sans); font-weight:700; font-size:15px; margin:14px 0 0}
.verdict.ok{color:var(--pair-green)}
.verdict.no{color:var(--pair-orange)}
.explain{font-size:15.5px; margin:8px 0 0; color:var(--ink-2)}
.scorebar{display:flex; gap:20px; font-family:var(--sans); font-size:13px; color:var(--ink-2); margin-bottom:18px; flex-wrap:wrap}
.scorebar b{font-family:var(--mono); color:var(--ink); font-size:15px; display:block; font-weight:600}
.subnetgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin:6px 0 4px}
.field label{display:block; font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:4px}
.field input{width:100%; font-family:var(--mono); font-size:15px; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
.field input:focus{outline:2px solid var(--pair-blue); outline-offset:-1px}
.field input.ok{border-color:var(--pair-green); background:var(--green-wash)}
.field input.no{border-color:var(--pair-orange); background:var(--orange-wash)}
.work{font-family:var(--mono); font-size:13.5px; line-height:1.75; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; margin-top:14px; white-space:pre-wrap}
.flip{min-height:190px; display:flex; flex-direction:column; justify-content:center}
.cardmeta{font-family:var(--sans); font-size:12.5px; font-weight:600; margin-bottom:10px}
.cardmeta.pin{color:var(--pair-green)}
.cardmeta.trap{color:var(--pair-orange)}
.cardbody{font-size:17px}
.cardbody strong{font-weight:600}
.cardbody code{font-family:var(--mono);font-size:.87em;background:var(--line-2);padding:1px 4px;border-radius:var(--r-xs)}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.pill{font-family:var(--sans); font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2)}
.selectrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-family:var(--sans);font-size:14px}
.progressgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:5px; margin:14px 0 6px}
.pcell{aspect-ratio:1; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; color:var(--ink-3); cursor:pointer}
.pcell.done{background:var(--pair-green); border-color:var(--pair-green); color:#fff}
.railtoggle{display:none}
.errbanner{position:fixed;left:12px;right:12px;bottom:12px;z-index:200;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap;background:var(--panel);color:var(--ink);
  border:1px solid var(--pair-orange);border-left:4px solid var(--pair-orange);
  border-radius:var(--r);padding:11px 14px;font-family:var(--sans);font-size:13.5px;
  box-shadow:0 6px 24px rgba(0,0,0,.18)}
.errbanner span{flex:1 1 260px}
.errbanner button{font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;
  border-radius:var(--r);padding:6px 11px;border:1px solid var(--pair-orange);
  background:var(--pair-orange);color:#fff}
.errbanner button#errClose{background:transparent;color:var(--ink-2);border-color:var(--line)}

@media (max-width:900px){
  body{font-size:16px}
  .shell{display:block}
  .rail{
    position:fixed; top:0; left:0; height:100vh; width:280px; flex:none;
    z-index:60; transform:translateX(-101%); transition:transform .18s ease;
    box-shadow:0 0 40px rgba(0,0,0,.28); padding-top:56px;
  }
  .rail.open{transform:translateX(0)}
  .main{padding:20px 18px 80px; max-width:none}
  .railtoggle{display:inline-block}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
  .scrim.on{display:block}
  .prompt .big{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
:focus-visible{outline:2px solid var(--pair-blue); outline-offset:2px}
</style>
</head>
<body>

<header class="rack">
  <button class="iconbtn railtoggle" id="railBtn" aria-label="Open section list">Sections</button>

  <nav class="modes" role="tablist" aria-label="Study modes">

    <button class="mode" role="tab" data-view="ports" aria-selected="false">Ports</button>
    <button class="mode" role="tab" data-view="subnet" aria-selected="false">Subnetting</button>
    <button class="mode" role="tab" data-view="cards" aria-selected="false">Cards</button>
    <button class="mode" role="tab" data-view="quiz" aria-selected="false">Quiz</button>
    <button class="mode" role="tab" data-view="progress" aria-selected="false">Progress</button>
  </nav>
  <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark">Theme</button>
</header>

<div class="scrim" id="scrim"></div>

    <div class="searchbox"><input type="search" id="search" placeholder="Search the guide" aria-label="Search sections"></div>
    <div id="railList"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* If anything throws, tell the user and offer to clear stored data, rather
   than failing silently into a broken page. */
window.addEventListener('error',function(ev){
  if(document.getElementById('errBanner')) return;
  var b=document.createElement('div');
  b.id='errBanner'; b.className='errbanner';
  b.innerHTML='<span>Something went wrong on this page. If it keeps happening, clearing saved progress usually fixes it.</span>'+
              '<button id="errReset">Clear saved data</button><button id="errClose">Dismiss</button>';
  (document.body||document.documentElement).appendChild(b);
  document.getElementById('errReset').onclick=function(){
    try{localStorage.removeItem('netplus009');localStorage.removeItem('netplus009_theme');}catch(e){}
    location.reload();
  };
  document.getElementById('errClose').onclick=function(){b.remove();};
  console.error('Study guide error:', ev.error||ev.message);
});
const DATA = [{"id": "s00", "num": "•", "title": "How to use this guide", "short": "How to use this guide", "part": "Overview", "html": "<p>This is reorganized <strong>by exam domain</strong>, not by course day, because the exam tests by domain. Each section is cross-referenced back to its source transcript so you can go re-watch the original.</p>\n<p>Reading order that works:</p>\n<ol>\n<li><strong>First pass</strong> — read a domain end to end, ignore the 🔧 stubs. Build the map.</li>\n<li><strong>Second pass</strong> — work the <em>Exam traps</em> boxes. These are where the test writers live.</li>\n<li><strong>Third pass</strong> — build the labs for that domain. Build it, break it, fix it.</li>\n<li><strong>Drill</strong> — Appendix A (ports), Appendix B (subnetting), Appendix C (commands) are pure memorization. Do these daily, not in a block.</li>\n</ol>\n<p><strong>Notation used throughout:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Mark</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>🔧</td>\n<td>Packet Tracer lab stub — expand it into a full build</td>\n</tr>\n<tr>\n<td>⚠️</td>\n<td>Exam trap — commonly missed or deliberately confused</td>\n</tr>\n<tr>\n<td>📌</td>\n<td>Memorize verbatim — likely a direct recall question</td>\n</tr>\n<tr>\n<td>🔗</td>\n<td>A+ crossover — you already know this, connect it forward</td>\n</tr>\n</tbody>\n</table></div>\n<hr />", "text": " This is reorganized by exam domain , not by course day, because the exam tests by domain. Each section is cross-referenced back to its source transcript so you can go re-watch the original. Reading order that works: First pass — read a domain end to end, ignore the 🔧 stubs. Build the map. Second pass — work the Exam traps boxes. These are where the test writers live. Third pass — build the labs for that domain. Build it, break it, fix it. Drill — Appendix A (ports), Appendix B (subnetting), Appendix C (commands) are pure memorization. Do these daily, not in a block. Notation used throughout: Mark Meaning 🔧 Packet Tracer lab stub — expand it into a full build ⚠️ Exam trap — commonly missed or deliberately confused 📌 Memorize verbatim — likely a direct recall question 🔗 A+ crossover — you already know this, connect it forward ", "callouts": []}, {"id": "s01", "num": "•", "title": "Exam at a glance", "short": "Exam at a glance", "part": "Overview", "html": "<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Domain</th>\n<th>Weight</th>\n<th>Where it lives in this guide</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1.0 Networking Concepts</td>\n<td>23%</td>\n<td>Part 1 — sections 1.1–1.8</td>\n</tr>\n<tr>\n<td>2.0 Infrastructure</td>\n<td>20%</td>\n<td>Part 2 — sections 2.1–2.4</td>\n</tr>\n<tr>\n<td>3.0 Network Operations</td>\n<td>19%</td>\n<td>Part 3 — sections 3.1–3.5</td>\n</tr>\n<tr>\n<td>4.0 Network Security</td>\n<td>14%</td>\n<td>Part 4 — sections 4.1–4.3</td>\n</tr>\n<tr>\n<td>5.0 Troubleshooting &amp; Tools</td>\n<td>24%</td>\n<td>Part 5 — sections 5.1–5.5</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Format:</strong> max 90 questions, 90 minutes, 720/900 to pass. Multiple choice plus performance-based questions (PBQs).</p>\n<div class=\"callout trap\"><p>⚠️ Domains 5.0 and 1.0 together are <strong>47% of the exam</strong>. Troubleshooting is the single heaviest domain and it is where most people lose points, because it is applied rather than recall. Do not treat it as the chapter you get to last.</p></div>\n<div class=\"callout pin\"><p>📌 <strong>The PBQ reality:</strong> performance-based questions typically ask you to drag cables to the right ports, configure a small addressing scheme, place devices in a topology, or step a scenario through the troubleshooting methodology. Every one of those is something you can rehearse in Packet Tracer. That is why this guide is lab-heavy.</p></div>\n<hr />", "text": " Domain Weight Where it lives in this guide 1.0 Networking Concepts 23% Part 1 — sections 1.1–1.8 2.0 Infrast 5</td>\n</tr>\n<tr>\n<td>Day 4 — Networking Appliances</td>\n<td>1.2</td>\n</tr>\n<tr>\n<td>Day 5 — Ethernet Switching &amp; Wireless Standards</td>\n<td>2.2, 2.3</td>\n</tr>\n<tr>\n<td>Day 6 — IPv4 Network Addressing</td>\n<td>1.7</td>\n</tr>\n<tr>\n<td>Day 7 — IP Addressing Schemes and Subnetting</td>\n<td>1.7</td>\n</tr>\n<tr>\n<td>Day 8 — Routing &amp; Switching Technologies</td>\n<td>2.1, 2.2</td>\n</tr>\n<tr>\n<td>Day 9 — Network Implementations</td>\n<td>2.1, 2.4</td>\n</tr>\n<tr>\n<td>Day 10 — Ports &amp; Protocols</td>\n<td>1.4</td>\n</tr>\n<tr>\n<td>Day 11 — Modern Network Environments</td>\n<td>1.8</td>\n</tr>\n<tr>\n<td>Day 12 — Troubleshooting Network Issues</td>\n<td>5.2, 5.3, 5.4, 5.5</td>\n</tr>\n<tr>\n<td>Day 13 — Disaster Recovery &amp; High Availability</td>\n<td>3.3</td>\n</tr>\n<tr>\n<td>Day 14 — Network Management &amp; IP Services</td>\n<td>3.4, 3.5</td>\n</tr>\n<tr>\n<td>Day 14 — Network Operations</td>\n<td>3.1, 3.2</td>\n</tr>\n<tr>\n<td>Day 15 — Network Security Concepts &amp; Solutions</td>\n<td>4.1</td>\n</tr>\n<tr>\n<td>Day 15 — Physical Security &amp; Network Hardening</td>\n<td>4.3</td>\n</tr>\n<tr>\n<td>Day 16 — Network Monitoring &amp; DR Concepts</td>\n<td>3.2, 3.3</td>\n</tr>\n<tr>\n<td>Day 16 — Troubleshooting Methodologies</td>\n<td>5.1</td>\n</tr>\n<tr>\n<td>Day 17 — Wireless Configurations &amp; Physical Installations</td>\n<td>2.3, 2.4</td>\n</tr>\n<tr>\n<td>Day 18 — Cloud Computing Concepts</td>\n<td>1.3</td>\n</tr>\n<tr>\n<td>Day 18 — Organizational Processes &amp; Procedures</td>\n<td>3.1</td>\n</tr>\n<tr>\n<td><strong>Written from scratch</strong></td>\n<td><strong>4.2 Attacks · 5.4 performance content</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><em>(Day 4 and Day 13-PortsProtos in the source folder duplicate Day 4-Appliances and Day 10.)</em></p>\n<div class=\"callout pin\"><p>📌 <strong>Section numbering follows the published CompTIA N10-009 objectives.</strong> An earlier revision of this guide numbered several sections incorrectly — Domain 2 had routing and switching swapped, Domain 3 had documentation and IP services swapped, and Domains 4 and 5 were missing sections entirely. See the changelog.</p></div>\n<div class=\"callout trap\"><p>⚠️ <strong>Professor Messer's course notes are <em>not</em> a source for this guide.</strong> They are copyrighted and separately purchased. <strong>Appendix G</strong> cross-references this guide to their page numbers so the two can be read side by side.</p></div>\n<hr />", "text": " Source Feeds Day 1 — The OSI Reference Model · Understanding OSI 1.1 Day 2 — Network Topologies, Architectures & Types 1.5, 1.6, 2.3 Day 3 — Cables & Connectors 1.5 Day 4 — Networking Appliances 1.2 Day 5 — Ethernet Switching & Wireless Standards 2.2, 2.3 Day 6 — IPv4 Network Addressing 1.7 Day 7 — IP Addressing Schemes and Subnetting 1.7 Day 8 — Routing & Switching Technologies 2.1, 2.2 Day 9 — Network Implementations 2.1, 2.4 Day 10 — Ports & Protocols 1.4 Day 11 — Modern Network Environments 1.8 Day 12 — Troubleshooting Network Issues 5.2, 5.3, 5.4, 5.5 Day 13 — Disaster Recovery & High Availability 3.3 Day 14 — Network Management & IP Services 3.4, 3.5 Day 14 — Network Operations 3.1, 3.2 Day 15 — Network Security Concepts & Solutions 4.1 Day 15 — Physical Security & Network Hardening 4.3 Day 16 — Network Monitoring & DR Concepts 3.2, 3.3 Day 16 — Troubleshooting Methodologies 5.1 Day 17 — Wireless Configurations & Physical Installations 2.3, 2.4 Day 18 — Cloud Computing Concepts 1.3 Day 18 — Organizational Processes & Procedures 3.1 Written from scratch 4.2 Attacks · 5.4 performance content (Day 4 and Day 13-PortsProtos in the source folder duplicate Day 4-Appliances and Day 10.) 📌 Section numbering follows the published CompTIA N10-009 objectives. An earlier revision of this guide numbered several sections incorrectly — Domain 2 had routing and switching swapped, Domain 3 had documentation and IP services swapped, and Domains 4 and 5 were missing sections entirely. See the changelog. ⚠️ Professor Messer's course notes are not a source for this guide. They are copyrighted and separately purchased. Appendix G cross-references this guide to their page numbers so the two can be read side by side. ", "callouts": [{"kind": "pin", "html": "<strong>Section numbering follows the published CompTIA N10-009 objectives.</strong> An earlier revision of this guide numbered several sections incorrectly — Domain 2 had routing and switching swapped, Domain 3 had documentation and IP services swapped, and Domains 4 and 5 were missing sections entirely. See the changelog."}, {"kind": "trap", "html": "<strong>Professor Messer's course notes are <em>not</em> a source for this guide.</strong> They are copyrighted and separately purchased. <strong>Appendix G</strong> cross-references this guide to their page numbers so the two can be read side by side."}]}, {"id": "s03", "num": "1.1", "title": "1.1 The OSI Reference Model", "short": "The OSI Reference Model", "part": "PART 1 — Networking Concepts (Domain 1.0, 23%)", "html": "<p><em>Source: Day 1 — The OSI Reference Model; Understanding OSI</em></p>\n<h3>What the OSI model actually is</h3>\n<p>The OSI model comes from the <strong>ISO</strong> (International Organization for Standardization) — the same body that standardizes everything from accounting practices to shipping container dimensions. It is <strong>not software, not hardware, and not a protocol suite.</strong> It is a set of guidelines telling manufacturers <em>what functions must happen</em> at each stage of network communication, while leaving <em>how</em> to implement them entirely up to the vendor.</p>\n<p>That distinction is the whole point. Because every vendor agrees on the functional boundaries, an Ethernet NIC from one company works with a switch from another, and an email sent from Windows arrives readable on Linux.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>Trap:</strong> The exam will offer \"OSI is a protocol suite\" or \"OSI defines which frequencies Wi-Fi uses\" as distractors. It does neither. The protocols we actually run are TCP/IP; OSI is the <em>model we map them onto</em>. And OSI says frequencies must be defined — it does not define them. The IEEE and FCC do that.</p></div>\n<h3>The seven layers</h3>\n<p>Top down, 7 → 1:</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>#</th>\n<th>Layer</th>\n<th>One-word job</th>\n<th>PDU</th>\n<th>Lives here</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>7</td>\n<td>Application</td>\n<td>User interface</td>\n<td>Data</td>\n<td>HTTP/S, FTP, DNS, POP3, SMTP, DHCP</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Presentation</td>\n<td>Translation</td>\n<td>Data</td>\n<td>ASCII/EBCDIC, JPEG/MOV encoding, compression, SSL/TLS encryption</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Session</td>\n<td>Conversation control</td>\n<td>Data</td>\n<td>Session setup/teardown, checkpoints, tunneling, NetBIOS, RPC, NFS</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Transport</td>\n<td>End-to-end delivery</td>\n<td>Segment (TCP) / Datagram (UDP)</td>\n<td>TCP, UDP, port numbers</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Network</td>\n<td>Routing</td>\n<td>Packet</td>\n<td>IP, IP addresses, subnet masks, routers, NAT, fragmentation</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Data Link</td>\n<td>Node-to-node</td>\n<td>Frame</td>\n<td>MAC addresses, switches, Ethernet, PPP, HDLC</td>\n</tr>\n<tr>\n<td>1</td>\n<td>Physical</td>\n<td>Bits on the wire</td>\n<td>Bit</td>\n<td>Cables, fiber, connectors, radio signals, NICs</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>Mnemonics.</strong> Top down (7→1): <strong>All People Seem To Need Data Processing.</strong> Bottom up (1→7): <strong>Please Do Not Throw Sausage Pizza Away.</strong> Learn both directions — questions come at you from either end.</p></div>\n<h3>Layer by layer, with what you'll actually be asked</h3>\n<p><strong>Layer 1 — Physical.</strong> \"Bedknobs and broomsticks — things you can lay your hands on.\" Cables, fiber, connectors, NICs, the signal itself, frequencies, bit rate. Also <em>encoding</em> (how a 1 vs a 0 is represented) and <em>media access</em> rules like the old CSMA/CD. Any two distinguishable states can encode binary — two light frequencies, presence/absence of light, even sonar tones between submarines.</p>\n<p>Layer 1 troubleshooting = loopback tests, cable testers, checking adapters, looking for wireless interference.</p>\n<p><strong>Layer 2 — Data Link.</strong> Node-to-node delivery. This is where the <strong>frame</strong> is built by adding physical (MAC) addressing to whatever came down from Layer 3. Responsibilities: physical addressing, framing, media access control, flow control, and error control (which at this layer means <em>retransmission of a frame</em>).</p>\n<p>The MAC address is a <strong>12-character hexadecimal</strong> value burned into the NIC. First half identifies the manufacturer (the OUI), second half is the node address. Globally unique by registration.</p>\n<p>Layer 2 splits into two sublayers:\n- <strong>LLC (Logical Link Control)</strong> — interfaces up to the network layer, handles connectionless vs connection-oriented behavior\n- <strong>MAC (Media Access Control)</strong> — interfaces down to the physical media, owns the hardware address</p>\n<div class=\"callout trap\"><p>⚠️ <strong>Trap:</strong> \"MAC\" here is <strong>Media Access Control</strong>, nothing to do with Apple. Expect this to be tested as a definition question.</p></div>\n<p>Layer 2 protocols named in the course: SDLC, HDLC, SLIP, PPP, LAP. Switches are Layer 2 devices — they forward on destination MAC.</p>\n<p><strong>Layer 3 — Network.</strong> Connects nodes <em>across</em> multiple networks, where Layer 2 only got you across one. Builds the <strong>packet</strong> and applies logical (IP) addressing. Functions: packetizing, logical addressing, <strong>fragmentation</strong> (chopping packets down when a downstream network can't carry the original size, and labeling the pieces for reassembly), routing (best-path determination), internetworking, and address conversion via <strong>NAT</strong>.</p>\n<p><strong>Layer 4 — Transport.</strong> End-to-end delivery. The \"post office layer.\" Creates a single logical pipeline so the upper layers never have to know what the network in between looks like. Owns:\n- <strong>TCP</strong> — connection-oriented, sequenced, error-checked, three-way handshake\n- <strong>UDP</strong> — connectionless, no error checking, faster\n- Port numbers (\"service point addressing\")\n- Session multiplexing, message acknowledgement, traffic control</p>\n<p>The <strong>three-way handshake</strong>: PC1 proposes a starting sequence number, PC2 acknowledges and proposes its own, and both increment as data flows. Each side's acknowledgement tells the other <em>which sequence number it expects next</em> — which is how missing data gets detected and retransmitted, and how out-of-order arrivals get reassembled in the right order.</p>\n<div class=\"callout pin\"><p>📌 The connection-oriented vs connectionless split is the same idea at Layers 2 and 4. <strong>Streaming video → connectionless.</strong> If a frame of a hockey game drops, retransmitting it is useless — the puck has already gone behind the net, and replaying a past moment is worse than a brief dropout. <strong>Financial data → connection-oriented.</strong> Every byte of that invoice has to arrive.</p></div>\n<p><strong>Layer 5 — Session.</strong> Establishes, maintains, and gracefully terminates conversations. Establishment covers finding the far end <em>by name</em>, negotiating parameters (encryption? QoS?), and <strong>logging in</strong>. Maintenance includes <strong>checkpoints</strong> — so a failed 10 GB transfer resumes partway rather than restarting. Termination is the graceful shutdown.</p>\n<p>Also owns dialog control: <strong>simplex</strong> (one way only), <strong>half-duplex</strong> (both directions, not simultaneously), <strong>full-duplex</strong> (both directions at once, if hardware and software support it).</p>\n<p>Protocols cited: NetBIOS, DNS, RPC, NFS.</p>\n<p><strong>Layer 6 — Presentation.</strong> The \"translation layer.\" Converts application formats into a common wire format and back. Character encoding (<strong>ASCII</strong> and <strong>EBCDIC</strong>), data conversion (serial stream ↔ block format, integers, floating point, CRLF), <strong>compression</strong>, and <strong>encryption/decryption</strong>.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>Trap worth understanding, not just memorizing:</strong> the course places <strong>SSL/TLS encryption at Layer 6.</strong> Some other sources put TLS at 5, or argue it spans 5–7. In the Wireshark walkthrough, SSL is described as encapsulating layers 5, 6, and 7 together. For the exam, if a question asks where <em>application encryption/decryption</em> happens, answer <strong>Presentation (6)</strong>.</p></div>\n<p><strong>Layer 7 — Application.</strong> The interface between the user (or a user-facing application) and the network stack. Not just browsers — a word processor saving to a network drive traverses the whole stack. Protocols: HTTP, FTP, DHCP, DNS, SMTP, POP3.</p>\n<div class=\"callout pin\"><p>📌 Protocols, not applications, are what make interoperability work. Chrome and Firefox interoperate with any web server because they all speak HTTP/HTML — not because the browsers are alike.</p></div>\n<h3>Peer-layer communication</h3>\n<p>Each layer on the sending device communicates logically with <strong>the same layer</strong> on the receiving device. The session layer on PC1 authenticates against the session layer on PC2. Data physically travels 7→1 down the sender, across the medium (through intermediate devices that operate at their own layers), then 1→7 up the receiver.</p>\n<p><strong>Encapsulation</strong> is the term for adding layer information as data moves down the stack. Decapsulation is stripping it on the way up.</p>\n<h3>Mapping the real world to layers</h3>\n<p>This is the highest-value table in the section. The exam asks \"at what layer is X?\" constantly.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>You see / hear</th>\n<th>Layer</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Bad cable, bad fiber, wireless interference, loopback test</td>\n<td>1</td>\n</tr>\n<tr>\n<td>Ethernet frame, MAC address, EUI-48 / EUI-64, switch, switching</td>\n<td>2</td>\n</tr>\n<tr>\n<td>IP address, subnet mask, router, routing, NAT, fragmentation</td>\n<td>3</td>\n</tr>\n<tr>\n<td>TCP port, UDP port, segment, three-way handshake</td>\n<td>4</td>\n</tr>\n<tr>\n<td>Session start/stop/restart, tunneling, control protocols</td>\n<td>5</td>\n</tr>\n<tr>\n<td>SSL/TLS encrypt-decrypt, ASCII/EBCDIC, compression, JPEG</td>\n<td>6</td>\n</tr>\n<tr>\n<td>The application itself, what's on the screen, HTTP/FTP/DNS</td>\n<td>7</td>\n</tr>\n</tbody>\n</table></div>\n<h3>The Wireshark decode — read it as a layer stack</h3>\n<p>The course walks a captured frame in Wireshark. Learn this as a pattern, because it appears in troubleshooting questions:</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Wireshark line</th>\n<th>Layer</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>Frame 88: 2005 bytes on wire</code></td>\n<td>1</td>\n</tr>\n<tr>\n<td><code>Ethernet II, Src: …, Dst: …</code></td>\n<td>2</td>\n</tr>\n<tr>\n<td><code>Internet Protocol, Src: 72.14.247.19</code></td>\n<td>3</td>\n</tr>\n<tr>\n<td><code>Transmission Control Protocol, Dst Port: 443</code></td>\n<td>4</td>\n</tr>\n<tr>\n<td><code>Secure Sockets Layer</code> (encapsulates the rest)</td>\n<td>5, 6, 7</td>\n</tr>\n</tbody>\n</table></div>\n<p>Reading top-to-bottom in the Wireshark detail pane = reading <strong>bottom-up</strong> through the OSI model.</p>\n<h3>Why the model matters operationally</h3>\n<p>Two reasons the exam cares:</p>\n<ol>\n<li><strong>Common language.</strong> Say \"layer 3 problem\" and every engineer in any organization knows you mean IP/routing.</li>\n<li><strong>Troubleshooting isolation.</strong> Symptoms point to layers. No link light → Layer 1. Can ping by IP but not by name → Layer 7 (DNS). Can reach local hosts but not remote → Layer 3.</li>\n</ol>\n<p>🔗 <strong>A+ crossover:</strong> you already troubleshoot this way — check the cable before you reinstall the OS. OSI just gives the instinct a formal structure.</p>\n<div class=\"lab\"><h3>🔧 LAB 1.1 — OSI Layer Isolation Walkthrough</h3>\n<p>Build a two-switch, one-router topology and deliberately induce a failure at Layers 1, 2, 3, and 7 in sequence. Use Packet Tracer's Simulation Mode with PDU inspection to watch encapsulation happen frame by frame, then diagnose each break by layer.</p></div>\n<hr />", "text": " Source: Day 1 — The OSI Reference Model; Understanding OSI What the OSI model actually is The OSI model comes from the ISO (International Organization for Standardization) — the same body that standardizes everything from accounting practices to shipping container dimensions. It is not software, not hardware, and not a protocol suite. It is a set of guidelines telling manufacturers what functions must happen at each stage of network communication, while leaving how to implement them entirely up to the vendor. That distinction is the whole point. Because every vendor agrees on the functional boundaries, an Ethernet NIC from one company works with a switch from another, and an email sent from Windows arrives readable on Linux. ⚠️ Trap: The exam will offer \"OSI is a protocol suite\" or \"OSI defines which frequencies Wi-Fi uses\" as distractors. It does neither. The protocols we actually run are TCP/IP; OSI is the model we map them onto . And OSI says frequencies must be defined — it does not define them. The IEEE and FCC do that. The seven layers Top down, 7 → 1: # Layer One-word job PDU Lives here 7 Application User interface Data HTTP/S, FTP, DNS, POP3, SMTP, DHCP 6 Presentation Translation Data ASCII/EBCDIC, JPEG/MOV encoding, compression, SSL/TLS encryption 5 Session Conversation control Data Session setup/teardown, checkpoints, tunneling, NetBIOS, RPC, NFS 4 Transport End-to-end delivery Segment (TCP) / Datagram (UDP) TCP, UDP, port numbers 3 Network Routing Packet IP, IP addresses, subnet masks, routers, NAT, fragmentation 2 Data Link Node-to-node Frame MAC addresses, switches, Ethernet, PPP, HDLC 1 Physical Bits on the wire Bit Cables, fiber, connectors, radio signals, NICs 📌 Mnemonics. Top down (7→1): All People Seem To Need Data Processing. Bottom up (1→7): Please Do Not Throw Sausage Pizza Away. Learn both directions — questions come at you from either end. Layer by layer, with what you'll actually be asked Layer 1 — Physical. \"Bedknobs and broomsticks — things you can lay your hands on.\" Cables, fiber, connectors, NICs, the signal itself, frequencies, bit rate. Also encoding (how a 1 vs a 0 is represented) and media access rules like the old CSMA/CD. Any two distinguishable states can encode binary — two light frequencies, presence/absence of light, even sonar tones between submarines. Layer 1 troubleshooting = loopback tests, cable testers, checking adapters, looking for wireless interference. Layer 2 — Data Link. Node-to-node delivery. This is where the frame is built by adding physical (MAC) addressing to whatever came down from Layer 3. Responsibilities: physical addressing, framing, media access control, flow control, and error control (which at this layer means retransmission of a frame ). The MAC address is a 12-character hexadecimal value burned into the NIC. First half identifies the manufacturer (the OUI), second half is the node address. Globally unique by registration. Layer 2 splits into two sublayers: - LLC (Logical Link Control) — interfaces up to the network layer, handles connectionless vs connection-oriented behavior - MAC (Media Access Control) — interfaces down to the physical media, owns the hardware address ⚠️ Trap: \"MAC\" here is Media Access Control , nothing to do with Apple. Expect this to be tested as a definition question. Layer 2 protocols named in the course: SDLC, HDLC, SLIP, PPP, LAP. Switches are Layer 2 devices — they forward on destination MAC. Layer 3 — Network. Connects nodes across multiple networks, where Layer 2 only got you across one. Builds the packet and applies logical (IP) addressing. Functions: packetizing, logical addressing, fragmentation (chopping packets down when a downstream network can't carry the original size, and labeling the pieces for reassembly), routing (best-path determination), internetworking, and address conversion via NAT . Layer 4 — Transport. End-to-end delivery. The \"post office layer.\" Creates a single logical pipeline so the upper layers never have to know what the network in between looks like. Owns: - TCP — connection-oriented, sequenced, error-checked, three-way handshake - UDP — connectionless, no error checking, faster - Port numbers (\"service point addressing\") - Session multiplexing, message acknowledgement, traffic control The three-way handshake : PC1 proposes a starting sequence number, PC2 acknowledges and proposes its own, and both increment as data flows. Each side's acknowledgement tells the other which sequence number it expects next — which is how missing data gets detected and retransmitted, and how out-of-order arrivals get reassembled in the right order. 📌 The connection-oriented vs connectionless split is the same idea at Layers 2 and 4. Streaming video → connectionless. If a frame of a hockey game drops, retransmitting it is useless — the puck has already gone behind the net, and replaying a past moment is worse than a brief dropout. Financial data → connection-oriented. Every byte of that invoice has to arrive. Layer 5 — Session. Establishes, maintains, and gracefully terminates conversations. Establishment covers finding the far end by name , negotiating parameters (encryption? QoS?), and logging in . Maintenance includes checkpoints — so a failed 10 GB transfer resumes partway rather than restarting. Termination is the graceful shutdown. Also owns dialog control: simplex (one way only), half-duplex (both directions, not simultaneously), full-duplex (both directions at once, if hardware and software support it). Protocols cited: NetBIOS, DNS, RPC, NFS. Layer 6 — Presentation. The \"translation layer.\" Converts application formats into a common wire format and back. Character encoding ( ASCII and EBCDIC ), data conversion (serial stream ↔ block format, integers, floating point, CRLF), compression , and encryption/decryption . ⚠️ Trap worth understanding, not just memorizing: the course places SSL/TLS encryption at Layer 6. Some other sources put TLS at 5, or argue it spans 5–7. In the Wiresh", "callouts": [{"kind": "trap", "html": "<strong>Trap:</strong> The exam will offer \"OSI is a protocol suite\" or \"OSI defines which frequencies Wi-Fi uses\" as distractors. It does neither. The protocols we actually run are TCP/IP; OSI is the <em>model we map them onto</em>. And OSI says frequencies must be defined — it does not define them. The IEEE and FCC do that."}, {"kind": "pin", "html": "<strong>Mnemonics.</strong> Top down (7→1): <strong>All People Seem To Need Data Processing.</strong> Bottom up (1→7): <strong>Please Do Not Throw Sausage Pizza Away.</strong> Learn both directions — questions come at you from either end."}, {"kind": "trap", "html": "<strong>Trap:</strong> \"MAC\" here is <strong>Media Access Control</strong>, nothing to do with Apple. Expect this to be tested as a definition question."}, {"kind": "pin", "html": "The connection-oriented vs connectionless split is the same idea at Layers 2 and 4. <strong>Streaming video → connectionless.</strong> If a frame of a hockey game drops, retransmitting it is useless — the puck has already gone behind the net, and replaying a past moment is worse than a brief dropout. <strong>Financial data → connection-oriented.</strong> Every byte of that invoice has to arrive."}, {"kind": "trap", "html": "<strong>Trap worth understanding, not just memorizing:</strong> the course places <strong>SSL/TLS encryption at Layer 6.</strong> Some other sources put TLS at 5, or argue it spans 5–7. In the Wireshark walkthrough, SSL is described as encapsulating layers 5, 6, and 7 together. For the exam, if a question asks where <em>application encryption/decryption</em> happens, answer <strong>Presentation (6)</strong>."}, {"kind": "pin", "html": "Protocols, not applications, are what make interoperability work. Chrome and Firefox interoperate with any web server because they all speak HTTP/HTML — not because the browsers are alike."}]}, {"id": "s04", "num": "1.2", "title": "1.2 Networking Appliances, Applications, and Functions", "short": "Networking Appliances, Applicati…", "part": "PART 1 — Networking Concepts (Domain 1.0, 23%)", "html": "<p><em>Source: Day 4 — Networking Appliances</em></p>\n<h3>Switches</h3>\n<p>The most common device on a corporate network and the point of contact for endpoints.</p>\n<p><strong>How a switch learns.</strong> When a host sends its first frame, that frame always contains the host's own source MAC address. The switch records <strong>MAC address → port</strong> in its MAC address table. It repeats this for every host that transmits.</p>\n<p><strong>What happens on a cache miss.</strong> If a frame arrives for a destination MAC the switch doesn't know, it <strong>floods</strong> the frame out <strong>all ports</strong> looking for the destination. Once it learns that MAC, flooding stops for that address.</p>\n<div class=\"callout pin\"><p>📌 This is why switched networks are quieter than hubbed ones — after the initial learning period, traffic is delivered only to the correct port instead of every port.</p></div>\n<p><strong>Layer 2 vs Layer 3 switch:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Layer 2 switch</th>\n<th>Layer 3 switch</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Forwards on</td>\n<td>MAC address</td>\n<td>IP address</td>\n</tr>\n<tr>\n<td>Unit of data</td>\n<td>Frame</td>\n<td>Packet</td>\n</tr>\n<tr>\n<td>Routing</td>\n<td>No</td>\n<td>Yes (limited vs a router)</td>\n</tr>\n<tr>\n<td>Scope</td>\n<td>Within one LAN only</td>\n<td>Within and <strong>between</strong> LANs/VLANs</td>\n</tr>\n<tr>\n<td>Speed</td>\n<td>Fast</td>\n<td>Fast — <strong>faster than a router</strong></td>\n</tr>\n<tr>\n<td>Cost</td>\n<td>Lower</td>\n<td>Higher; higher port density</td>\n</tr>\n<tr>\n<td>Where</td>\n<td>Access layer</td>\n<td>Distribution layer, large enterprise</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ <strong>Why a Layer 3 switch beats a router on speed:</strong> a router does much deeper packet analysis — QoS classification, richer policy, more inspection — not just a destination-IP lookup. Dollar for dollar, a router is slower than a Layer 3 switch at the pure inter-VLAN forwarding job.</p></div>\n<p><strong>ARP — the glue between Layer 3 and Layer 2.</strong> Data ultimately has to leave through a NIC, and NICs address by MAC. <strong>Address Resolution Protocol</strong> resolves a known <strong>logical address (IP)</strong> into the <strong>physical address (MAC)</strong> needed for final delivery on the wire.</p>\n<div class=\"callout pin\"><p>📌 <strong>VLANs.</strong> A single physical switch can be logically divided — take a 24-port switch, put 12 ports in one LAN and 12 in another. Hosts within a VLAN reach each other freely; traffic <em>between</em> VLANs must be routed, which is exactly where you apply control. <strong>You need a Layer 3 device (router or Layer 3 switch) to route between VLANs.</strong></p></div>\n<h3>Routers</h3>\n<p>Connects two or more <strong>packet-switched</strong> networks. On receiving data, a router <strong>strips the framing information and the MAC address</strong>, examines the destination IP, and uses the <strong>network portion</strong> to make a forwarding decision.</p>\n<ul>\n<li>If the destination network is <strong>not</strong> directly connected → find the best route, forward to the next hop.</li>\n<li>If the destination network <strong>is</strong> directly connected → examine the <strong>host portion</strong> and deliver to that host.</li>\n</ul>\n<p><strong>Routing tables</strong> are built manually (static) or automatically via <strong>routing protocols</strong> that share information between routers.</p>\n<p><strong>Router types by role:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Position</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Core</strong></td>\n<td>Center of large networks; moves data between major networks, buildings, thousands of users</td>\n</tr>\n<tr>\n<td><strong>Edge</strong></td>\n<td>Between the corporate network and the outside — other organizations, the internet</td>\n</tr>\n<tr>\n<td><strong>Distribution</strong></td>\n<td>Closer to clients; heavy inter-VLAN routing; connects user-facing networks</td>\n</tr>\n<tr>\n<td><strong>Wireless</strong></td>\n<td>Home: multifunction (AP + switch + router + WAN). Corporate: wireless is usually a separate device on a switch, routing still done by routers</td>\n</tr>\n<tr>\n<td><strong>Virtual</strong></td>\n<td>Software routers inside virtualized/cloud environments, moving traffic between VMs</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Purchase considerations:</strong> connectivity (interface count and types), setup and management (serial console vs web management), security feature depth, flexibility (expansion slots for fiber or extra Ethernet), wireless capability, <strong>bandwidth vs throughput</strong>, automatic updates, QoS controls, interface count for mesh designs, and guest network / per-user isolation.</p>\n<div class=\"callout both\"><p>⚠️ 📌 <strong>Bandwidth ≠ throughput.</strong> A router may have six gigabit interfaces and still be unable to actually pass six gigabits — throughput depends on the internal system board, processor, and <strong>how much inspection the enabled security features are doing</strong>. This distinction shows up in scenario questions about a \"slow\" router that is nominally fast enough.</p></div>\n<h3>Load balancers</h3>\n<p>Sits between users and back-end servers and <strong>distributes incoming requests</strong> across multiple machines (often virtual servers).</p>\n<p><strong>What it delivers:</strong>\n- <strong>High availability / reliability</strong> — if a back-end server fails, the user doesn't see it, because the user is connected to the load balancer, which they perceive <em>as</em> the server. The request is seamlessly served by another server holding the same content.\n- <strong>Scalability</strong> — spin up more virtual servers as load grows; the load balancer starts using 4 or 5 instead of 3, invisibly to the user.\n- <strong>Application security</strong> — control which users or groups reach which applications; external users see one set of resources, internal users another.\n- <strong>Application performance</strong> — hold response times steady under increasing load.</p>\n<div class=\"callout pin\"><p>📌 <strong>Distribution is not just round-robin.</strong> Load balancers continuously monitor the traffic and load on back-end servers and can direct a request to <strong>the server with the least load</strong>.</p></div>\n<h3>Proxy servers</h3>\n<p>Works <strong>on behalf of the internal client</strong>. The client's request is intercepted; <strong>the proxy</strong> goes out to the internet, not the client.</p>\n<p><strong>Benefits:</strong>\n- <strong>Usage control</strong> — restrict which sites are reachable and at what times of day.\n- <strong>Bandwidth saving via caching</strong> — the proxy fetches and caches the page locally. The second user requesting it is served from the local cache over the fast internal network instead of the slow internet link.\n- <strong>Privacy</strong> — external servers see only the proxy making requests, never the internal clients.\n- <strong>Security concentration</strong> — you can harden <em>one</em> proxy thoroughly rather than trying to harden 3,000 workstations and making mistakes.</p>\n<p><strong>Features:</strong> access control via <strong>URL filtering</strong> (or IP ranges), <strong>content scanning</strong> (inbound malware and inappropriate content), and <strong>outbound inspection</strong> — catching things like Social Security numbers leaving the organization. Exemptions can be granted per-user or by username/password.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>Proxy vs load balancer, stated as the exam wants it:</strong> a <strong>proxy acts on behalf of the client</strong> (forward, outbound). A <strong>load balancer acts on behalf of the servers</strong> (inbound distribution). Direction is the discriminator.</p></div>\n<h3>Firewalls</h3>\n<p>A security device that stops unauthorized access <strong>between networks</strong> and monitors traffic in <strong>both directions</strong> — it can block traffic leaving as well as entering. What it stops depends entirely on <strong>administrator-defined policy</strong>. Usually placed between the untrusted outside (internet) and the trusted inside, but it can be deployed internally too.</p>\n<p><strong>Hardware vs software:</strong> a hardware firewall is a purpose-built self-contained appliance. A software firewall (e.g. the one built into Windows) is one component among many on a host, protecting that host's network connection.</p>\n<p><strong>Firewall types by OSI layer</strong> — this table is heavily tested:</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Type</th>\n<th>OSI layer</th>\n<th>Filters on</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Packet filtering</strong></td>\n<td>Network (3)</td>\n<td>IP addresses — source/destination, network portion</td>\n</tr>\n<tr>\n<td><strong>Circuit-level</strong></td>\n<td>Transport (4)</td>\n<td><strong>Port numbers</strong> (HTTP 80, SMTP 25)</td>\n</tr>\n<tr>\n<td><strong>Application firewall</strong></td>\n<td>Application (7)</td>\n<td><strong>Entire reassembled files/messages</strong> — e.g. scanning an email body for credit card numbers</td>\n</tr>\n<tr>\n<td><strong>Stateful</strong></td>\n<td>Tracks connection state</td>\n<td>Whether the session was initiated from inside</td>\n</tr>\n<tr>\n<td><strong>Next-generation (NGFW)</strong></td>\n<td>Multiple</td>\n<td>Combines the above across several layers</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>Stateful firewall, worked example</strong> (this is the classic exam scenario): your browser requests a page on <strong>port 80</strong>. Your PC picks a random source port, say <strong>3355</strong>, for the reply. The web server responds to 3355 and the stateful firewall <strong>allows it, because the PC initiated the connection.</strong> An unsolicited inbound connection to port 3355 from outside is <strong>blocked</strong>, because no internal host started it.</p></div>\n<div class=\"callout trap\"><p>⚠️ An application-layer firewall has to <strong>reassemble the entire message</strong> to inspect it — that's why deeper inspection costs more money and more processing.</p></div>\n<p><strong>The DMZ / screened subnet.</strong> Place one firewall at the internet perimeter and a second behind it; the space between is the <strong>DMZ (demilitarized zone)</strong>. Put the web server there. Open port 80 on the <strong>outer</strong> firewall so the public can reach it; <strong>close port 80 on the inner</strong> firewall. Internal users retrieve data from the server on a <em>different</em> port that is open on the inner firewall only. <strong>If the web server is attacked, only the DMZ host is exposed — the internal network isn't reachable from it.</strong></p>\n<p><strong>Purchase considerations:</strong> technical objectives, placement, required speed, which OSI layer it must inspect at, traffic inspection depth, and cost — deeper inspection is more expensive because it must maintain throughput while doing more work.</p>\n<h3>IDS and IPS</h3>\n<p>An <strong>Intrusion Detection System</strong> monitors for malicious activity, suspicious traffic patterns (unusual increases or decreases), and <strong>security policy violations</strong> — for example, users on one network reaching a network they shouldn't.</p>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>The IDS/IPS distinction is about placement, and this is the single most tested fact here:</strong></p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>IDS</th>\n<th>IPS</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Placement</td>\n<td><strong>Out-of-band</strong> — monitors a copy of traffic</td>\n<td><strong>In-band / in-line</strong> — all traffic passes through it</td>\n</tr>\n<tr>\n<td>Action</td>\n<td><strong>Alerts.</strong> Traffic keeps flowing</td>\n<td><strong>Blocks.</strong> Can automatically stop traffic</td>\n</tr>\n<tr>\n<td>Risk of a false positive</td>\n<td>Nuisance alert</td>\n<td><strong>Stops legitimate traffic — network work halts</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p>Many products do both. <strong>Standard practice: deploy in detection mode first</strong>, spend the first few months tuning and identifying false alarms, then enable prevention once you trust its judgment.</p>\n<p><strong>Classification by location:</strong>\n- <strong>NIDS (network-based)</strong> — inspects all traffic across the network.\n- <strong>HIDS (host-based)</strong> — software running on a <strong>high-value asset</strong>, e.g. the server holding the financial database, giving extra scrutiny to traffic in and out of that host specifically.</p>\n<p><strong>Classification by detection method:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Signature-based</th>\n<th>Anomaly-based</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>How</td>\n<td>Downloads a vendor signature database on a schedule; matches traffic against known threats</td>\n<td>Observes the network with admin input to learn what \"normal\" looks like over days or weeks</td>\n</tr>\n<tr>\n<td>Strength</td>\n<td>Reliable on known threats</td>\n<td><strong>Adaptable; can catch a threat faster than signatures, including things not yet in any database</strong></td>\n</tr>\n<tr>\n<td>Weakness</td>\n<td><strong>Misses anything not in the database</strong></td>\n<td><strong>More prone to false positives</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Advantages of IDS:</strong> false positives can be tuned out (\"that Friday traffic spike was the sale\"); data examined in <strong>protocol context</strong> (web requests crossing a network segment with no web servers is worth a look); supports <strong>post-attack analysis</strong> by preserving what the network looked like during the attack; supports <strong>compliance</strong> evidence; and improves general efficiency by surfacing things like broadcast storms from a misconfigured device.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>IDS limitations — expect these as \"which is a weakness\" questions:</strong>\n- <strong>Source addresses can be spoofed</strong>, and this is very hard for an IDS to detect.\n- <strong>Encrypted packets can't be read</strong> without decryption keys. An attacker can flood an IDS with encrypted traffic that passes through uninspected — or simply overwhelms the system.\n- <strong>Analytic limitations</strong> — both the system's analysis capability <em>and</em> whether the humans reading the output can distinguish a real threat from noise.\n- <strong>False alarms</strong>, which on an IPS means shutting down production traffic.</p></div>\n<h3>NAS vs SAN</h3>\n<p><strong>NAS (Network Attached Storage).</strong> A device with multiple disks, connected to the <strong>Ethernet</strong> network through a switch, sharing files to many computers. Files appear to users like an ordinary Windows share — find it by name, log in with credentials, access files. Managed through its own built-in web page over HTTPS.</p>\n<ul>\n<li><strong>File-level</strong> access using standard network protocols: <strong>NFS</strong> (Linux) and <strong>SMB</strong> (Windows).</li>\n<li>Lower cost, easy administration, RAID redundancy (mirroring, RAID 5), scalable both by adding drives and by buying more units.</li>\n<li>📌 <strong>Faster and cheaper than cloud storage</strong> for local use — cloud access goes over the internet link, which is far slower than the internal network, and carries an ongoing cost rather than a one-time purchase.</li>\n</ul>\n<p><strong>SAN (Storage Area Network).</strong> Far more robust — built for high-performance and mission-critical applications. Runs on a <strong>fiber network</strong> in the background with a <strong>Fibre Channel switch</strong>, not an Ethernet switch.</p>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>The core difference:</strong> NAS is <strong>file-level over Ethernet in packets</strong>. SAN is <strong>block-level</strong>, and the storage <strong>appears to the client as a directly attached device like a local hard disk</strong>. That is why SAN transfers are much faster.</p></div>\n<p>SAN characteristics: more expensive units, much faster drives, RAID arrays, massive scalability (limited mainly by the network), a dedicated <strong>metadata server</strong> managing the RAID arrays with its own OS, and strong disaster recovery through multiple drives across multiple cabinets and servers.</p>\n<p><em>Use case given:</em> video editors sharing large media files can be connected <strong>directly to the Fibre Channel switch by fiber</strong>, off the Ethernet network entirely, because they need that throughput.</p>\n<h3>Wireless access points</h3>\n<p>A special-purpose device for WLANs that acts as a <strong>bridge between the wired and wireless networks</strong>. Every AP eventually connects to a wired network to reach resources like the internet.</p>\n<ul>\n<li><strong>Home:</strong> a multifunction device — AP + switch + router + internet connection in one box.</li>\n<li><strong>Corporate:</strong> a <strong>separate device</strong>, typically ceiling-mounted, with an Ethernet run back to a switch in the closet. Multiple APs are managed <strong>centrally</strong> from a wireless controller.</li>\n</ul>\n<div class=\"callout pin\"><p>📌 APs on different switches may be on <strong>different subnets</strong> (traffic between them must route) <strong>or share the same subnet</strong> — both designs are common.</p></div>\n<p><strong>Client-side connection options:</strong> built-in adapters (most modern laptops and mobile devices), PC card adapters (older laptops), USB adapters, and expansion-slot cards (desktops, which usually lack built-in wireless).</p>\n<p><strong>Why wireless needs stronger security than wired.</strong> On copper, the conversation is inside the cable — eavesdropping requires physical access to the closet. On wireless, <strong>the signal is floating in the air and anyone with an adapter can monitor it.</strong> Hence more robust, and different, security controls.</p>\n<p><strong>Benefits:</strong> extends service where wired is impractical or too expensive; <strong>external APs</strong> mounted on building exteriors provide outdoor campus coverage that wiring can't reasonably deliver.</p>\n<p><strong>Wireless threats introduced here:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Threat</th>\n<th>What it is</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>SSID broadcast</strong></td>\n<td>The network name, broadcast so clients can find it. You <em>can</em> hide it, but ⚠️ <strong>hiding the SSID is weak security</strong> — freely downloadable software can force the AP to reveal it</td>\n</tr>\n<tr>\n<td><strong>Rogue AP</strong></td>\n<td>An unauthorized AP connected to the company network. 📌 <strong>Often not an attacker at all</strong> — just an employee who wanted wireless and plugged one in. Doubly dangerous because that employee lacks the skill to secure it, so any passerby can get in</td>\n</tr>\n<tr>\n<td><strong>Evil twin</strong></td>\n<td>An AP broadcasting <strong>the same SSID as a legitimate one</strong>. Users see two identical networks and pick one essentially at random, not realizing one is malicious</td>\n</tr>\n</tbody>\n</table></div>\n<h3>CDN — Content Delivery Network</h3>\n<p>A <strong>worldwide collection of caching servers</strong> that serve content to local users, reducing latency and improving application response time.</p>\n<p><strong>How it works.</strong> Your origin server is in Canada. A user in Europe requests content by URL. The request is intercepted and served by a <strong>CDN point-of-presence (PoP) server</strong> in Europe. <strong>Origin servers periodically push updated content</strong> to the PoP servers so cached content stays fresh. The next European user is served locally instead of pulling across transoceanic fiber.</p>\n<p><strong>Used for:</strong> web applications, <strong>media files and streaming video</strong> (bandwidth-heavy, so proximity helps a lot), and corporate cloud storage.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>Pricing scales with data volume</strong> — a static web page is far cheaper to serve than gigabytes of cloud storage.</p></div>\n<p><strong>Configuration options:</strong>\n- <strong>Geo-filtering</strong> — allow or deny based on <strong>source IP</strong>, since IP ranges are allocated to countries. Used to block content in jurisdictions where it isn't permitted.\n- <strong>Content compression</strong> — browsers check whether a site supports compression; enabling it reduces data transferred and speeds access.\n- <strong>Caching rules / site acceleration</strong> — cache specific content where it's actually used (English pages in the US, French pages in France). Faster <em>and</em> cheaper.\n- <strong>Custom domains</strong> — create subdomains pointing at caching servers so content appears to originate closer to the user.</p>\n<h3>QoS — Quality of Service</h3>\n<p>Manages traffic to reduce <strong>packet loss, latency, and jitter</strong>, and lets an organization prioritize traffic for higher-performing applications. Less important traffic <strong>waits</strong> so that important traffic goes first.</p>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>\"Important\" here means delay-intolerant, not business-critical.</strong> A payroll file is business-critical, but it can arrive slightly out of order with small delays and still reassemble perfectly. <strong>Video cannot.</strong> This inversion is a favorite exam trick — the correct answer prioritizes voice and video <em>over</em> a financial transfer, even though the financial data is \"more important\" in a business sense.</p></div>\n<p><strong>Delay-sensitive traffic:</strong> IPTV, gaming, <strong>VoIP</strong>, streaming media, video conferencing.</p>\n<p><strong>Mechanism:</strong> a <strong>code is inserted into the frames</strong> of prioritized traffic. Switches and routers along the path read these markings and prioritize accordingly, holding other traffic.</p>\n<h3>VPN — Virtual Private Network</h3>\n<p>An <strong>encrypted connection</strong> between two endpoints. The source scrambles, the destination unscrambles.</p>\n<p><strong>Deployment shapes:</strong>\n- <strong>Host-to-host</strong> — PC to PC, or PC to server.\n- <strong>Site-to-site</strong> — internal traffic is unencrypted, but traffic leaving for a branch office in another country is encrypted at the boundary and decrypted on arrival.\n- <strong>Remote access</strong> — from the business demarc to a home worker's computer.</p>\n<div class=\"callout pin\"><p>📌 It's <strong>\"virtual\"</strong> because it isn't a separate physical network — it traverses the public network (telephone or cable infrastructure), but encryption makes it function as a private one. Anyone intercepting it sees scrambled traffic because they lack the keys.</p></div>\n<h3>TTL — Time to Live</h3>\n<p>A mechanism built into IP to manage packet lifespan. A misdirected packet could otherwise bounce between routers indefinitely, clogging the network. <strong>TTL is a hop count, not a clock</strong> — each router decrements it, and when it reaches zero the packet is discarded.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>Correction to the source material.</strong> The transcript states the default TTL is 16 hops. That figure is <strong>RIP's maximum hop count (16 = unreachable/infinity)</strong>, not the IP TTL default. Real IP TTL defaults are typically <strong>64 (Linux/macOS), 128 (Windows), or 255 (many network devices)</strong>. Know the real numbers — the 64/128 distinction is genuinely useful, because a <code>ping</code> reply's TTL value hints at the responding OS and how many hops away it is.</p></div>\n<div class=\"lab\"><h3>🔧 LAB 1.2 — Appliance Placement and Traffic Control</h3>\n<p>Build an enterprise topology with a DMZ (dual firewall), an internal Layer 3 switch doing inter-VLAN routing, a server farm, and wireless APs. Verify MAC learning and flooding behavior in Simulation Mode, prove the stateful firewall's inbound/outbound asymmetry, and demonstrate ARP resolution frame by frame. Break/fix: rogue AP introduction, evil twin, and a misconfigured DMZ rule that exposes the internal network.</p></div>\n<hr />", "text": " Source: Day 4 — Networking Appliances Switches The most common device on a corporate network and the point of contact for endpoints. How a switch learns. When a host sends its first frame, that frame always contains the host's own source MAC address. The switch records MAC address → port in its MAC address table. It repeats this for every host that transmits. What happens on a cache miss. If a frame arrives for a destination MAC the switch doesn't know, it floods the frame out all ports looking for the destination. Once it learns that MAC, flooding stops for that address. 📌 This is why switched networks are quieter than hubbed ones — after the initial learning period, traffic is delivered only to the correct port instead of every port. Layer 2 vs Layer 3 switch: Layer 2 switch Layer 3 switch Forwards on MAC address IP address Unit of data Frame Packet Routing No Yes (limited vs a router) Scope Within one LAN only Within and between LANs/VLANs Speed Fast Fast — faster than a router Cost Lower Higher; higher port density Where Access layer Distribution layer, large enterprise ⚠️ Why a Layer 3 switch beats a router on speed: a router does much deeper packet analysis — QoS classification, richer policy, more inspection — not just a destination-IP lookup. Dollar for dollar, a router is slower than a Layer 3 switch at the pure inter-VLAN forwarding job. ARP — the glue between Layer 3 and Layer 2. Data ultimately has to leave through a NIC, and NICs address by MAC. Address Resolution Protocol resolves a known logical address (IP) into the physical address (MAC) needed for final delivery on the wire. 📌 VLANs. A single physical switch can be logically divided — take a 24-port switch, put 12 ports in one LAN and 12 in another. Hosts within a VLAN reach each other freely; traffic between VLANs must be routed, which is exactly where you apply control. You need a Layer 3 device (router or Layer 3 switch) to route between VLANs. Routers Connects two or more packet-switched networks. On receiving data, a router strips the framing information and the MAC address , examines the destination IP, and uses the network portion to make a forwarding decision. If the destination network is not directly connected → find the best route, forward to the next hop. If the destination network is directly connected → examine the host portion and deliver to that host. Routing tables are built manually (static) or automatically via routing protocols that share information between routers. Router types by role: Type Position Core Center of large networks; moves data between major networks, buildings, thousands of users Edge Between the corporate network and the outside — other organizations, the internet Distribution Closer to clients; heavy inter-VLAN routing; connects user-facing networks Wireless Home: multifunction (AP + switch + router + WAN). Corporate: wireless is usually a separate device on a switch, routing still done by routers Virtual Software routers inside virtualized/cloud environments, moving traffic between VMs Purchase considerations: connectivity (interface count and types), setup and management (serial console vs web management), security feature depth, flexibility (expansion slots for fiber or extra Ethernet), wireless capability, bandwidth vs throughput , automatic updates, QoS controls, interface count for mesh designs, and guest network / per-user isolation. ⚠️ 📌 Bandwidth ≠ throughput. A router may have six gigabit interfaces and still be unable to actually pass six gigabits — throughput depends on the internal system board, processor, and how much inspection the enabled security features are doing . This distinction shows up in scenario questions about a \"slow\" router that is nominally fast enough. Load balancers Sits between users and back-end servers and distributes incoming requests across multiple machines (often virtual servers). What it delivers: - High availability / reliability — if a back-end server fails, the user doesn't see it, because the user is connected to the load balancer, which they perceive as the server. The request is seamlessly served by another server holding the same content. - Scalability — spin up more virtual servers as load grows; the load balancer starts using 4 or 5 instead of 3, invisibly to the user. - Application security — control which users or groups reach which applications; external users see one set of resources, internal users another. - Application performance — hold response times steady under increasing load. 📌 Distribution is not just round-robin. Load balancers continuously monitor the traffic and load on back-end servers and can direct a request to the server with the least load . Proxy servers Works on behalf of the internal client . The client's request is intercepted; the proxy goes out to the internet, not the client. Benefits: - Usage control — restrict which sites are reachable and at what times of day. - Bandwidth saving via caching — the proxy fetches and caches the page locally. The second user requesting it is served from the local cache over the fast internal network instead of the slow internet link. - Privacy — external servers see only the proxy making requests, never the internal clients. - Security concentration — you can harden one proxy thoroughly rather than trying to harden 3,000 workstations and making mistakes. Features: access control via URL filtering (or IP ranges), content scanning (inbound malware and inappropriate content), and outbound inspection — catching things like Social Security numbers leaving the organization. Exemptions can be granted per-user or by username/password. ⚠️ Proxy vs load balancer, stated as the exam wants it: a proxy acts on behalf of the client (forward, outbound). A load balancer acts on behalf of the servers (inbound distribution). Direction is the discriminator. Firewalls A security device that stops unauthorized access between networks and monitors traffic in both directions — it can block traf", "callouts": [{"kind": "pin", "html": "This is why switched networks are quieter than hubbed ones — after the initial learning period, traffic is delivered only to the correct port instead of every port."}, {"kind": "trap", "html": "<strong>Why a Layer 3 switch beats a router on speed:</strong> a router does much deeper packet analysis — QoS classification, richer policy, more inspection — not just a destination-IP lookup. Dollar for dollar, a router is slower than a Layer 3 switch at the pure inter-VLAN forwarding job."}, {"kind": "pin", "html": "<strong>VLANs.</strong> A single physical switch can be logically divided — take a 24-port switch, put 12 ports in one LAN and 12 in another. Hosts within a VLAN reach each other freely; traffic <em>between</em> VLANs must be routed, which is exactly where you apply control. <strong>You need a Layer 3 device (router or Layer 3 switch) to route between VLANs.</strong>"}, {"kind": "pin", "html": "<strong>Bandwidth ≠ throughput.</strong> A router may have six gigabit interfaces and still be unable to actually pass six gigabits — throughput depends on the internal system board, processor, and <strong>how much inspection the enabled security features are doing</strong>. This distinction shows up in scenario questions about a \"slow\" router that is nominally fast enough."}, {"kind": "pin", "html": "<strong>Distribution is not just round-robin.</strong> Load balancers continuously monitor the traffic and load on back-end servers and can direct a request to <strong>the server with the least load</strong>."}, {"kind": "trap", "html": "<strong>Proxy vs load balancer, stated as the exam wants it:</strong> a <strong>proxy acts on behalf of the client</strong> (forward, outbound). A <strong>load balancer acts on behalf of the servers</strong> (inbound distribution). Direction is the discriminator."}, {"kind": "pin", "html": "<strong>Stateful firewall, worked example</strong> (this is the classic exam scenario): your browser requests a page on <strong>port 80</strong>. Your PC picks a random source port, say <strong>3355</strong>, for the reply. The web server responds to 3355 and the stateful firewall <strong>allows it, because the PC initiated the connection.</strong> An unsolicited inbound connection to port 3355 from outside is <strong>blocked</strong>, because no internal host started it."}, {"kind": "trap", "html": "An application-layer firewall has to <strong>reassemble the entire message</strong
