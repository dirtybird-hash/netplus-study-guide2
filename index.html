ong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>By algorithm:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Distance Vector</strong></th>\n<th><strong>Link State</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Knows</td>\n<td>Only what neighbors tell it — \"routing by rumor\"</td>\n<td><strong>The full topology map</strong></td>\n</tr>\n<tr>\n<td>Metric</td>\n<td>Hop count (RIP)</td>\n<td><strong>Cost</strong>, based on bandwidth (OSPF)</td>\n</tr>\n<tr>\n<td>Updates</td>\n<td>Periodic, full table to neighbors</td>\n<td><strong>Triggered</strong>, only on change; floods LSAs</td>\n</tr>\n<tr>\n<td>Convergence</td>\n<td><strong>Slow</strong></td>\n<td><strong>Fast</strong></td>\n</tr>\n<tr>\n<td>Resource use</td>\n<td>Low CPU/memory</td>\n<td><strong>Higher</strong> CPU/memory</td>\n</tr>\n<tr>\n<td>Loop risk</td>\n<td>Higher — needs split horizon, poison reverse, hold-down timers</td>\n<td>Lower — each router computes its own tree (SPF/Dijkstra)</td>\n</tr>\n<tr>\n<td>Examples</td>\n<td>RIP, RIPv2</td>\n<td><strong>OSPF</strong>, IS-IS</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ <strong>EIGRP is a hybrid</strong> (Cisco calls it \"advanced distance vector\") — it uses distance-vector mechanics with link-state-like triggered updates and neighbor relationships. If a question offers \"hybrid,\" that's EIGRP.</p></div>\n<h3>The routing protocols in detail</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Protocol</th>\n<th>Type</th>\n<th>Metric</th>\n<th>Max hops</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>RIP / RIPv2</strong></td>\n<td>Distance vector, IGP</td>\n<td><strong>Hop count</strong></td>\n<td><strong>15</strong> (16 = unreachable)</td>\n<td>Simple, slow to converge, small networks only. RIPv2 adds subnet mask support (classless) and multicast updates</td>\n</tr>\n<tr>\n<td><strong>OSPF</strong></td>\n<td><strong>Link state</strong>, IGP</td>\n<td><strong>Cost</strong> (bandwidth-based)</td>\n<td>Unlimited</td>\n<td>Open standard, scales well, uses <strong>areas</strong> with <strong>area 0</strong> as the backbone. Runs Dijkstra's SPF</td>\n</tr>\n<tr>\n<td><strong>EIGRP</strong></td>\n<td>Hybrid, IGP</td>\n<td>Bandwidth + delay (composite)</td>\n<td>255</td>\n<td><strong>Cisco-proprietary</strong> (later opened). Fast convergence via DUAL and feasible successors</td>\n</tr>\n<tr>\n<td><strong>BGP</strong></td>\n<td><strong>Path vector</strong>, EGP</td>\n<td>AS-path and policy attributes</td>\n<td>—</td>\n<td><strong>The routing protocol of the internet.</strong> Routes between autonomous systems; policy-driven rather than purely shortest-path</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>RIP's 16-hop infinity</strong> is the number the Day 4 transcript mistakenly attributed to IP TTL. Keep them separate: <strong>RIP max = 15 usable hops, 16 = unreachable.</strong></p></div>\n<div class=\"callout pin\"><p>📌 <strong>BGP's role from the cloud section:</strong> BGP is how you <strong>advertise your network</strong> so others can find and reach it. That's the practical framing.</p></div>\n<h3>Route selection</h3>\n<p>When multiple paths to the same destination exist, a router decides in this order:</p>\n<ol>\n<li><strong>Longest prefix match (most specific route) wins.</strong> 📌 A route to 10.1.1.0/24 beats a route to 10.0.0.0/8 for traffic to 10.1.1.5 — <strong>regardless of protocol or metric.</strong> This is checked first and it is the single most tested route-selection fact.</li>\n<li><strong>Administrative distance (AD)</strong> — trustworthiness of the <em>source</em>, used when different protocols offer the same prefix. <strong>Lower is better.</strong></li>\n<li><strong>Metric</strong> — used to break ties <em>within</em> the same protocol. Lower is better.</li>\n</ol>\n<div class=\"callout pin\"><p>📌 <strong>Administrative distance values to memorize:</strong></p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Route source</th>\n<th>AD</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Directly connected</td>\n<td><strong>0</strong></td>\n</tr>\n<tr>\n<td>Static route</td>\n<td><strong>1</strong></td>\n</tr>\n<tr>\n<td>EIGRP (internal)</td>\n<td>90</td>\n</tr>\n<tr>\n<td>OSPF</td>\n<td><strong>110</strong></td>\n</tr>\n<tr>\n<td>RIP</td>\n<td><strong>120</strong></td>\n</tr>\n<tr>\n<td>External EIGRP</td>\n<td>170</td>\n</tr>\n<tr>\n<td>Unknown / unusable</td>\n<td><strong>255</strong></td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ A static route (AD 1) will <strong>always</strong> beat an OSPF route (AD 110) to the same prefix. If someone left a stale static route in place, dynamic routing \"isn't working\" — and this is a very common troubleshooting scenario.</p></div>\n<h3>NAT and PAT</h3>\n<p><em>(Covered in depth in section 1.7 — the essentials, restated in routing context.)</em></p>\n<p><strong>NAT</strong> lets systems on a LAN reach the internet <strong>without a public IP address for every LAN system</strong>. <strong>PAT</strong> extends this by multiplexing many private hosts behind one public address using <strong>port numbers</strong>.</p>\n<div class=\"callout trap\"><p>⚠️ NAT was never designed as a security control. It became one incidentally because inbound connections aren't permitted by default. Don't confuse a side effect with a firewall.</p></div>\n<h3>FHRP — First Hop Redundancy Protocol</h3>\n<p><strong>The problem it solves.</strong> Almost every production host has a default gateway configured, and in almost every case <strong>there is only one</strong>. If that gateway goes down, <strong>all external connectivity is lost</strong> for every host on that subnet.</p>\n<p><strong>The solution.</strong> Deploy <strong>multiple routers</strong>, and present clients with a <strong>virtual IP address</strong> as their default gateway. The VIP is <strong>not bound to any real interface on any real router</strong> — the protocol recognizes it as an address that exists purely to accept incoming client requests. One router is active; if it fails, another assumes the VIP.</p>\n<div class=\"callout pin\"><p>📌 <strong>The key property: clients never reconfigure anything.</strong> They keep pointing at the same gateway address. Failover is invisible.</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Protocol</th>\n<th>Standard?</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>HSRP</strong></td>\n<td><strong>Cisco-proprietary</strong></td>\n<td>Active/standby</td>\n</tr>\n<tr>\n<td><strong>VRRP</strong></td>\n<td><strong>Open standard</strong></td>\n<td>Master/backup — the vendor-neutral choice</td>\n</tr>\n<tr>\n<td><strong>GLBP</strong></td>\n<td><strong>Cisco-proprietary</strong></td>\n<td>📌 Adds <strong>load balancing</strong> — multiple routers forward simultaneously, not just one active</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ <strong>HSRP and VRRP are active/standby: only one router forwards at a time.</strong> GLBP is the one that actually load-balances. That distinction is a reliable exam question.</p></div>\n<h3>Subinterfaces and router-on-a-stick</h3>\n<p><em>(See section 1.7 for the addressing mechanics.)</em> Converting one physical interface into multiple logical ones, each with its own IP and VLAN, so a single router interface can be the default gateway for many VLANs across an 802.1Q trunk.</p>\n<div class=\"callout trap\"><p>⚠️ Router-on-a-stick works but the single physical link is a <strong>bandwidth bottleneck and a single point of failure</strong>. A <strong>Layer 3 switch</strong> doing inter-VLAN routing in hardware is faster (see 1.2) and is what you'd deploy in production.</p></div>\n<h3>Bandwidth management</h3>\n<p><strong>QoS</strong> — covered in 1.2. The essential point: <strong>prioritize delay-intolerant traffic</strong> (voice, video, real-time) over delay-tolerant traffic (file transfers, backups, email), even when the delay-tolerant traffic is more \"important\" to the business.</p>\n<p><strong>Traffic shaping vs policing:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Shaping</strong></th>\n<th><strong>Policing</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Excess traffic</td>\n<td><strong>Buffered and delayed</strong></td>\n<td><strong>Dropped</strong> (or re-marked)</td>\n</tr>\n<tr>\n<td>Effect on throughput</td>\n<td>Smooths bursts</td>\n<td>Enforces a hard ceiling</td>\n</tr>\n<tr>\n<td>Adds latency</td>\n<td>Yes</td>\n<td>No</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Link aggregation (LAG / LACP / EtherChannel).</strong> Bundles multiple physical links into one logical link for <strong>more bandwidth and redundancy</strong>. <strong>LACP (802.3ad)</strong> is the open standard for negotiating it.</p>\n<div class=\"callout pin\"><p>📌 LAG solves part of the problem STP creates — it presents multiple physical links to STP as a <strong>single logical link</strong>, so STP doesn't block the redundant members.</p></div>\n<div class=\"lab\"><h3>🔧 LAB 2.1 — Routing and Redundancy</h3>\n<p>Multi-router topology running static routes, RIPv2, and OSPF simultaneously to demonstrate administrative distance in action. Configure router-on-a-stick inter-VLAN routing, then migrate it to a Layer 3 switch. Add HSRP/VRRP with a virtual gateway IP and prove failover by shutting the active router mid-ping. Break/fix: a stale static route overriding OSPF, a missing <code>network</code> statement, an OSPF area mismatch, and an FHRP priority misconfiguration that puts the wrong router in the active role.</p></div>\n<hr />", "text": " Source: Day 8 — Routing & Switching Technologies; Day 9 — Network Implementations Static vs dynamic routing Static routing. Routes between source and destination networks are manually configured by an administrator. Advantages Disadvantages No protocol overhead — no CPU, memory, or bandwidth spent on updates Does not adapt. A failed link means manual intervention Predictable and precise Doesn't scale — administrative burden grows fast More secure — no routing advertisements to intercept or spoof Error-prone at scale 📌 Where static wins: small networks, stub networks with only one way out, and the default route ( 0.0.0.0/0 ) — the \"if I don't know where else to send this, send it here\" entry. Dynamic routing. Routers learn routes from each other automatically and adapt when the topology changes. Advantages Disadvantages Adapts automatically to failures Consumes CPU, memory, and bandwidth Scales to large networks More complex to configure and troubleshoot Less administrative overhead ongoing Larger attack surface if not authenticated Routing protocol classification 📌 Two axes. Know both — questions mix them. By scope: Type Meaning Examples IGP (Interior Gateway Protocol) Within one autonomous system RIP, OSPF, EIGRP EGP (Exterior Gateway Protocol) Between autonomous systems BGP By algorithm: Distance Vector Link State Knows Only what neighbors tell it — \"routing by rumor\" The full topology map Metric Hop count (RIP) Cost , based on bandwidth (OSPF) Updates Periodic, full table to neighbors Triggered , only on change; floods LSAs Convergence Slow Fast Resource use Low CPU/memory Higher CPU/memory Loop risk Higher — needs split horizon, poison reverse, hold-down timers Lower — each router computes its own tree (SPF/Dijkstra) Examples RIP, RIPv2 OSPF , IS-IS ⚠️ EIGRP is a hybrid (Cisco calls it \"advanced distance vector\") — it uses distance-vector mechanics with link-state-like triggered updates and neighbor relationships. If a question offers \"hybrid,\" that's EIGRP. The routing protocols in detail Protocol Type Metric Max hops Notes RIP / RIPv2 Distance vector, IGP Hop count 15 (16 = unreachable) Simple, slow to converge, small networks only. RIPv2 adds subnet mask support (classless) and multicast updates OSPF Link state , IGP Cost (bandwidth-based) Unlimited Open standard, scales well, uses areas with area 0 as the backbone. Runs Dijkstra's SPF EIGRP Hybrid, IGP Bandwidth + delay (composite) 255 Cisco-proprietary (later opened). Fast convergence via DUAL and feasible successors BGP Path vector , EGP AS-path and policy attributes — The routing protocol of the internet. Routes between autonomous systems; policy-driven rather than purely shortest-path 📌 RIP's 16-hop infinity is the number the Day 4 transcript mistakenly attributed to IP TTL. Keep them separate: RIP max = 15 usable hops, 16 = unreachable. 📌 BGP's role from the cloud section: BGP is how you advertise your network so others can find and reach it. That's the practical framing. Route selection When multiple paths to the same destination exist, a router decides in this order: Longest prefix match (most specific route) wins. 📌 A route to 10.1.1.0/24 beats a route to 10.0.0.0/8 for traffic to 10.1.1.5 — regardless of protocol or metric. This is checked first and it is the single most tested route-selection fact. Administrative distance (AD) — trustworthiness of the source , used when different protocols offer the same prefix. Lower is better. Metric — used to break ties within the same protocol. Lower is better. 📌 Administrative distance values to memorize: Route source AD Directly connected 0 Static route 1 EIGRP (internal) 90 OSPF 110 RIP 120 External EIGRP 170 Unknown / unusable 255 ⚠️ A static route (AD 1) will always beat an OSPF route (AD 110) to the same prefix. If someone left a stale static route in place, dynamic routing \"isn't working\" — and this is a very common troubleshooting scenario. NAT and PAT (Covered in depth in section 1.7 — the essentials, restated in routing context.) NAT lets systems on a LAN reach the internet without a public IP address for every LAN system . PAT extends this by multiplexing many private hosts behind one public address using port numbers . ⚠️ NAT was never designed as a security control. It became one incidentally because inbound connections aren't permitted by default. Don't confuse a side effect with a firewall. FHRP — First Hop Redundancy Protocol The problem it solves. Almost every production host has a default gateway configured, and in almost every case there is only one . If that gateway goes down, all external connectivity is lost for every host on that subnet. The solution. Deploy multiple routers , and present clients with a virtual IP address as their default gateway. The VIP is not bound to any real interface on any real router — the protocol recognizes it as an address that exists purely to accept incoming client requests. One router is active; if it fails, another assumes the VIP. 📌 The key property: clients never reconfigure anything. They keep pointing at the same gateway address. Failover is invisible. Protocol Standard? Notes HSRP Cisco-proprietary Active/standby VRRP Open standard Master/backup — the vendor-neutral choice GLBP Cisco-proprietary 📌 Adds load balancing — multiple routers forward simultaneously, not just one active ⚠️ HSRP and VRRP are active/standby: only one router forwards at a time. GLBP is the one that actually load-balances. That distinction is a reliable exam question. Subinterfaces and router-on-a-stick (See section 1.7 for the addressing mechanics.) Converting one physical interface into multiple logical ones, each with its own IP and VLAN, so a single router interface can be the default gateway for many VLANs across an 802.1Q trunk. ⚠️ Router-on-a-stick works but the single physical link is a bandwidth bottleneck and a single point of failure . A Layer 3 switch doing inter-VLAN routing in hardware is faster (see 1.2) and is what you'd deploy in prod", "callouts": [{"kind": "pin", "html": "<strong>Where static wins:</strong> small networks, stub networks with only one way out, and the <strong>default route</strong> (<code>0.0.0.0/0</code>) — the \"if I don't know where else to send this, send it here\" entry."}, {"kind": "pin", "html": "Two axes. Know both — questions mix them."}, {"kind": "trap", "html": "<strong>EIGRP is a hybrid</strong> (Cisco calls it \"advanced distance vector\") — it uses distance-vector mechanics with link-state-like triggered updates and neighbor relationships. If a question offers \"hybrid,\" that's EIGRP."}, {"kind": "pin", "html": "<strong>RIP's 16-hop infinity</strong> is the number the Day 4 transcript mistakenly attributed to IP TTL. Keep them separate: <strong>RIP max = 15 usable hops, 16 = unreachable.</strong>"}, {"kind": "pin", "html": "<strong>BGP's role from the cloud section:</strong> BGP is how you <strong>advertise your network</strong> so others can find and reach it. That's the practical framing."}, {"kind": "pin", "html": "<strong>Administrative distance values to memorize:</strong>"}, {"kind": "trap", "html": "A static route (AD 1) will <strong>always</strong> beat an OSPF route (AD 110) to the same prefix. If someone left a stale static route in place, dynamic routing \"isn't working\" — and this is a very common troubleshooting scenario."}, {"kind": "trap", "html": "NAT was never designed as a security control. It became one incidentally because inbound connections aren't permitted by default. Don't confuse a side effect with a firewall."}, {"kind": "pin", "html": "<strong>The key property: clients never reconfigure anything.</strong> They keep pointing at the same gateway address. Failover is invisible."}, {"kind": "trap", "html": "<strong>HSRP and VRRP are active/standby: only one router forwards at a time.</strong> GLBP is the one that actually load-balances. That distinction is a reliable exam question."}, {"kind": "trap", "html": "Router-on-a-stick works but the single physical link is a <strong>bandwidth bottleneck and a single point of failure</strong>. A <strong>Layer 3 switch</strong> doing inter-VLAN routing in hardware is faster (see 1.2) and is what you'd deploy in production."}, {"kind": "pin", "html": "LAG solves part of the problem STP creates — it presents multiple physical links to STP as a <strong>single logical link</strong>, so STP doesn't block the redundant members."}]}, {"id": "s12", "num": "2.2", "title": "2.2 Ethernet Switching Features", "short": "Ethernet Switching Features", "part": "PART 2 — Infrastructure (Domain 2.0, 20%)", "html": "<p><em>Source: Day 5 — Ethernet Switching &amp; Wireless Standards; Day 8 — Routing &amp; Switching Technologies; Day 9 — Network Implementations</em></p>\n<h3>VLANs</h3>\n<p>A <strong>logical grouping of devices</strong> that abstracts away physical connections. Ports on the same switch can belong to different VLANs, and one VLAN can <strong>span multiple switches</strong>.</p>\n<p><strong>Why:</strong>\n- <strong>Segmentation</strong> — broadcast traffic stays inside the VLAN, shrinking broadcast domains\n- <strong>Security</strong> — separate finance from guest from production\n- <strong>Flexibility</strong> — group by function or department, not by physical location\n- <strong>Performance</strong> — fewer broadcasts per segment</p>\n<div class=\"callout pin\"><p>📌 <strong>Each VLAN is its own broadcast domain and requires its own subnet.</strong> Traffic between VLANs must be <strong>routed</strong> by a Layer 3 device. This is the single most important VLAN fact.</p></div>\n<p><strong>The VLAN database.</strong> Stores VLAN IDs, names, and properties such as MTU. Stored in <strong><code>vlan.dat</code></strong> in <strong>non-volatile memory</strong>, so it survives a power cycle.</p>\n<div class=\"callout trap\"><p>⚠️ <strong><code>vlan.dat</code> is separate from the running/startup config.</strong> Erasing the startup configuration does <strong>not</strong> delete VLANs — you must delete <code>vlan.dat</code> separately. This trips people up in labs constantly.</p></div>\n<p><strong>VTP (VLAN Trunking Protocol).</strong> Distributes VLAN configuration from a central <strong>VTP server</strong> to all switches, so you don't configure every VLAN on every switch. ⚠️ <strong>VTP is Cisco-proprietary</strong> — in a mixed-vendor environment you'll need another approach.</p>\n<p><strong>Default VLAN.</strong> VLAN 1 on Cisco gear. 📌 Security best practice: <strong>move user ports off VLAN 1</strong> and change the native VLAN on trunks, because VLAN 1 carries control traffic and is a known target.</p>\n<h3>Voice VLAN</h3>\n<p>A VLAN specifically allocated to <strong>VoIP traffic</strong>.</p>\n<p><strong>Why separate voice:</strong> voice is delay-intolerant (see QoS in 1.2). Isolating it lets you apply <strong>QoS marking</strong> consistently, keeps data traffic from starving calls, and simplifies both troubleshooting and security policy.</p>\n<div class=\"callout pin\"><p>📌 The typical deployment: an IP phone with a built-in switch sits between the wall port and the PC. The single switchport carries <strong>tagged voice traffic</strong> on the voice VLAN and <strong>untagged data traffic</strong> on the access VLAN, simultaneously.</p></div>\n<h3>802.1Q trunking and port tagging</h3>\n<div class=\"callout pin\"><p>📌 <strong>IEEE 802.1Q</strong> is the standard for VLAN tagging. It inserts a <strong>4-byte tag</strong> into the Ethernet frame containing the VLAN ID.</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Port type</th>\n<th>Carries</th>\n<th>Tagging</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Access port</strong></td>\n<td><strong>One</strong> VLAN</td>\n<td><strong>Untagged</strong> — the end device is unaware of VLANs</td>\n</tr>\n<tr>\n<td><strong>Trunk port</strong></td>\n<td><strong>Multiple</strong> VLANs</td>\n<td><strong>Tagged</strong> with 802.1Q, except the native VLAN</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Native VLAN.</strong> The one VLAN whose traffic crosses a trunk <strong>untagged</strong>. ⚠️ 📌 <strong>The native VLAN must match on both ends of a trunk.</strong> A mismatch causes traffic from one VLAN to silently land in another — a serious security problem (VLAN hopping) and a classic troubleshooting scenario. Symptom: hosts in different VLANs unexpectedly reach each other, or traffic disappears.</p>\n<p>Because the VLAN ID field is 12 bits, the maximum is <strong>4,096 VLANs</strong> — the limitation VXLAN was created to solve (section 1.8).</p>\n<h3>Switch interface configuration</h3>\n<p>Options you'll be asked about:</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Setting</th>\n<th>What it does</th>\n<th>Trap</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Speed</strong></td>\n<td>10/100/1000 Mbps</td>\n<td>⚠️ Hard-set on one side and auto on the other → <strong>duplex mismatch</strong></td>\n</tr>\n<tr>\n<td><strong>Duplex</strong></td>\n<td>Half or full</td>\n<td>Same trap</td>\n</tr>\n<tr>\n<td><strong>Auto-negotiation</strong></td>\n<td>Both ends negotiate speed and duplex</td>\n<td>Best practice is <strong>auto on both ends, or manual on both ends — never mixed</strong></td>\n</tr>\n<tr>\n<td><strong>Port security</strong></td>\n<td>Restricts which MACs may use a port</td>\n<td>Applied at the <strong>access layer</strong></td>\n</tr>\n<tr>\n<td><strong>Administrative state</strong></td>\n<td><code>shutdown</code> / <code>no shutdown</code></td>\n<td>Ports may be administratively down</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>Duplex mismatch is a top-tier exam symptom.</strong> One side full duplex, the other half. The link comes up and works — but throughput collapses and you see <strong>late collisions, CRC/FCS errors, and runts</strong> on the interface counters. The connection is not \"down,\" which is exactly why it's confusing. Look at interface error counters, not link lights.</p></div>\n<p><strong>Port security modes:</strong>\n- <strong>Protect</strong> — drops violating frames silently\n- <strong>Restrict</strong> — drops and logs/increments a counter\n- <strong>Shutdown</strong> — 📌 the <strong>default</strong>; puts the port in <strong>err-disabled</strong> state, requiring manual recovery</p>\n<h3>Power over Ethernet (PoE)</h3>\n<p>Standard Ethernet cable carries <strong>electrical power as well as data</strong>.</p>\n<p><strong>Typical devices:</strong> VoIP phones, wireless APs and Wi-Fi extenders, IP cameras.</p>\n<p><strong>Benefits:</strong>\n- <strong>Cost savings</strong> — no separate power runs. 📌 The transcript's example is the key one: security cameras mounted <strong>outside a building or high near a ceiling</strong>, where there is no power. PoE means you only pull one Ethernet cable.\n- <strong>Safety and reliability</strong> — power comes from a centralized, universally compatible source, and devices have built-in protection against overload and underpowering.\n- <strong>Scalability</strong> — extend the network, not the electrical system.\n- <strong>Flexibility</strong> — install anywhere Ethernet reaches.</p>\n<p><strong>PoE standards — know the wattage tiers:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Standard</th>\n<th>Name</th>\n<th>Power at the port</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>802.3af</strong></td>\n<td>PoE</td>\n<td>~15.4 W</td>\n</tr>\n<tr>\n<td><strong>802.3at</strong></td>\n<td>PoE+</td>\n<td>~30 W</td>\n</tr>\n<tr>\n<td><strong>802.3bt</strong></td>\n<td>PoE++ / 4PPoE</td>\n<td>~60 W (Type 3) / ~100 W (Type 4)</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ <strong>Power budget is a real constraint.</strong> A switch has a total PoE budget. Attaching more high-draw devices than the budget allows means some simply won't power on — a \"the AP won't boot\" symptom that has nothing to do with the network.</p></div>\n<p><strong>PSE vs PD:</strong> the <strong>Power Sourcing Equipment</strong> (switch or injector) supplies; the <strong>Powered Device</strong> consumes.</p>\n<h3>Spanning Tree Protocol (STP)</h3>\n<p><strong>The problem.</strong> Redundant links at Layer 2 create <strong>switching loops</strong>. Ethernet frames have <strong>no TTL</strong> — unlike IP packets — so a looping frame circulates forever. Broadcast frames multiply on every pass, producing a <strong>broadcast storm</strong> that saturates the network and can bring it down entirely.</p>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>\"Why do Layer 2 loops need STP when Layer 3 loops resolve themselves?\"</strong> Because IP has TTL and Ethernet does not. That single fact is the answer to a whole family of exam questions.</p></div>\n<p><strong>What STP does.</strong> Builds a loop-free logical topology by <strong>blocking redundant links</strong>, keeping them in reserve. If an active link fails, a blocked link is brought up.</p>\n<p><strong>How it converges:</strong>\n1. Elect a <strong>root bridge</strong> — the switch with the lowest <strong>bridge ID</strong> (bridge priority + MAC address). Lowest priority wins; MAC address breaks ties.\n2. Each non-root switch selects one <strong>root port</strong> — its lowest-cost path toward the root.\n3. Each segment selects one <strong>designated port</strong>.\n4. All remaining ports are <strong>blocked</strong>.</p>\n<p><strong>Port states (classic STP):</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>State</th>\n<th>Forwards data?</th>\n<th>Learns MACs?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Blocking</td>\n<td>No</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Listening</td>\n<td>No</td>\n<td>No</td>\n</tr>\n<tr>\n<td>Learning</td>\n<td>No</td>\n<td><strong>Yes</strong></td>\n</tr>\n<tr>\n<td>Forwarding</td>\n<td><strong>Yes</strong></td>\n<td>Yes</td>\n</tr>\n<tr>\n<td>Disabled</td>\n<td>No</td>\n<td>No</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ Classic 802.1D convergence takes <strong>30–50 seconds</strong>. <strong>RSTP (802.1w)</strong> converges in seconds and is what you should prefer. <strong>MSTP (802.1s)</strong> maps multiple VLANs to spanning tree instances.</p></div>\n<p><strong>PortFast / edge ports.</strong> Skips listening and learning on ports connected to end devices so they forward immediately. 📌 <strong>Never enable PortFast on a port connected to another switch</strong> — you reintroduce the loop risk you were trying to prevent. Pair with <strong>BPDU Guard</strong>, which shuts the port down if it ever receives a BPDU.</p>\n<p><strong>The trade-off STP forces</strong> — and this connects back to spine-leaf in section 1.6: you paid for redundant links and STP won't let you use them. That's exactly why data centers moved leaf-to-spine connectivity to <strong>Layer 3</strong>.</p>\n<h3>CSMA/CD and CSMA/CA</h3>\n<p><strong>CSMA/CD — Carrier Sense Multiple Access with Collision Detection.</strong> The legacy Ethernet rule for shared media: listen before transmitting; if the medium is busy, wait; if two stations transmit at once, detect the collision, send a jam signal, and back off a random interval before retrying.</p>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>CSMA/CD is effectively obsolete on modern switched, full-duplex Ethernet</strong> — there is no shared medium and therefore no collision domain. It mattered in the hub era. <strong>If you see collisions on a modern full-duplex link, that is a duplex mismatch symptom, not normal operation.</strong></p></div>\n<p><strong>CSMA/CA — Collision <em>Avoidance</em>.</strong> Used by <strong>wireless</strong>, because a station cannot transmit and listen simultaneously, so collisions can't be <em>detected</em>. Instead it avoids them — check that the channel is idle, wait a random backoff, and optionally use RTS/CTS handshaking.</p>\n<h3>ARP and NDP</h3>\n<p><strong>ARP (Address Resolution Protocol)</strong> resolves a known <strong>IPv4 address</strong> to a <strong>MAC address</strong>. The host broadcasts \"who has this IP?\"; the owner replies with its MAC; the result is cached in the <strong>ARP table</strong>.</p>\n<p>Useful commands: <code>arp -a</code> to view the cache, <code>arp -d</code> to clear it.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>ARP is unauthenticated</strong>, which is what makes <strong>ARP spoofing / ARP poisoning</strong> possible — an attacker answers for an IP that isn't theirs and inserts themselves in the path (on-path attack). Detection: two IPs mapping to the same MAC, or a gateway MAC that suddenly changes.</p></div>\n<p><strong>NDP (Neighbor Discovery Protocol)</strong> is the <strong>IPv6 equivalent of ARP</strong>, and does more:</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Function</th>\n<th>Purpose</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Neighbor Solicitation / Advertisement</td>\n<td>Address resolution (ARP's job)</td>\n</tr>\n<tr>\n<td>Router Solicitation / Advertisement</td>\n<td>Finding routers and prefixes — enables <strong>SLAAC</strong></td>\n</tr>\n<tr>\n<td>Duplicate Address Detection</td>\n<td>Verifies uniqueness before use</td>\n</tr>\n<tr>\n<td>Redirect</td>\n<td>Points a host at a better next hop</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>NDP uses ICMPv6 multicast, not broadcast</strong> — consistent with IPv6 having no broadcast at all.</p></div>\n<h3>MTU and jumbo frames</h3>\n<p><strong>MTU (Maximum Transmission Unit)</strong> is the largest payload an interface will carry in one frame. <strong>Standard Ethernet MTU = 1500 bytes.</strong></p>\n<p><strong>Jumbo frames</strong> exceed that — typically <strong>9000 bytes</strong>. Fewer, larger frames mean less per-frame overhead and lower CPU load, which is why they're used in <strong>storage networks and data centers</strong>.</p>\n<div class=\"callout both\"><p>⚠️ 📌 <strong>MTU must match end to end.</strong> A mismatch causes fragmentation, or — worse — silent black-holing when packets have the <strong>Don't Fragment</strong> bit set and an intermediate link can't carry them. The classic symptom is maddening: <strong>small packets (ping) succeed while large transfers fail or hang.</strong> If you see \"ping works but the file share times out,\" test with <code>ping -f -l &lt;size&gt;</code> (Windows) to find the real path MTU.</p></div>\n<div class=\"lab\"><h3>🔧 LAB 2.2 — Switching Deep Dive</h3>\n<p>Multi-switch build with VLANs spanning switches, 802.1Q trunks, a voice VLAN with a PC behind an IP phone, port security in all three violation modes, and STP root bridge manipulation. Break/fix: native VLAN mismatch, a duplex mismatch producing late collisions, an err-disabled port, a deliberately induced broadcast storm with STP disabled, and an MTU mismatch that passes ping but fails file transfer.</p></div>\n<hr />", "text": " Source: Day 5 — Ethernet Switching & Wireless Standards; Day 8 — Routing & Switching Technologies; Day 9 — Network Implementations VLANs A logical grouping of devices that abstracts away physical connections. Ports on the same switch can belong to different VLANs, and one VLAN can span multiple switches . Why: - Segmentation — broadcast traffic stays inside the VLAN, shrinking broadcast domains - Security — separate finance from guest from production - Flexibility — group by function or department, not by physical location - Performance — fewer broadcasts per segment 📌 Each VLAN is its own broadcast domain and requires its own subnet. Traffic between VLANs must be routed by a Layer 3 device. This is the single most important VLAN fact. The VLAN database. Stores VLAN IDs, names, and properties such as MTU. Stored in vlan.dat in non-volatile memory , so it survives a power cycle. ⚠️ vlan.dat is separate from the running/startup config. Erasing the startup configuration does not delete VLANs — you must delete vlan.dat separately. This trips people up in labs constantly. VTP (VLAN Trunking Protocol). Distributes VLAN configuration from a central VTP server to all switches, so you don't configure every VLAN on every switch. ⚠️ VTP is Cisco-proprietary — in a mixed-vendor environment you'll need another approach. Default VLAN. VLAN 1 on Cisco gear. 📌 Security best practice: move user ports off VLAN 1 and change the native VLAN on trunks, because VLAN 1 carries control traffic and is a known target. Voice VLAN A VLAN specifically allocated to VoIP traffic . Why separate voice: voice is delay-intolerant (see QoS in 1.2). Isolating it lets you apply QoS marking consistently, keeps data traffic from starving calls, and simplifies both troubleshooting and security policy. 📌 The typical deployment: an IP phone with a built-in switch sits between the wall port and the PC. The single switchport carries tagged voice traffic on the voice VLAN and untagged data traffic on the access VLAN, simultaneously. 802.1Q trunking and port tagging 📌 IEEE 802.1Q is the standard for VLAN tagging. It inserts a 4-byte tag into the Ethernet frame containing the VLAN ID. Port type Carries Tagging Access port One VLAN Untagged — the end device is unaware of VLANs Trunk port Multiple VLANs Tagged with 802.1Q, except the native VLAN Native VLAN. The one VLAN whose traffic crosses a trunk untagged . ⚠️ 📌 The native VLAN must match on both ends of a trunk. A mismatch causes traffic from one VLAN to silently land in another — a serious security problem (VLAN hopping) and a classic troubleshooting scenario. Symptom: hosts in different VLANs unexpectedly reach each other, or traffic disappears. Because the VLAN ID field is 12 bits, the maximum is 4,096 VLANs — the limitation VXLAN was created to solve (section 1.8). Switch interface configuration Options you'll be asked about: Setting What it does Trap Speed 10/100/1000 Mbps ⚠️ Hard-set on one side and auto on the other → duplex mismatch Duplex Half or full Same trap Auto-negotiation Both ends negotiate speed and duplex Best practice is auto on both ends, or manual on both ends — never mixed Port security Restricts which MACs may use a port Applied at the access layer Administrative state shutdown / no shutdown Ports may be administratively down 📌 ⚠️ Duplex mismatch is a top-tier exam symptom. One side full duplex, the other half. The link comes up and works — but throughput collapses and you see late collisions, CRC/FCS errors, and runts on the interface counters. The connection is not \"down,\" which is exactly why it's confusing. Look at interface error counters, not link lights. Port security modes: - Protect — drops violating frames silently - Restrict — drops and logs/increments a counter - Shutdown — 📌 the default ; puts the port in err-disabled state, requiring manual recovery Power over Ethernet (PoE) Standard Ethernet cable carries electrical power as well as data . Typical devices: VoIP phones, wireless APs and Wi-Fi extenders, IP cameras. Benefits: - Cost savings — no separate power runs. 📌 The transcript's example is the key one: security cameras mounted outside a building or high near a ceiling , where there is no power. PoE means you only pull one Ethernet cable. - Safety and reliability — power comes from a centralized, universally compatible source, and devices have built-in protection against overload and underpowering. - Scalability — extend the network, not the electrical system. - Flexibility — install anywhere Ethernet reaches. PoE standards — know the wattage tiers: Standard Name Power at the port 802.3af PoE ~15.4 W 802.3at PoE+ ~30 W 802.3bt PoE++ / 4PPoE ~60 W (Type 3) / ~100 W (Type 4) ⚠️ Power budget is a real constraint. A switch has a total PoE budget. Attaching more high-draw devices than the budget allows means some simply won't power on — a \"the AP won't boot\" symptom that has nothing to do with the network. PSE vs PD: the Power Sourcing Equipment (switch or injector) supplies; the Powered Device consumes. Spanning Tree Protocol (STP) The problem. Redundant links at Layer 2 create switching loops . Ethernet frames have no TTL — unlike IP packets — so a looping frame circulates forever. Broadcast frames multiply on every pass, producing a broadcast storm that saturates the network and can bring it down entirely. 📌 ⚠️ \"Why do Layer 2 loops need STP when Layer 3 loops resolve themselves?\" Because IP has TTL and Ethernet does not. That single fact is the answer to a whole family of exam questions. What STP does. Builds a loop-free logical topology by blocking redundant links , keeping them in reserve. If an active link fails, a blocked link is brought up. How it converges: 1. Elect a root bridge — the switch with the lowest bridge ID (bridge priority + MAC address). Lowest priority wins; MAC address breaks ties. 2. Each non-root switch selects one root port — its lowest-cost path toward the root. 3. Each segment selects one designated port . 4. All re", "callouts": [{"kind": "pin", "html": "<strong>Each VLAN is its own broadcast domain and requires its own subnet.</strong> Traffic between VLANs must be <strong>routed</strong> by a Layer 3 device. This is the single most important VLAN fact."}, {"kind": "trap", "html": "<strong><code>vlan.dat</code> is separate from the running/startup config.</strong> Erasing the startup configuration does <strong>not</strong> delete VLANs — you must delete <code>vlan.dat</code> separately. This trips people up in labs constantly."}, {"kind": "pin", "html": "The typical deployment: an IP phone with a built-in switch sits between the wall port and the PC. The single switchport carries <strong>tagged voice traffic</strong> on the voice VLAN and <strong>untagged data traffic</strong> on the access VLAN, simultaneously."}, {"kind": "pin", "html": "<strong>IEEE 802.1Q</strong> is the standard for VLAN tagging. It inserts a <strong>4-byte tag</strong> into the Ethernet frame containing the VLAN ID."}, {"kind": "pin", "html": "<strong>Duplex mismatch is a top-tier exam symptom.</strong> One side full duplex, the other half. The link comes up and works — but throughput collapses and you see <strong>late collisions, CRC/FCS errors, and runts</strong> on the interface counters. The connection is not \"down,\" which is exactly why it's confusing. Look at interface error counters, not link lights."}, {"kind": "trap", "html": "<strong>Power budget is a real constraint.</strong> A switch has a total PoE budget. Attaching more high-draw devices than the budget allows means some simply won't power on — a \"the AP won't boot\" symptom that has nothing to do with the network."}, {"kind": "pin", "html": "<strong>\"Why do Layer 2 loops need STP when Layer 3 loops resolve themselves?\"</strong> Because IP has TTL and Ethernet does not. That single fact is the answer to a whole family of exam questions."}, {"kind": "trap", "html": "Classic 802.1D convergence takes <strong>30–50 seconds</strong>. <strong>RSTP (802.1w)</strong> converges in seconds and is what you should prefer. <strong>MSTP (802.1s)</strong> maps multiple VLANs to spanning tree instances."}, {"kind": "pin", "html": "<strong>CSMA/CD is effectively obsolete on modern switched, full-duplex Ethernet</strong> — there is no shared medium and therefore no collision domain. It mattered in the hub era. <strong>If you see collisions on a modern full-duplex link, that is a duplex mismatch symptom, not normal operation.</strong>"}, {"kind": "trap", "html": "<strong>ARP is unauthenticated</strong>, which is what makes <strong>ARP spoofing / ARP poisoning</strong> possible — an attacker answers for an IP that isn't theirs and inserts themselves in the path (on-path attack). Detection: two IPs mapping to the same MAC, or a gateway MAC that suddenly changes."}, {"kind": "pin", "html": "<strong>NDP uses ICMPv6 multicast, not broadcast</strong> — consistent with IPv6 having no broadcast at all."}, {"kind": "pin", "html": "<strong>MTU must match end to end.</strong> A mismatch causes fragmentation, or — worse — silent black-holing when packets have the <strong>Don't Fragment</strong> bit set and an intermediate link can't carry them. The classic symptom is maddening: <strong>small packets (ping) succeed while large transfers fail or hang.</strong> If you see \"ping works but the file share times out,\" test with <code>ping -f -l &lt;size&gt;</code> (Windows) to find the real path MTU."}]}, {"id": "s13", "num": "2.3", "title": "2.3 Wireless Technologies", "short": "Wireless Technologies", "part": "PART 2 — Infrastructure (Domain 2.0, 20%)", "html": "<p><em>Source: Day 5 — Ethernet Switching &amp; Wireless Standards; Day 17 — Wireless Configurations &amp; Physical Installations; Day 2 — cellular</em></p>\n<h3>The frequency trade-off</h3>\n<div class=\"callout pin\"><p>📌 <strong>The governing principle, stated once and applied everywhere:</strong> <em>higher frequency = more data throughput but shorter range, because higher frequencies are more readily blocked by walls and obstructions.</em> Every wireless design decision comes back to this.</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Band</th>\n<th>Range</th>\n<th>Throughput</th>\n<th>Channels</th>\n<th>Interference</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>2.4 GHz</strong></td>\n<td><strong>Longer</strong></td>\n<td><strong>Lower</strong></td>\n<td>11 in North America; only <strong>1, 6, 11 non-overlapping</strong></td>\n<td><strong>Heavy</strong> — microwaves, Bluetooth, cordless phones, neighbors</td>\n</tr>\n<tr>\n<td><strong>5 GHz</strong></td>\n<td><strong>Shorter</strong></td>\n<td><strong>Higher</strong></td>\n<td>Many (~24) non-overlapping</td>\n<td>Much less</td>\n</tr>\n<tr>\n<td><strong>6 GHz</strong> (Wi-Fi 6E)</td>\n<td><strong>Shortest</strong> (~11–12 m)</td>\n<td>Highest</td>\n<td>Most</td>\n<td>Least — newly opened</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout both\"><p>⚠️ 📌 <strong>Channels 1, 6, and 11 are the only non-overlapping channels in 2.4 GHz.</strong> This is a guaranteed exam question and a real-world design rule — adjacent APs must be on non-overlapping channels or they degrade each other.</p></div>\n<p><strong>Why 2.4 GHz was chosen first.</strong> The band was largely unoccupied — precisely <em>because</em> it's a poor band for long-distance transmission. <strong>Water in the atmosphere absorbs energy at this frequency</strong>, which is exactly why microwave ovens use it to heat food. Great for cooking, bad for distance. Over short distances it works fine.</p>\n<p><strong>Why 6 GHz opened up.</strong> Spectrum that was previously reserved (television broadcast moved to cable and satellite; some medical and military allocations) was freed for short-range use. Short range is a feature here — you're not interfering with anything 10 miles away.</p>\n<h3>Wi-Fi standards</h3>\n<div class=\"callout pin\"><p>📌 Memorize speed, band, and the Wi-Fi generation name.</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Standard</th>\n<th>Wi-Fi name</th>\n<th>Band</th>\n<th>Max speed</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>802.11</strong> (original)</td>\n<td>—</td>\n<td>2.4 GHz</td>\n<td>1–2 Mbps</td>\n<td>The baseline</td>\n</tr>\n<tr>\n<td><strong>802.11a</strong></td>\n<td>—</td>\n<td><strong>5 GHz</strong></td>\n<td><strong>54 Mbps</strong></td>\n<td>First move to 5 GHz</td>\n</tr>\n<tr>\n<td><strong>802.11b</strong></td>\n<td>—</td>\n<td>2.4 GHz</td>\n<td><strong>11 Mbps</strong></td>\n<td>Backward compatible with 802.11</td>\n</tr>\n<tr>\n<td><strong>802.11g</strong></td>\n<td>—</td>\n<td>2.4 GHz</td>\n<td><strong>54 Mbps</strong></td>\n<td>802.11a speeds on the 2.4 band</td>\n</tr>\n<tr>\n<td><strong>802.11n</strong></td>\n<td><strong>Wi-Fi 4</strong></td>\n<td><strong>2.4 and 5</strong></td>\n<td>600 Mbps</td>\n<td>Introduced <strong>MIMO</strong></td>\n</tr>\n<tr>\n<td><strong>802.11ac</strong></td>\n<td><strong>Wi-Fi 5</strong></td>\n<td>5 GHz</td>\n<td>433 Mbps – <strong>1.3 Gbps+</strong></td>\n<td>Channel bonding, MU-MIMO</td>\n</tr>\n<tr>\n<td><strong>802.11ax</strong></td>\n<td><strong>Wi-Fi 6</strong></td>\n<td>2.4 and 5, <strong>simultaneously</strong></td>\n<td><strong>9.6 Gbps</strong></td>\n<td>OFDMA</td>\n</tr>\n<tr>\n<td><strong>802.11ax</strong></td>\n<td><strong>Wi-Fi 6E</strong></td>\n<td><strong>6 GHz</strong></td>\n<td>9.6 Gbps</td>\n<td>Same standard, new band</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout both\"><p>⚠️ 📌 <strong>The backward-compatibility trap.</strong> If an older, slower client (say 802.11b) associates with a modern AP on the same band, the AP falls back to accommodate it and <strong>the whole network slows down</strong> — because the AP waits on the slow client. This is why \"one old device is killing our Wi-Fi\" is a legitimate diagnosis and why you segregate legacy devices onto their own SSID/band.</p></div>\n<p><strong>Throughput techniques introduced over time</strong> (all of them are <em>encoding and channel</em> tricks, not new frequencies):\n- <strong>MIMO (Multiple Input Multiple Output)</strong> — multiple antennas distinguish a signal arriving directly from one that reflected off a wall, and encode them as separate streams for multiplied throughput.\n- <strong>Channel bonding</strong> — combine multiple channels for a single bandwidth-hungry station. ⚠️ Trade-off: other stations get less.\n- <strong>OFDMA</strong> — the technique 4G/LTE also uses; subdivides channels for many simultaneous users.</p>\n<h3>Cellular</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Generation</th>\n<th>Technology</th>\n<th>Key characteristics</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1G</td>\n<td>Analog</td>\n<td>Voice only</td>\n</tr>\n<tr>\n<td><strong>2G</strong></td>\n<td><strong>GSM</strong>, CDMA</td>\n<td>📌 GSM digitized and <strong>compressed</strong> voice; operates at <strong>900/1800 MHz</strong>; still &gt;90% of global mobile</td>\n</tr>\n<tr>\n<td>3G</td>\n<td>CDMA-based</td>\n<td>Data-capable</td>\n</tr>\n<tr>\n<td><strong>4G</strong></td>\n<td><strong>LTE</strong></td>\n<td>Uses <strong>OFDMA</strong></td>\n</tr>\n<tr>\n<td><strong>5G</strong></td>\n<td>—</td>\n<td><strong>Gigabit speeds and very low latency</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Multiplexing methods worth understanding:</strong>\n- <strong>TDMA (Time Division Multiple Access)</strong> — one channel divided into <strong>time slots</strong>. Three conversations interleave; each gets every third slot. Because data transmission is so much faster than voice, the receiving circuits reassemble it into continuous real-time speech with no audible gaps.\n- <strong>CDMA (Code Division Multiple Access)</strong> — each phone generates a <strong>pseudo-random code</strong> at connection time and mixes it into the data. Other phones hear the transmission but cannot decode it without the code. Allows more simultaneous connections than TDMA.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>Generations are generally not backward compatible</strong> with each other — different frequencies and different encoding. A tower may support several because it contains multiple transmitters, but the standards themselves don't interoperate.</p></div>\n<div class=\"callout pin\"><p>📌 <strong>Why 5G latency matters:</strong> the transcript's framing is good — for remote operation (drones, remote equipment), latency is the difference between turning left and hitting a tree. Bandwidth isn't the only metric.</p></div>\n<h3>SSID and guest networks</h3>\n<p><strong>SSID (Service Set Identifier)</strong> — the network name clients search for and see in a list.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>Hiding the SSID is weak security.</strong> Freely available software can force the AP to reveal it. It raises the bar for a casual user, not for an attacker. Treat it as obscurity, not security.</p></div>\n<p><strong>Guest network</strong> — its own <strong>virtual SSID</strong>, isolated from the internal network. Provides internet access without exposing internal resources. 📌 This is the correct answer whenever a scenario involves visitors, contractors, or personal devices needing connectivity.</p>\n<h3>Wireless security protocols</h3>\n<div class=\"callout pin\"><p>📌 The evolution, and why each step happened:</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Protocol</th>\n<th>Encryption</th>\n<th>Status</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>WEP</strong></td>\n<td>RC4, static key, weak IV</td>\n<td>❌ <strong>Broken.</strong> Crackable in minutes. Never use</td>\n</tr>\n<tr>\n<td><strong>WPA</strong></td>\n<td>RC4 + <strong>TKIP</strong></td>\n<td>❌ Deprecated. Interim fix for WEP</td>\n</tr>\n<tr>\n<td><strong>WPA2</strong></td>\n<td><strong>AES-CCMP</strong></td>\n<td>✅ Still widely used and still considered secure, though vulnerable to specific attacks (e.g. KRACK)</td>\n</tr>\n<tr>\n<td><strong>WPA3</strong></td>\n<td>AES + <strong>SAE</strong></td>\n<td>✅ <strong>Most secure.</strong> Adoption slowed by compatibility</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>The WPA2 → WPA3 distinction is the highest-value fact in this section, and it's about <em>authentication</em>, not just encryption:</strong></p></div>\n<ul>\n<li><strong>WPA2 uses a Pre-Shared Key (PSK).</strong> One code, typed into the AP, used by <strong>every client</strong>. ⚠️ <strong>If the code is cracked, everybody is vulnerable</strong> — all sessions, retroactively.</li>\n<li><strong>WPA3 uses SAE (Simultaneous Authentication of Equals)</strong>, also called the <strong>Dragonfly protocol</strong>. Each device and the AP <strong>negotiate their own separate key</strong>. There is no shared secret between clients. <strong>Each channel is independent</strong>, so compromising one session does not compromise others.</li>\n</ul>\n<p><strong>Why WPA3 isn't universal yet:</strong> it is <strong>not backward compatible with WPA2</strong>, because the authentication methods differ fundamentally. WPA2 devices cannot connect to a WPA3-only network. Some devices can be firmware-upgraded; many cannot, and must be replaced.</p>\n<p><strong>Enterprise vs Personal:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Personal (PSK / SAE)</strong></th>\n<th><strong>Enterprise (802.1X)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Credentials</td>\n<td>One shared passphrase</td>\n<td><strong>Per-user</strong> credentials</td>\n</tr>\n<tr>\n<td>Backend</td>\n<td>None</td>\n<td><strong>RADIUS server</strong></td>\n</tr>\n<tr>\n<td>Framework</td>\n<td>—</td>\n<td><strong>EAP</strong></td>\n</tr>\n<tr>\n<td>Revoking access</td>\n<td>Change the key for everyone</td>\n<td><strong>Disable one user</strong></td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>802.1X / EAP / RADIUS is the answer</strong> whenever a scenario mentions per-user wireless authentication, centralized credentials, or the need to revoke one employee's access without disrupting everyone.</p></div>\n<h3>Antennas</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Radiation pattern</th>\n<th>Use</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Omnidirectional</strong></td>\n<td>360° horizontally — a doughnut shape</td>\n<td>📌 <strong>The most common.</strong> General coverage from a central point; standard indoor APs</td>\n</tr>\n<tr>\n<td><strong>Directional</strong> (Yagi, parabolic/dish)</td>\n<td>Focused beam</td>\n<td>Point-to-point links, long distance, covering a specific area, or reaching a distant building</td>\n</tr>\n<tr>\n<td><strong>Patch / panel</strong></td>\n<td>Hemispherical, one direction</td>\n<td>Wall-mounted coverage of a room or corridor from the edge</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>The design principle:</strong> directional antennas trade coverage area for <strong>range and gain</strong>. Same transmit power, focused instead of spread. If a scenario needs to reach a warehouse 500 m away, the answer is directional.</p></div>\n<h3>Access point types</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Autonomous (fat/thick) AP</strong></th>\n<th><strong>Lightweight (thin) AP</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Intelligence</td>\n<td><strong>Self-contained</strong> — full config on the device</td>\n<td>Config lives on the <strong>Wireless LAN Controller</strong></td>\n</tr>\n<tr>\n<td>Management</td>\n<td><strong>Individually, manually</strong></td>\n<td><strong>Centrally</strong>, from the WLC</td>\n</tr>\n<tr>\n<td>Scale</td>\n<td>⚠️ <strong>Small networks.</strong> Building a workgroup of several is difficult because each must be edited separately</td>\n<td><strong>Large corporate networks</strong> — one controller manages many APs</td>\n</tr>\n<tr>\n<td>Deployment</td>\n<td>Often combined AP + switch in one independent device</td>\n<td>Ceiling-mounted, PoE, cabled back to a switch</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>The scaling argument is the exam point.</strong> Autonomous APs <em>can</em> be grouped, but manual per-device configuration makes consistency painful and error-prone as you add units. A WLC gives you one place to push SSIDs, security policy, channel plans, and power settings — plus features that need a global view, like coordinated channel assignment and roaming.</p></div>\n<h3>Site survey and coverage</h3>\n<p>Concepts that appear in both configuration and troubleshooting questions:</p>\n<ul>\n<li><strong>Site survey</strong> — measure signal strength and interference before deployment; produce a <strong>heat map</strong>.</li>\n<li><strong>RSSI (Received Signal Strength Indicator)</strong> — how strong the received signal is. Closer to 0 is better; <strong>−70 dBm</strong> is a common usable threshold.</li>\n<li><strong>SNR (Signal-to-Noise Ratio)</strong> — signal strength relative to background noise. ⚠️ <strong>A strong signal in a noisy environment still performs badly</strong> — this is why RSSI alone doesn't tell the story.</li>\n<li><strong>EIRP</strong> — effective radiated power, the regulated output limit.</li>\n<li><strong>Channel overlap / co-channel interference</strong> — adjacent APs on the same or overlapping channels degrading each other.</li>\n<li><strong>DFS (Dynamic Frequency Selection)</strong> — required on certain 5 GHz channels to avoid interfering with radar; an AP must vacate the channel if radar is detected.</li>\n</ul>\n<div class=\"lab\"><h3>🔧 LAB 2.3 — Wireless Deployment and Interference</h3>\n<p>Build a multi-AP wireless network in Packet Tracer with a WLC managing lightweight APs, separate corporate and guest SSIDs with VLAN separation, WPA2-Enterprise backed by a RADIUS server, and a 1/6/11 channel plan. Break/fix: two APs sharing a channel, a guest SSID with a route into the internal VLAN, a client stuck on 2.4 GHz dragging the network down, and an evil twin introduced alongside the legitimate SSID.</p></div>\n<hr />", "text": " Source: Day 5 — Ethernet Switching & Wireless Standards; Day 17 — Wireless Configurations & Physical Installations; Day 2 — cellular The frequency trade-off 📌 The governing principle, stated once and applied everywhere: higher frequency = more data throughput but shorter range, because higher frequencies are more readily blocked by walls and obstructions. Every wireless design decision comes back to this. Band Range Throughput Channels Interference 2.4 GHz Longer Lower 11 in North America; only 1, 6, 11 non-overlapping Heavy — microwaves, Bluetooth, cordless phones, neighbors 5 GHz Shorter Higher Many (~24) non-overlapping Much less 6 GHz (Wi-Fi 6E) Shortest (~11–12 m) Highest Most Least — newly opened ⚠️ 📌 Channels 1, 6, and 11 are the only non-overlapping channels in 2.4 GHz. This is a guaranteed exam question and a real-world design rule — adjacent APs must be on non-overlapping channels or they degrade each other. Why 2.4 GHz was chosen first. The band was largely unoccupied — precisely because it's a poor band for long-distance transmission. Water in the atmosphere absorbs energy at this frequency , which is exactly why microwave ovens use it to heat food. Great for cooking, bad for distance. Over short distances it works fine. Why 6 GHz opened up. Spectrum that was previously reserved (television broadcast moved to cable and satellite; some medical and military allocations) was freed for short-range use. Short range is a feature here — you're not interfering with anything 10 miles away. Wi-Fi standards 📌 Memorize speed, band, and the Wi-Fi generation name. Standard Wi-Fi name Band Max speed Notes 802.11 (original) — 2.4 GHz 1–2 Mbps The baseline 802.11a — 5 GHz 54 Mbps First move to 5 GHz 802.11b — 2.4 GHz 11 Mbps Backward compatible with 802.11 802.11g — 2.4 GHz 54 Mbps 802.11a speeds on the 2.4 band 802.11n Wi-Fi 4 2.4 and 5 600 Mbps Introduced MIMO 802.11ac Wi-Fi 5 5 GHz 433 Mbps – 1.3 Gbps+ Channel bonding, MU-MIMO 802.11ax Wi-Fi 6 2.4 and 5, simultaneously 9.6 Gbps OFDMA 802.11ax Wi-Fi 6E 6 GHz 9.6 Gbps Same standard, new band ⚠️ 📌 The backward-compatibility trap. If an older, slower client (say 802.11b) associates with a modern AP on the same band, the AP falls back to accommodate it and the whole network slows down — because the AP waits on the slow client. This is why \"one old device is killing our Wi-Fi\" is a legitimate diagnosis and why you segregate legacy devices onto their own SSID/band. Throughput techniques introduced over time (all of them are encoding and channel tricks, not new frequencies): - MIMO (Multiple Input Multiple Output) — multiple antennas distinguish a signal arriving directly from one that reflected off a wall, and encode them as separate streams for multiplied throughput. - Channel bonding — combine multiple channels for a single bandwidth-hungry station. ⚠️ Trade-off: other stations get less. - OFDMA — the technique 4G/LTE also uses; subdivides channels for many simultaneous users. Cellular Generation Technology Key characteristics 1G Analog Voice only 2G GSM , CDMA 📌 GSM digitized and compressed voice; operates at 900/1800 MHz ; still >90% of global mobile 3G CDMA-based Data-capable 4G LTE Uses OFDMA 5G — Gigabit speeds and very low latency Multiplexing methods worth understanding: - TDMA (Time Division Multiple Access) — one channel divided into time slots . Three conversations interleave; each gets every third slot. Because data transmission is so much faster than voice, the receiving circuits reassemble it into continuous real-time speech with no audible gaps. - CDMA (Code Division Multiple Access) — each phone generates a pseudo-random code at connection time and mixes it into the data. Other phones hear the transmission but cannot decode it without the code. Allows more simultaneous connections than TDMA. ⚠️ Generations are generally not backward compatible with each other — different frequencies and different encoding. A tower may support several because it contains multiple transmitters, but the standards themselves don't interoperate. 📌 Why 5G latency matters: the transcript's framing is good — for remote operation (drones, remote equipment), latency is the difference between turning left and hitting a tree. Bandwidth isn't the only metric. SSID and guest networks SSID (Service Set Identifier) — the network name clients search for and see in a list. ⚠️ Hiding the SSID is weak security. Freely available software can force the AP to reveal it. It raises the bar for a casual user, not for an attacker. Treat it as obscurity, not security. Guest network — its own virtual SSID , isolated from the internal network. Provides internet access without exposing internal resources. 📌 This is the correct answer whenever a scenario involves visitors, contractors, or personal devices needing connectivity. Wireless security protocols 📌 The evolution, and why each step happened: Protocol Encryption Status WEP RC4, static key, weak IV ❌ Broken. Crackable in minutes. Never use WPA RC4 + TKIP ❌ Deprecated. Interim fix for WEP WPA2 AES-CCMP ✅ Still widely used and still considered secure, though vulnerable to specific attacks (e.g. KRACK) WPA3 AES + SAE ✅ Most secure. Adoption slowed by compatibility 📌 ⚠️ The WPA2 → WPA3 distinction is the highest-value fact in this section, and it's about authentication , not just encryption: WPA2 uses a Pre-Shared Key (PSK). One code, typed into the AP, used by every client . ⚠️ If the code is cracked, everybody is vulnerable — all sessions, retroactively. WPA3 uses SAE (Simultaneous Authentication of Equals) , also called the Dragonfly protocol . Each device and the AP negotiate their own separate key . There is no shared secret between clients. Each channel is independent , so compromising one session does not compromise others. Why WPA3 isn't universal yet: it is not backward compatible with WPA2 , because the authentication methods differ fundamentally. WPA2 devices cannot connect to a WPA3-only network. Some devices can ", "callouts": [{"kind": "pin", "html": "<strong>The governing principle, stated once and applied everywhere:</strong> <em>higher frequency = more data throughput but shorter range, because higher frequencies are more readily blocked by walls and obstructions.</em> Every wireless design decision comes back to this."}, {"kind": "pin", "html": "<strong>Channels 1, 6, and 11 are the only non-overlapping channels in 2.4 GHz.</strong> This is a guaranteed exam question and a real-world design rule — adjacent APs must be on non-overlapping channels or they degrade each other."}, {"kind": "pin", "html": "Memorize speed, band, and the Wi-Fi generation name."}, {"kind": "pin", "html": "<strong>The backward-compatibility trap.</strong> If an older, slower client (say 802.11b) associates with a modern AP on the same band, the AP falls back to accommodate it and <strong>the whole network slows down</strong> — because the AP waits on the slow client. This is why \"one old device is killing our Wi-Fi\" is a legitimate diagnosis and why you segregate legacy devices onto their own SSID/band."}, {"kind": "trap", "html": "<strong>Generations are generally not backward compatible</strong> with each other — different frequencies and different encoding. A tower may support several because it contains multiple transmitters, but the standards themselves don't interoperate."}, {"kind": "pin", "html": "<strong>Why 5G latency matters:</strong> the transcript's framing is good — for remote operation (drones, remote equipment), latency is the difference between turning left and hitting a tree. Bandwidth isn't the only metric."}, {"kind": "trap", "html": "<strong>Hiding the SSID is weak security.</strong> Freely available software can force the AP to reveal it. It raises the bar for a casual user, not for an attacker. Treat it as obscurity, not security."}, {"kind": "pin", "html": "The evolution, and why each step happened:"}, {"kind": "pin", "html": "<strong>The WPA2 → WPA3 distinction is the highest-value fact in this section, and it's about <em>authentication</em>, not just encryption:</strong>"}, {"kind": "pin", "html": "<strong>802.1X / EAP / RADIUS is the answer</strong> whenever a scenario mentions per-user wireless authentication, centralized credentials, or the need to revoke one employee's access without disrupting everyone."}, {"kind": "pin", "html": "<strong>The design principle:</strong> directional antennas trade coverage area for <strong>range and gain</strong>. Same transmit power, focused instead of spread. If a scenario needs to reach a warehouse 500 m away, the answer is directional."}, {"kind": "pin", "html": "<strong>The scaling argument is the exam point.</strong> Autonomous APs <em>can</em> be grouped, but manual per-device configuration makes consistency painful and error-prone as you add units. A WLC gives you one place to push SSIDs, security policy, channel plans, and power settings — plus features that need a global view, like coordinated channel assignment and roaming."}]}, {"id": "s14", "num": "2.4", "title": "2.4 Physical Installations and Specialized Devices", "short": "Physical Installations and Speci…", "part": "PART 2 — Infrastructure (Domain 2.0, 20%)", "html": "<p><em>Source: Day 17 — Physical Installations; Day 9 — Network Implementations</em></p>\n<h3>Planning a physical installation</h3>\n<p><strong>Stage one is assessment.</strong> Map the area where the network will be installed and ask:\n- Are all client connections <strong>within the proper distance</strong> of the equipment room?\n- What obstacles — concrete walls, fire breaks — sit between the user and the closet?</p>\n<p><strong>Cabling vocabulary you need:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Term</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Run</strong></td>\n<td>The cable routed from the closet through the ceiling</td>\n</tr>\n<tr>\n<td><strong>Drop</strong></td>\n<td>Where the run comes down the wall to a connector</td>\n</tr>\n<tr>\n<td><strong>Raceway</strong></td>\n<td>📌 A plastic covering adhered to the wall, used when the wall is solid and the cable <strong>must be mounted on the outside</strong> rather than run inside it</td>\n</tr>\n<tr>\n<td><strong>Poles</strong></td>\n<td>Used to bring a drop to a workstation where there is no adjacent wall</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>The TIA/EIA-568 / 569 distance budget — memorize all three numbers:</strong></p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Segment</th>\n<th>Max length</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Equipment room → wall outlet</strong> (the horizontal run)</td>\n<td><strong>90 meters</strong></td>\n</tr>\n<tr>\n<td><strong>Wall outlet → end computer</strong> (patch cable)</td>\n<td><strong>6 meters</strong></td>\n</tr>\n<tr>\n<td><strong>Patch panel → equipment in the rack</strong></td>\n<td><strong>3 meters</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>90 + 6 + 3 = 99</strong>, which is how the familiar <strong>100-meter Ethernet limit</strong> is actually budgeted in practice. This is a much better answer than \"100 meters\" if a question gives you the components separately — and questions do.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>568 vs 569:</strong> apart from the wiring color pattern, the standards are essentially the same and both define things like maximum cable length.</p></div>\n<h3>Equipment rooms, racks, and hardware</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Item</th>\n<th>Purpose</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>MDF (Main Distribution Frame)</strong></td>\n<td>The primary equipment room — where the main termination and core equipment live</td>\n</tr>\n<tr>\n<td><strong>IDF (Intermediate Distribution Frame)</strong></td>\n<td>Satellite closets serving a floor or wing, cabled back to the MDF</td>\n</tr>\n<tr>\n<td><strong>Rack units (U)</strong></td>\n<td>The vertical measurement of rack-mounted equipment; 1U ≈ 1.75 inches</td>\n</tr>\n<tr>\n<td><strong>Patch panel</strong></td>\n<td>Termination point for horizontal runs (see 1.5)</td>\n</tr>\n<tr>\n<td><strong>PDU (Power Distribution Unit)</strong></td>\n<td>Distributes power within the rack</td>\n</tr>\n<tr>\n<td><strong>UPS</strong></td>\n<td>Battery backup and power conditioning (see 1.5)</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 The MDF/IDF hierarchy exists <strong>because of the 90-meter limit.</strong> If users are farther than that from the MDF, you place an IDF closer to them. That's the whole design logic, and it connects the distance number to the room layout.</p></div>\n<h3>Environmental factors</h3>\n<p><strong>The core fact:</strong> all electronic devices <strong>generate heat</strong>, so keeping temperature constant around them is mandatory.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>Scale changes the problem.</strong> In an office with computers spread across a large area, the heat generated doesn't meaningfully warm the room. In a <strong>data center</strong>, many devices are concentrated in a small area — so <strong>planning that room to dissipate heat is imperative</strong>.</p></div>\n<p><strong>HVAC (Heating, Ventilation, and Air Conditioning):</strong></p>\n<div class=\"callout pin\"><p>📌 Two exam-relevant points the transcript makes well:</p></div>\n<ol>\n<li><strong>Fire system integration.</strong> The air an HVAC system circulates <strong>feeds a fire</strong>. In a data center fire, you do not want to keep blowing air onto it. HVAC systems therefore <strong>detect fire and stop ventilation</strong> so they don't make it worse.</li>\n<li><strong>Keep the data center HVAC separate from the building HVAC.</strong> Most office buildings already have HVAC for the people working there. The data center needs its own, so that problems with the main building system don't take down the data center's cooling.</li>\n</ol>\n<p><strong>Other environmental controls:</strong>\n- <strong>Humidity</strong> — ⚠️ <strong>too low → electrostatic discharge; too high → condensation and corrosion.</strong> Both directions are dangerous, and questions often test that you know it's a <em>range</em>, not a maximum.\n- <strong>Airflow management</strong> — hot aisle / cold aisle containment so exhaust from one row doesn't become intake for the next.\n- <strong>Fire suppression</strong> — clean-agent systems rather than water in equipment areas.</p>\n<p>🔗 <strong>A+ crossover:</strong> ESD precautions, proper grounding, and antistatic practice all carry straight over. Same physics, larger scale.</p>\n<h3>Legacy interconnection devices</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Device</th>\n<th>Layer</th>\n<th>Behavior</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Hub</strong></td>\n<td>1</td>\n<td>📌 <strong>\"Just an amplifier.\"</strong> No forwarding intelligence. Repeats every frame out every port. <strong>One collision domain, one broadcast domain.</strong> Obsolete</td>\n</tr>\n<tr>\n<td><strong>Bridge</strong></td>\n<td>2</td>\n<td>Software-based, few ports. Forwards on MAC address. <strong>Segments collision domains.</strong> Essentially the ancestor of the switch</td>\n</tr>\n<tr>\n<td><strong>Switch</strong></td>\n<td>2 (or 3)</td>\n<td>Hardware-based, many ports. <strong>Each port is its own collision domain.</strong> See 1.2</td>\n</tr>\n<tr>\n<td><strong>Router</strong></td>\n<td>3</td>\n<td><strong>Separates broadcast domains.</strong> See 1.2</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>The collision domain / broadcast domain table is a reliable exam question:</strong></p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Device</th>\n<th>Collision domains</th>\n<th>Broadcast domains</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hub</td>\n<td><strong>1</strong> (all ports)</td>\n<td>1</td>\n</tr>\n<tr>\n<td>Switch</td>\n<td><strong>One per port</strong></td>\n<td><strong>1</strong> (unless VLANs)</td>\n</tr>\n<tr>\n<td>Router</td>\n<td>One per interface</td>\n<td><strong>One per interface</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>A switch with VLANs creates one broadcast domain per VLAN.</strong> That's the connection between this table and section 2.2.</p>\n<h3>VoIP — Voice over IP</h3>\n<p>Carrying voice conversations over the data network rather than a separate telephone system.</p>\n<p><strong>Requirements and consequences:</strong>\n- Voice is <strong>delay-intolerant</strong> — needs QoS (see 1.2) and typically a <strong>voice VLAN</strong> (see 2.2)\n- Often powered by <strong>PoE</strong> (see 2.2), so phones need no separate power\n- <strong>SIP</strong> handles signaling (ports 5060/5061); RTP carries the media\n- Replaces the traditional <strong>PBX</strong></p>\n<div class=\"callout trap\"><p>⚠️ <strong>Jitter is the specific enemy of voice</strong> — variation in packet arrival time, not raw latency. Symptoms: choppy audio, echo, dropouts. A network with excellent average latency but high jitter delivers terrible calls.</p></div>\n<h3>IoT — Internet of Things</h3>\n<p>Everyday devices with network connectivity generating large volumes of data. Examples: smart thermostats, cameras, sensors, appliances, medical and industrial devices.</p>\n<div class=\"callout both\"><p>⚠️ 📌 <strong>IoT is a security problem, and that's how it's tested.</strong> These devices commonly ship with default credentials, receive infrequent or no patches, and have limited or no built-in security. <strong>The correct architectural answer is almost always segmentation</strong> — put IoT on its own VLAN or network segment with tightly restricted access to everything else.</p></div>\n<h3>SCADA and ICS</h3>\n<p><strong>SCADA (Supervisory Control and Data Acquisition)</strong> gathers and analyzes data <strong>in real time</strong> to monitor equipment and manage operations in a plant or factory.</p>\n<div class=\"callout pin\"><p>📌 It's related to IoT — many devices generating a lot of data — but the real challenge is <strong>turning raw data into useful information</strong>.</p></div>\n<p><strong>What SCADA does:</strong>\n- Control industrial processes <strong>locally or remotely</strong> across many locations\n- Monitor, gather, and process sensor data in real time\n- <strong>Directly interact</strong> with monitored devices — pumps, motors, control valves — through <strong>HMI (Human Machine Interface)</strong> software\n- Log collected data to a file or database for later analysis</p>\n<div class=\"callout trap\"><p>⚠️ <strong>The security framing that matters:</strong> industrial control systems were designed for <strong>isolated networks</strong> and often run legacy protocols with no authentication or encryption. Connecting them to corporate networks or the internet — for the convenience of remote monitoring — is where the risk enters. <strong>Air-gapping and segmentation</strong> are the standard answers.</p></div>\n<div class=\"lab\"><h3>🔧 LAB 2.4 — Physical Design and Specialized Segments</h3>\n<p>Design a two-floor building layout honoring the 90/6/3 distance budget, placing MDF and IDF appropriately and justifying each. Build it in Packet Tracer with VoIP phones on a PoE switch with a voice VLAN, an isolated IoT segment, and a segmented SCADA/ICS network. Break/fix: a horizontal run exceeding 90 m producing intermittent errors, a PoE budget exceeded so an AP won't boot, an IoT device with a route into the corporate VLAN, and a VoIP call degraded by missing QoS marking.</p></div>\n<hr />", "text": " Source: Day 17 — Physical Installations; Day 9 — Network Implementations Planning a physical installation Stage one is assessment. Map the area where the network will be installed and ask: - Are all client connections within the proper distance of the equipment room? - What obstacles — concrete walls, fire breaks — sit between the user and the closet? Cabling vocabulary you need: Term Meaning Run The cable routed from the closet through the ceiling Drop Where the run comes down the wall to a connector Raceway 📌 A plastic covering adhered to the wall, used when the wall is solid and the cable must be mounted on the outside rather than run inside it Poles Used to bring a drop to a workstation where there is no adjacent wall 📌 ⚠️ The TIA/EIA-568 / 569 distance budget — memorize all three numbers: Segment Max length Equipment room → wall outlet (the horizontal run) 90 meters Wall outlet → end computer (patch cable) 6 meters Patch panel → equipment in the rack 3 meters 90 + 6 + 3 = 99 , which is how the familiar 100-meter Ethernet limit is actually budgeted in practice. This is a much better answer than \"100 meters\" if a question gives you the components separately — and questions do. ⚠️ 568 vs 569: apart from the wiring color pattern, the standards are essentially the same and both define things like maximum cable length. Equipment rooms, racks, and hardware Item Purpose MDF (Main Distribution Frame) The primary equipment room — where the main termination and core equipment live IDF (Intermediate Distribution Frame) Satellite closets serving a floor or wing, cabled back to the MDF Rack units (U) The vertical measurement of rack-mounted equipment; 1U ≈ 1.75 inches Patch panel Termination point for horizontal runs (see 1.5) PDU (Power Distribution Unit) Distributes power within the rack UPS Battery backup and power conditioning (see 1.5) 📌 The MDF/IDF hierarchy exists because of the 90-meter limit. If users are farther than that from the MDF, you place an IDF closer to them. That's the whole design logic, and it connects the distance number to the room layout. Environmental factors The core fact: all electronic devices generate heat , so keeping temperature constant around them is mandatory. ⚠️ Scale changes the problem. In an office with computers spread across a large area, the heat generated doesn't meaningfully warm the room. In a data center , many devices are concentrated in a small area — so planning that room to dissipate heat is imperative . HVAC (Heating, Ventilation, and Air Conditioning): 📌 Two exam-relevant points the transcript makes well: Fire system integration. The air an HVAC system circulates feeds a fire . In a data center fire, you do not want to keep blowing air onto it. HVAC systems therefore detect fire and stop ventilation so they don't make it worse. Keep the data center HVAC separate from the building HVAC. Most office buildings already have HVAC for the people working there. The data center needs its own, so that problems with the main building system don't take down the data center's cooling. Other environmental controls: - Humidity — ⚠️ too low → electrostatic discharge; too high → condensation and corrosion. Both directions are dangerous, and questions often test that you know it's a range , not a maximum. - Airflow management — hot aisle / cold aisle containment so exhaust from one row doesn't become intake for the next.
