> to inspect it — that's why deeper inspection costs more money and more processing."}, {"kind": "pin", "html": "<strong>The IDS/IPS distinction is about placement, and this is the single most tested fact here:</strong>"}, {"kind": "trap", "html": "<strong>IDS limitations — expect these as \"which is a weakness\" questions:</strong>\n- <strong>Source addresses can be spoofed</strong>, and this is very hard for an IDS to detect.\n- <strong>Encrypted packets can't be read</strong> without decryption keys. An attacker can flood an IDS with encrypted traffic that passes through uninspected — or simply overwhelms the system.\n- <strong>Analytic limitations</strong> — both the system's analysis capability <em>and</em> whether the humans reading the output can distinguish a real threat from noise.\n- <strong>False alarms</strong>, which on an IPS means shutting down production traffic."}, {"kind": "pin", "html": "<strong>The core difference:</strong> NAS is <strong>file-level over Ethernet in packets</strong>. SAN is <strong>block-level</strong>, and the storage <strong>appears to the client as a directly attached device like a local hard disk</strong>. That is why SAN transfers are much faster."}, {"kind": "pin", "html": "APs on different switches may be on <strong>different subnets</strong> (traffic between them must route) <strong>or share the same subnet</strong> — both designs are common."}, {"kind": "trap", "html": "<strong>Pricing scales with data volume</strong> — a static web page is far cheaper to serve than gigabytes of cloud storage."}, {"kind": "pin", "html": "<strong>\"Important\" here means delay-intolerant, not business-critical.</strong> A payroll file is business-critical, but it can arrive slightly out of order with small delays and still reassemble perfectly. <strong>Video cannot.</strong> This inversion is a favorite exam trick — the correct answer prioritizes voice and video <em>over</em> a financial transfer, even though the financial data is \"more important\" in a business sense."}, {"kind": "pin", "html": "It's <strong>\"virtual\"</strong> because it isn't a separate physical network — it traverses the public network (telephone or cable infrastructure), but encryption makes it function as a private one. Anyone intercepting it sees scrambled traffic because they lack the keys."}, {"kind": "trap", "html": "<strong>Correction to the source material.</strong> The transcript states the default TTL is 16 hops. That figure is <strong>RIP's maximum hop count (16 = unreachable/infinity)</strong>, not the IP TTL default. Real IP TTL defaults are typically <strong>64 (Linux/macOS), 128 (Windows), or 255 (many network devices)</strong>. Know the real numbers — the 64/128 distinction is genuinely useful, because a <code>ping</code> reply's TTL value hints at the responding OS and how many hops away it is."}]}, {"id": "s05", "num": "1.3", "title": "1.3 Cloud Computing Concepts and Connectivity", "short": "Cloud Computing Concepts and Con…", "part": "PART 1 — Networking Concepts (Domain 1.0, 23%)", "html": "<p><em>Source: Day 18 — Cloud Computing Concepts</em></p>\n<h3>The basic proposition</h3>\n<p>Cloud providers let organizations run applications in the provider's data centers instead of buying hardware and software themselves. The organization <strong>rents</strong> compute, storage, and networking rather than owning it.</p>\n<h3>Service models</h3>\n<div class=\"callout pin\"><p>📌 The exam tests these constantly, usually as \"who manages what.\"</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Model</th>\n<th>You manage</th>\n<th>Provider manages</th>\n<th>Example use</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>IaaS</strong> (Infrastructure as a Service)</td>\n<td>OS, middleware, runtime, applications, data</td>\n<td>Virtualization, servers, storage, networking</td>\n<td>You want VMs and control over them</td>\n</tr>\n<tr>\n<td><strong>PaaS</strong> (Platform as a Service)</td>\n<td>Applications and data only</td>\n<td>Everything below — including OS and runtime</td>\n<td>Developers who want tools ready to go without provisioning servers</td>\n</tr>\n<tr>\n<td><strong>SaaS</strong> (Software as a Service)</td>\n<td>Nothing but your data and user configuration</td>\n<td>Everything</td>\n<td>Email, CRM, productivity suites</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>The memory hook:</strong> as you move IaaS → PaaS → SaaS, <strong>you manage less and the provider manages more.</strong> SaaS uses a <strong>software distribution model</strong> — the application is centrally hosted and licensed by subscription rather than installed and owned.</p></div>\n<h3>Deployment models</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Model</th>\n<th>Where it lives</th>\n<th>Key characteristics</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Public cloud</strong></td>\n<td>Provider's infrastructure, shared</td>\n<td>Offers infrastructure, resources, applications, and storage. Lowest cost of entry, maximum elasticity. ⚠️ Risk of <strong>vendor lock-in</strong>, and interconnecting multiple cloud vendors can be difficult</td>\n</tr>\n<tr>\n<td><strong>Private cloud</strong></td>\n<td>The organization's <strong>own data center</strong></td>\n<td>Full control over data and its management. Used where regulation demands it — 📌 <strong>government organizations that must guarantee data stays under their own lock and key</strong></td>\n</tr>\n<tr>\n<td><strong>Hybrid cloud</strong></td>\n<td>Both</td>\n<td>Host a private cloud for sensitive workloads, use public cloud for <strong>elasticity</strong> and <strong>speed to market</strong></td>\n</tr>\n<tr>\n<td><strong>Community cloud</strong></td>\n<td>Shared by organizations with common requirements</td>\n<td>Shared compliance or industry concerns</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>The hybrid use case worth remembering:</strong> a development team needs an environment fast. Sourcing servers, licensing software, and setting it all up creates long lead time. Spinning up <strong>PaaS with tools ready to go</strong> collapses that lead time. Meanwhile the regulated data stays in the private cloud. That's the efficiency-and-performance argument for hybrid in one sentence.</p></div>\n<h3>VPC — Virtual Private Cloud</h3>\n<p>Your <strong>logically isolated section</strong> of a public cloud provider's infrastructure. Private in the sense that the resources are dedicated to you, even though the underlying physical infrastructure is shared.</p>\n<p><strong>VPC building blocks:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Component</th>\n<th>Role</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Subnets</strong></td>\n<td>How resources are separated from other tenants in the shared environment</td>\n</tr>\n<tr>\n<td><strong>VLANs</strong></td>\n<td>Connect subnets. ⚠️ Must be <strong>routed through a Layer 3 device</strong>, where you apply access lists to allow/deny between subnets</td>\n</tr>\n<tr>\n<td><strong>VPN</strong></td>\n<td>Encrypts data point to point, keeping it private from other tenants and outside observers</td>\n</tr>\n<tr>\n<td><strong>NAT</strong></td>\n<td>Connects the internet to your subnets and back; sits at the network edge</td>\n</tr>\n<tr>\n<td><strong>BGP</strong></td>\n<td>📌 Border Gateway Protocol <strong>advertises your network</strong> so others — your company or the internet — can find and reach it</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Advantages:</strong> cost reduction (especially for small businesses that don't need the hardware or software), and <strong>elasticity</strong> — 📌 if you need compute in April but not in May, the cloud <strong>shrinks as well as grows.</strong></p>\n<h3>Network security groups and security lists</h3>\n<p>Both control which traffic is allowed to and from cloud resources — a <strong>virtual firewall</strong>.</p>\n<p><strong>NSG (Network Security Group).</strong> A group of <strong>resources that share a similar security posture</strong>. Example: five web servers that all need port 80 blocked and 443 allowed, forcing everyone to use HTTPS. Group them, apply one rule set.</p>\n<ul>\n<li><strong>Components:</strong> the <strong>virtual NIC</strong> and the <strong>security rules</strong>. Rules are applied to the vNICs attached to those resources — filtering happens at that level.</li>\n<li><strong>Resources that can join a group:</strong> compute instances (VMs running your applications), database systems, storage (attached via IP and a network card), and load balancers.</li>\n</ul>\n<p><strong>Security lists</strong> apply at the <strong>subnet/packet level</strong> — traditional filtering based on network numbers.</p>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>The distinction the exam wants:</strong> a <strong>security list filters by subnet/network number</strong>; an <strong>NSG filters based on the actual resource</strong>, which the course describes as operating at a higher layer — closer to the application layer of the OSI model. NSG = resource-aware. Security list = network-aware.</p></div>\n<h3>Cloud gateways</h3>\n<p>Cloud resources live on a <strong>private network inside the provider</strong>. The <strong>cloud gateway</strong> lets those resources reach the internet, and lets customers reach their cloud services from outside.</p>\n<p><strong>How it used to work vs now:</strong>\n- <strong>Traditionally:</strong> you built a VM, installed NAT translation software, added multiple NICs, installed firewall services. Wanted a second connection? Build a second VM.\n- <strong>Today:</strong> the provider offers it <strong>as a service</strong> — already built, you just attach it to your network.</p>\n<p><strong>Why the managed version is better:</strong> it is <strong>horizontally scaled</strong> across the provider's entire infrastructure, <strong>redundant</strong> (like all provider services, across multiple locations), <strong>highly available</strong>, and reachable over the provider's many high-speed connections. It handles both <strong>IPv4 and IPv6</strong>.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>Requires a public IPv4 and IPv6 address.</strong> Internal addresses are private IPv4; external must be publicly routable. IPv6 addresses are routable by default.</p></div>\n<h3>Connection methods to the cloud</h3>\n<p>Two main options, and the trade-offs are exam-relevant:</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>VPN over internet</th>\n<th>Direct / dedicated connection</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Cost</td>\n<td>Lower</td>\n<td>Higher</td>\n</tr>\n<tr>\n<td>Performance</td>\n<td>Variable — shares the public internet</td>\n<td>Consistent, predictable</td>\n</tr>\n<tr>\n<td>Setup</td>\n<td>Fast</td>\n<td>Longer lead time</td>\n</tr>\n<tr>\n<td>Best for</td>\n<td>General workloads, remote access</td>\n<td>Sustained high-volume or latency-sensitive workloads</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ <strong>Billing model questions to ask a provider</strong> (the transcript flags these explicitly):\n- If you need more bandwidth, do <strong>you</strong> have to initiate that, or does the provider scale it automatically and bill you for the scaling?\n- Are you charged for <strong>bandwidth</strong>, or for the <strong>amount of data transferred</strong>? Providers differ, and it materially changes cost.</p></div>\n<h3>NFV — Network Functions Virtualization</h3>\n<p>Replacing dedicated hardware network appliances — routers, firewalls, load balancers — with <strong>software running on standard servers</strong>.</p>\n<div class=\"callout both\"><p>⚠️ 📌 <strong>The security consequence, and this is the tested insight:</strong> because these functions now run as software on shared hosts, the <strong>attack surface changes shape</strong>. Compromise the physical host and you can compromise <strong>all the network devices hosted on it</strong>. Compromise the <strong>hypervisor</strong> and you compromise <strong>every VM running on it</strong>. Traditional network security measures have to be applied differently in a virtualized environment — you are no longer defending discrete boxes.</p></div>\n<h3>Scalability and elasticity</h3>\n<div class=\"callout trap\"><p>⚠️ These are related but <strong>not synonyms</strong>, and the exam distinguishes them.</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Scalability</strong></th>\n<th><strong>Elasticity</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Meaning</td>\n<td>The ability to <strong>grow</strong> capacity to meet demand</td>\n<td>The ability to <strong>grow <em>and shrink</em></strong> automatically as demand changes</td>\n</tr>\n<tr>\n<td>Direction</td>\n<td>Primarily up/out</td>\n<td><strong>Both directions</strong></td>\n</tr>\n<tr>\n<td>Timeframe</td>\n<td>Planned</td>\n<td>Dynamic, often automatic</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Scaling types:</strong>\n- <strong>Vertical (scale up)</strong> — add resources to an existing machine (more CPU, more RAM).\n- <strong>Horizontal (scale out)</strong> — add more machines.</p>\n<div class=\"callout pin\"><p>📌 <strong>The economic argument.</strong> In a physical environment you must lay out capital for hardware, software, network infrastructure, people, and training <em>before</em> you can do anything. In a virtualized environment that initial outlay isn't there — <strong>you pay as you use.</strong></p></div>\n<div class=\"callout trap\"><p>⚠️ <strong>The elasticity security concern — a genuinely good exam trap.</strong> In a physical environment, a compromised machine is still sitting on the floor with its OS intact and you can investigate it forensically. In an elastic environment, a VM spun up for a task that becomes infected <strong>may be automatically destroyed before you get a chance to investigate it.</strong> Elasticity and forensic evidence preservation are in tension.</p></div>\n<h3>Multitenancy</h3>\n<p>Multiple customers <strong>share cloud resources</strong> — the same physical compute may run web pages for several customers, and the network may be shared. <strong>Data is kept separate; some infrastructure is shared.</strong></p>\n<div class=\"callout pin\"><p>📌 Isolation in a multitenant environment is achieved through the VPC building blocks above: <strong>subnets</strong> to separate resources, <strong>VLANs</strong> with access lists for controlled routing between them, <strong>VPNs</strong> for encryption in transit, and <strong>NAT</strong> at the edge.</p></div>\n<div class=\"callout trap\"><p>⚠️ Multitenancy is where compliance questions concentrate. If the data is regulated — the transcript's example is credit card information under PCI — shared infrastructure raises questions that a private cloud avoids entirely. That is often the real reason an organization chooses private or hybrid over public.</p></div>\n<div class=\"lab\"><h3>🔧 LAB 1.3 — Hybrid Cloud Connectivity Model</h3>\n<p>Packet Tracer can't run real cloud services, but it models the connectivity well. Build an on-premises network with a cloud-connected branch: configure a site-to-site VPN to a simulated cloud VPC, apply ACLs that emulate network security groups vs subnet security lists, and demonstrate the backhaul problem from section 1.8 by measuring path latency with and without direct cloud access.</p></div>\n<hr />", "text": " Source: Day 18 — Cloud Computing Concepts The basic proposition Cloud providers let organizations run applications in the provider's data centers instead of buying hardware and software themselves. The organization rents compute, storage, and networking rather than owning it. Service models 📌 The exam tests these constantly, usually as \"who manages what.\" Model You manage Provider manages Example use IaaS (Infrastructure as a Service) OS, middleware, runtime, applications, data Virtualization, servers, storage, networking You want VMs and control over them PaaS (Platform as a Service) Applications and data only Everything below — including OS and runtime Developers who want tools ready to go without provisioning servers SaaS (Software as a Service) Nothing but your data and user configuration Everything Email, CRM, productivity suites 📌 The memory hook: as you move IaaS → PaaS → SaaS, you manage less and the provider manages more. SaaS uses a software distribution model — the application is centrally hosted and licensed by subscription rather than installed and owned. Deployment models Model Where it lives Key characteristics Public cloud Provider's infrastructure, shared Offers infrastructure, resources, applications, and storage. Lowest cost of entry, maximum elasticity. ⚠️ Risk of vendor lock-in , and interconnecting multiple cloud vendors can be difficult Private cloud The organization's own data center Full control over data and its management. Used where regulation demands it — 📌 government organizations that must guarantee data stays under their own lock and key Hybrid cloud Both Host a private cloud for sensitive workloads, use public cloud for elasticity and speed to market Community cloud Shared by organizations with common requirements Shared compliance or industry concerns 📌 The hybrid use case worth remembering: a development team needs an environment fast. Sourcing servers, licensing software, and setting it all up creates long lead time. Spinning up PaaS with tools ready to go collapses that lead time. Meanwhile the regulated data stays in the private cloud. That's the efficiency-and-performance argument for hybrid in one sentence. VPC — Virtual Private Cloud Your logically isolated section of a public cloud provider's infrastructure. Private in the sense that the resources are dedicated to you, even though the underlying physical infrastructure is shared. VPC building blocks: Component Role Subnets How resources are separated from other tenants in the shared environment VLANs Connect subnets. ⚠️ Must be routed through a Layer 3 device , where you apply access lists to allow/deny between subnets VPN Encrypts data point to point, keeping it private from other tenants and outside observers NAT Connects the internet to your subnets and back; sits at the network edge BGP 📌 Border Gateway Protocol advertises your network so others — your company or the internet — can find and reach it Advantages: cost reduction (especially for small businesses that don't need the hardware or software), and elasticity — 📌 if you need compute in April but not in May, the cloud shrinks as well as grows. Network security groups and security lists Both control which traffic is allowed to and from cloud resources — a virtual firewall . NSG (Network Security Group). A group of resources that share a similar security posture . Example: five web servers that all need port 80 blocked and 443 allowed, forcing everyone to use HTTPS. Group them, apply one rule set. Components: the virtual NIC and the security rules . Rules are applied to the vNICs attached to those resources — filtering happens at that level. Resources that can join a group: compute instances (VMs running your applications), database systems, storage (attached via IP and a network card), and load balancers. Security lists apply at the subnet/packet level — traditional filtering based on network numbers. 📌 ⚠️ The distinction the exam wants: a security list filters by subnet/network number ; an NSG filters based on the actual resource , which the course describes as operating at a higher layer — closer to the application layer of the OSI model. NSG = resource-aware. Security list = network-aware. Cloud gateways Cloud resources live on a private network inside the provider . The cloud gateway lets those resources reach the internet, and lets customers reach their cloud services from outside. How it used to work vs now: - Traditionally: you built a VM, installed NAT translation software, added multiple NICs, installed firewall services. Wanted a second connection? Build a second VM. - Today: the provider offers it as a service — already built, you just attach it to your network. Why the managed version is better: it is horizontally scaled across the provider's entire infrastructure, redundant (like all provider services, across multiple locations), highly available , and reachable over the provider's many high-speed connections. It handles both IPv4 and IPv6 . ⚠️ Requires a public IPv4 and IPv6 address. Internal addresses are private IPv4; external must be publicly routable. IPv6 addresses are routable by default. Connection methods to the cloud Two main options, and the trade-offs are exam-relevant: VPN over internet Direct / dedicated connection Cost Lower Higher Performance Variable — shares the public internet Consistent, predictable Setup Fast Longer lead time Best for General workloads, remote access Sustained high-volume or latency-sensitive workloads ⚠️ Billing model questions to ask a provider (the transcript flags these explicitly): - If you need more bandwidth, do you have to initiate that, or does the provider scale it automatically and bill you for the scaling? - Are you charged for bandwidth , or for the amount of data transferred ? Providers differ, and it materially changes cost. NFV — Network Functions Virtualization Replacing dedicated hardware network appliances — routers, firewalls, load balancers — with software running on", "callouts": [{"kind": "pin", "html": "The exam tests these constantly, usually as \"who manages what.\""}, {"kind": "pin", "html": "<strong>The memory hook:</strong> as you move IaaS → PaaS → SaaS, <strong>you manage less and the provider manages more.</strong> SaaS uses a <strong>software distribution model</strong> — the application is centrally hosted and licensed by subscription rather than installed and owned."}, {"kind": "pin", "html": "<strong>The hybrid use case worth remembering:</strong> a development team needs an environment fast. Sourcing servers, licensing software, and setting it all up creates long lead time. Spinning up <strong>PaaS with tools ready to go</strong> collapses that lead time. Meanwhile the regulated data stays in the private cloud. That's the efficiency-and-performance argument for hybrid in one sentence."}, {"kind": "pin", "html": "<strong>The distinction the exam wants:</strong> a <strong>security list filters by subnet/network number</strong>; an <strong>NSG filters based on the actual resource</strong>, which the course describes as operating at a higher layer — closer to the application layer of the OSI model. NSG = resource-aware. Security list = network-aware."}, {"kind": "trap", "html": "<strong>Requires a public IPv4 and IPv6 address.</strong> Internal addresses are private IPv4; external must be publicly routable. IPv6 addresses are routable by default."}, {"kind": "trap", "html": "<strong>Billing model questions to ask a provider</strong> (the transcript flags these explicitly):\n- If you need more bandwidth, do <strong>you</strong> have to initiate that, or does the provider scale it automatically and bill you for the scaling?\n- Are you charged for <strong>bandwidth</strong>, or for the <strong>amount of data transferred</strong>? Providers differ, and it materially changes cost."}, {"kind": "pin", "html": "<strong>The security consequence, and this is the tested insight:</strong> because these functions now run as software on shared hosts, the <strong>attack surface changes shape</strong>. Compromise the physical host and you can compromise <strong>all the network devices hosted on it</strong>. Compromise the <strong>hypervisor</strong> and you compromise <strong>every VM running on it</strong>. Traditional network security measures have to be applied differently in a virtualized environment — you are no longer defending discrete boxes."}, {"kind": "trap", "html": "These are related but <strong>not synonyms</strong>, and the exam distinguishes them."}, {"kind": "pin", "html": "<strong>The economic argument.</strong> In a physical environment you must lay out capital for hardware, software, network infrastructure, people, and training <em>before</em> you can do anything. In a virtualized environment that initial outlay isn't there — <strong>you pay as you use.</strong>"}, {"kind": "trap", "html": "<strong>The elasticity security concern — a genuinely good exam trap.</strong> In a physical environment, a compromised machine is still sitting on the floor with its OS intact and you can investigate it forensically. In an elastic environment, a VM spun up for a task that becomes infected <strong>may be automatically destroyed before you get a chance to investigate it.</strong> Elasticity and forensic evidence preservation are in tension."}, {"kind": "pin", "html": "Isolation in a multitenant environment is achieved through the VPC building blocks above: <strong>subnets</strong> to separate resources, <strong>VLANs</strong> with access lists for controlled routing between them, <strong>VPNs</strong> for encryption in transit, and <strong>NAT</strong> at the edge."}, {"kind": "trap", "html": "Multitenancy is where compliance questions concentrate. If the data is regulated — the transcript's example is credit card information under PCI — shared infrastructure raises questions that a private cloud avoids entirely. That is often the real reason an organization chooses private or hybrid over public."}]}, {"id": "s06", "num": "1.4", "title": "1.4 Ports, Protocols, and Services", "short": "Ports, Protocols, and Services", "part": "PART 1 — Networking Concepts (Domain 1.0, 23%)", "html": "<p><em>Source: Day 10 — Ports &amp; Protocols</em></p>\n<p>Pure memorization, and the exam takes full advantage of that. There is no clever technique here — there is spaced repetition. Appendix A is the drill sheet; this section is the understanding that makes the drill stick.</p>\n<h3>Why ports exist</h3>\n<p>An IP address gets data to the right <strong>host</strong>. A port gets it to the right <strong>application</strong> on that host. The course calls this \"service point addressing\" — it is a Layer 4 function.</p>\n<ul>\n<li><strong>Well-known ports:</strong> 0–1023</li>\n<li><strong>Registered ports:</strong> 1024–49151</li>\n<li><strong>Dynamic / ephemeral ports:</strong> 49152–65535 (what your client picks as a source port)</li>\n</ul>\n<h3>The master port table</h3>\n<div class=\"callout pin\"><p>📌 <strong>Memorize every row.</strong> Group them by the pairings below rather than learning 30 isolated numbers.</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Port</th>\n<th>Protocol</th>\n<th>TCP/UDP</th>\n<th>Purpose</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>20</strong></td>\n<td>FTP (data)</td>\n<td>TCP</td>\n<td>File transfer — data channel</td>\n</tr>\n<tr>\n<td><strong>21</strong></td>\n<td><strong>FTP (control)</strong></td>\n<td>TCP</td>\n<td>File transfer — commands</td>\n</tr>\n<tr>\n<td><strong>22</strong></td>\n<td><strong>SSH / SFTP / SCP</strong></td>\n<td>TCP</td>\n<td>Secure remote shell and file transfer</td>\n</tr>\n<tr>\n<td><strong>23</strong></td>\n<td><strong>Telnet</strong></td>\n<td>TCP</td>\n<td>Remote shell — <strong>unencrypted</strong></td>\n</tr>\n<tr>\n<td><strong>25</strong></td>\n<td><strong>SMTP</strong></td>\n<td>TCP</td>\n<td>Sending mail</td>\n</tr>\n<tr>\n<td><strong>53</strong></td>\n<td><strong>DNS</strong></td>\n<td><strong>TCP and UDP</strong></td>\n<td>Name resolution</td>\n</tr>\n<tr>\n<td><strong>67 / 68</strong></td>\n<td><strong>DHCP</strong></td>\n<td>UDP</td>\n<td>67 = server, 68 = client</td>\n</tr>\n<tr>\n<td><strong>69</strong></td>\n<td><strong>TFTP</strong></td>\n<td>UDP</td>\n<td>Trivial file transfer</td>\n</tr>\n<tr>\n<td><strong>80</strong></td>\n<td><strong>HTTP</strong></td>\n<td>TCP</td>\n<td>Web, unencrypted</td>\n</tr>\n<tr>\n<td><strong>110</strong></td>\n<td><strong>POP3</strong></td>\n<td>TCP</td>\n<td>Mail retrieval — downloads</td>\n</tr>\n<tr>\n<td><strong>123</strong></td>\n<td><strong>NTP</strong></td>\n<td>UDP</td>\n<td>Time synchronization</td>\n</tr>\n<tr>\n<td><strong>143</strong></td>\n<td><strong>IMAP</strong></td>\n<td>TCP</td>\n<td>Mail retrieval — syncs</td>\n</tr>\n<tr>\n<td><strong>161 / 162</strong></td>\n<td><strong>SNMP</strong></td>\n<td>UDP</td>\n<td>161 = queries, 162 = <strong>traps</strong></td>\n</tr>\n<tr>\n<td><strong>389</strong></td>\n<td><strong>LDAP</strong></td>\n<td>TCP</td>\n<td>Directory services</td>\n</tr>\n<tr>\n<td><strong>443</strong></td>\n<td><strong>HTTPS</strong></td>\n<td>TCP</td>\n<td>Web over TLS</td>\n</tr>\n<tr>\n<td><strong>445</strong></td>\n<td><strong>SMB</strong></td>\n<td>TCP</td>\n<td>Windows file/printer sharing</td>\n</tr>\n<tr>\n<td><strong>514</strong></td>\n<td>Syslog</td>\n<td>UDP</td>\n<td>Log collection</td>\n</tr>\n<tr>\n<td><strong>587</strong></td>\n<td>SMTP (submission)</td>\n<td>TCP</td>\n<td>Modern mail submission with auth/TLS</td>\n</tr>\n<tr>\n<td><strong>636</strong></td>\n<td><strong>LDAPS</strong></td>\n<td>TCP</td>\n<td>LDAP over SSL/TLS</td>\n</tr>\n<tr>\n<td><strong>993</strong></td>\n<td><strong>IMAPS</strong></td>\n<td>TCP</td>\n<td>Secure IMAP</td>\n</tr>\n<tr>\n<td><strong>995</strong></td>\n<td><strong>POP3S</strong></td>\n<td>TCP</td>\n<td>Secure POP3</td>\n</tr>\n<tr>\n<td><strong>1433</strong></td>\n<td>SQL Server</td>\n<td>TCP</td>\n<td>Microsoft database</td>\n</tr>\n<tr>\n<td><strong>3306</strong></td>\n<td>MySQL</td>\n<td>TCP</td>\n<td>Database</td>\n</tr>\n<tr>\n<td><strong>3389</strong></td>\n<td><strong>RDP</strong></td>\n<td>TCP</td>\n<td>Remote Desktop</td>\n</tr>\n<tr>\n<td><strong>5060 / 5061</strong></td>\n<td>SIP</td>\n<td>TCP/UDP</td>\n<td>VoIP signaling (5061 = secure)</td>\n</tr>\n</tbody>\n</table></div>\n<h3>Learn them as pairs — this is the trick</h3>\n<div class=\"callout trap\"><p>⚠️ The exam loves to swap a secure port for its insecure counterpart. Learn the <strong>relationships</strong>, not the isolated numbers:</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Insecure</th>\n<th>Secure</th>\n<th>Relationship</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>HTTP <strong>80</strong></td>\n<td>HTTPS <strong>443</strong></td>\n<td>The most-tested pair on the exam</td>\n</tr>\n<tr>\n<td>FTP <strong>21</strong></td>\n<td><strong>SFTP 22</strong> (over SSH) or <strong>FTPS 989/990</strong> (over TLS)</td>\n<td>⚠️ <strong>These are different things — see below</strong></td>\n</tr>\n<tr>\n<td>Telnet <strong>23</strong></td>\n<td><strong>SSH 22</strong></td>\n<td>23 → 22</td>\n</tr>\n<tr>\n<td>SMTP <strong>25</strong></td>\n<td>SMTP+TLS <strong>587</strong></td>\n<td>Submission port</td>\n</tr>\n<tr>\n<td>POP3 <strong>110</strong></td>\n<td>POP3S <strong>995</strong></td>\n<td>+885</td>\n</tr>\n<tr>\n<td>IMAP <strong>143</strong></td>\n<td>IMAPS <strong>993</strong></td>\n<td>+850</td>\n</tr>\n<tr>\n<td>LDAP <strong>389</strong></td>\n<td>LDAPS <strong>636</strong></td>\n<td>Doubles, roughly</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>SFTP vs FTPS — a guaranteed distractor.</strong>\n- <strong>SFTP</strong> = SSH File Transfer Protocol. Runs <strong>over SSH, port 22</strong>. A completely different protocol from FTP.\n- <strong>FTPS</strong> = FTP Secure. It <strong>is</strong> FTP, wrapped in SSL/TLS, ports 989/990.</p></div>\n<p>They sound nearly identical and are not related. If a question mentions SSH anywhere, the answer is SFTP on 22.</p>\n<h3>Protocol notes worth knowing</h3>\n<p><strong>DNS (53).</strong> Translates domain names to IP addresses. 📌 <strong>Uses UDP for ordinary queries</strong> (fast, small, single packet) and <strong>TCP for zone transfers</strong> and responses too large for a UDP datagram. \"Which protocol uses both TCP and UDP on the same port?\" → DNS.</p>\n<p><strong>DHCP (67/68).</strong> Automatically assigns full IP configuration to clients. The <strong>DORA</strong> sequence:</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Step</th>\n<th>Message</th>\n<th>Direction</th>\n<th>Cast</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>D</strong></td>\n<td><strong>Discover</strong></td>\n<td>Client →</td>\n<td>Broadcast</td>\n</tr>\n<tr>\n<td><strong>O</strong></td>\n<td><strong>Offer</strong></td>\n<td>← Server</td>\n<td>Broadcast/unicast</td>\n</tr>\n<tr>\n<td><strong>R</strong></td>\n<td><strong>Request</strong></td>\n<td>Client →</td>\n<td>Broadcast</td>\n</tr>\n<tr>\n<td><strong>A</strong></td>\n<td><strong>Acknowledge</strong></td>\n<td>← Server</td>\n<td>Broadcast/unicast</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 Because Discover is a <strong>broadcast</strong>, and broadcasts don't cross routers, a DHCP server on another subnet requires a <strong>relay agent / IP helper address</strong> on the router. This is one of the most common real-world DHCP failures and a frequent exam scenario — symptom is an APIPA address on one subnet while another subnet works fine.</p></div>\n<p><strong>FTP vs TFTP.</strong> TFTP is a deliberately stripped-down file transfer: <strong>UDP</strong>, no authentication, no directory browsing, no encryption. Used for device firmware and config transfers where simplicity matters more than features. FTP is TCP, authenticated, full-featured.</p>\n<p><strong>POP3 vs IMAP.</strong> 📌 The defining difference: <strong>POP3 downloads mail and typically removes it from the server</strong> — mail lives on one device. <strong>IMAP keeps mail on the server and synchronizes</strong>, so all devices see the same state. For a user with a phone and a laptop who needs both in sync, the answer is always <strong>IMAP</strong>.</p>\n<p><strong>SMTP (25).</strong> Sends mail <em>outbound</em> only. ⚠️ It does not retrieve mail — POP3 and IMAP do. Many ISPs block outbound 25 to limit spam, which is why 587 exists for authenticated submission.</p>\n<p><strong>SNMP (161/162).</strong> Network device monitoring and management. 📌 <strong>161 for polling/queries, 162 for traps.</strong> A <strong>trap</strong> is unsolicited — the device pushes an alert to the manager rather than waiting to be asked. Data is organized in a <strong>MIB (Management Information Base)</strong> and addressed by <strong>OID (Object Identifier)</strong>.\n⚠️ <strong>SNMPv1 and v2c send community strings in cleartext. Only SNMPv3 adds authentication and encryption.</strong> Any \"harden SNMP\" question resolves to v3.</p>\n<p><strong>NTP (123).</strong> Synchronizes clocks. Sounds trivial; is not. Kerberos authentication fails on clock skew, certificate validation fails, and log correlation across devices becomes impossible without it. <strong>NTS</strong> (Network Time Security) is the secured version.</p>\n<p><strong>SMB (445).</strong> Shared access to files, directories, printers. The Windows counterpart to <strong>NFS</strong> on Linux. ⚠️ Port 445 exposed to the internet is a serious finding — it's the vector for a long history of worms.</p>\n<p><strong>SSH (22).</strong> Encrypted remote shell, and the transport underneath SFTP and SCP. It replaced Telnet because <strong>Telnet transmits credentials in cleartext</strong>.</p>\n<p><strong>LDAP (389) / LDAPS (636).</strong> Directory services — querying user and resource objects in a directory such as Active Directory.</p>\n<p><strong>HTTP (80) / HTTPS (443).</strong> HTTPS is HTTP inside SSL/TLS. Look for the certificate — that's what makes the session verifiable, not just encrypted.</p>\n<h3>TCP vs UDP</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>TCP</th>\n<th>UDP</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Connection</td>\n<td>Connection-oriented</td>\n<td>Connectionless</td>\n</tr>\n<tr>\n<td>Handshake</td>\n<td><strong>Three-way (SYN, SYN-ACK, ACK)</strong></td>\n<td>None</td>\n</tr>\n<tr>\n<td>Ordering</td>\n<td>Sequenced, reassembled in order</td>\n<td>No guarantee</td>\n</tr>\n<tr>\n<td>Error recovery</td>\n<td>Acknowledgement and retransmission</td>\n<td>None</td>\n</tr>\n<tr>\n<td>Overhead</td>\n<td>Higher</td>\n<td>Lower</td>\n</tr>\n<tr>\n<td>Speed</td>\n<td>Slower</td>\n<td><strong>Faster</strong></td>\n</tr>\n<tr>\n<td>Use for</td>\n<td>Web, email, file transfer — anything where every byte matters</td>\n<td><strong>Voice, video, streaming, DNS queries, DHCP</strong> — anything where a retransmit arrives too late to be useful</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 The hockey-game framing from Day 1 is the best mental model: retransmitting a dropped video frame shows you a moment that has already passed. A brief dropout is better than a replay. That is why real-time media chooses UDP.</p></div>\n<p><strong>TCP flags you should recognize:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Flag</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>SYN</strong></td>\n<td>Synchronize — open a connection</td>\n</tr>\n<tr>\n<td><strong>ACK</strong></td>\n<td>Acknowledge</td>\n</tr>\n<tr>\n<td><strong>FIN</strong></td>\n<td>Finish — graceful close</td>\n</tr>\n<tr>\n<td><strong>RST</strong></td>\n<td>Reset — abrupt termination, often \"port closed\" or \"connection refused\"</td>\n</tr>\n<tr>\n<td><strong>PSH</strong></td>\n<td>Push data to the application immediately</td>\n</tr>\n<tr>\n<td><strong>URG</strong></td>\n<td>Urgent</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ <strong>RST in a capture is a diagnostic signal</strong>, not just noise. It usually means the port is closed or a device actively refused the connection — different from a timeout, which suggests a firewall silently dropping.</p></div>\n<h3>ICMP</h3>\n<p>Not a transport protocol and <strong>has no ports</strong> — it operates at Layer 3.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Message</th>\n<th>Where you see it</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0</td>\n<td>Echo Reply</td>\n<td><code>ping</code> response</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Destination Unreachable</td>\n<td>No route, or a filtering device</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Echo Request</td>\n<td><code>ping</code></td>\n</tr>\n<tr>\n<td>11</td>\n<td><strong>Time Exceeded</strong></td>\n<td><strong>How <code>traceroute</code> works</strong></td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>Traceroute is TTL manipulation.</strong> Send a packet with TTL=1; the first router decrements to 0 and returns <strong>Time Exceeded</strong>, revealing hop 1. Then TTL=2 for hop 2, and so on. Understanding this explains why traceroute output can show gaps — some devices are configured not to reply.</p></div>\n<div class=\"lab\"><h3>🔧 LAB 1.4 — Protocol Capture and Port Behavior</h3>\n<p>Configure DNS, DHCP, HTTP/HTTPS, FTP, and email servers in Packet Tracer, then use Simulation Mode with protocol filters to capture the DORA exchange, a DNS query, a TCP three-way handshake, and an ICMP traceroute. Break/fix: wrong DHCP scope, missing IP helper address across a router, DNS pointing at a dead server, and a firewall ACL blocking 443 but not 80.</p></div>\n<hr />", "text": " Source: Day 10 — Ports & Protocols Pure memorization, and the exam takes full advantage of that. There is no clever technique here — there is spaced repetition. Appendix A is the drill sheet; this section is the understanding that makes the drill stick. Why ports exist An IP address gets data to the right host . A port gets it to the right application on that host. The course calls this \"service point addressing\" — it is a Layer 4 function. Well-known ports: 0–1023 Registered ports: 1024–49151 Dynamic / ephemeral ports: 49152–65535 (what your client picks as a source port) The master port table 📌 Memorize every row. Group them by the pairings below rather than learning 30 isolated numbers. Port Protocol TCP/UDP Purpose 20 FTP (data) TCP File transfer — data channel 21 FTP (control) TCP File transfer — commands 22 SSH / SFTP / SCP TCP Secure remote shell and file transfer 23 Telnet TCP Remote shell — unencrypted 25 SMTP TCP Sending mail 53 DNS TCP and UDP Name resolution 67 / 68 DHCP UDP 67 = server, 68 = client 69 TFTP UDP Trivial file transfer 80 HTTP TCP Web, unencrypted 110 POP3 TCP Mail retrieval — downloads 123 NTP UDP Time synchronization 143 IMAP TCP Mail retrieval — syncs 161 / 162 SNMP UDP 161 = queries, 162 = traps 389 LDAP TCP Directory services 443 HTTPS TCP Web over TLS 445 SMB TCP Windows file/printer sharing 514 Syslog UDP Log collection 587 SMTP (submission) TCP Modern mail submission with auth/TLS 636 LDAPS TCP LDAP over SSL/TLS 993 IMAPS TCP Secure IMAP 995 POP3S TCP Secure POP3 1433 SQL Server TCP Microsoft database 3306 MySQL TCP Database 3389 RDP TCP Remote Desktop 5060 / 5061 SIP TCP/UDP VoIP signaling (5061 = secure) Learn them as pairs — this is the trick ⚠️ The exam loves to swap a secure port for its insecure counterpart. Learn the relationships , not the isolated numbers: Insecure Secure Relationship HTTP 80 HTTPS 443 The most-tested pair on the exam FTP 21 SFTP 22 (over SSH) or FTPS 989/990 (over TLS) ⚠️ These are different things — see below Telnet 23 SSH 22 23 → 22 SMTP 25 SMTP+TLS 587 Submission port POP3 110 POP3S 995 +885 IMAP 143 IMAPS 993 +850 LDAP 389 LDAPS 636 Doubles, roughly 📌 ⚠️ SFTP vs FTPS — a guaranteed distractor. - SFTP = SSH File Transfer Protocol. Runs over SSH, port 22 . A completely different protocol from FTP. - FTPS = FTP Secure. It is FTP, wrapped in SSL/TLS, ports 989/990. They sound nearly identical and are not related. If a question mentions SSH anywhere, the answer is SFTP on 22. Protocol notes worth knowing DNS (53). Translates domain names to IP addresses. 📌 Uses UDP for ordinary queries (fast, small, single packet) and TCP for zone transfers and responses too large for a UDP datagram. \"Which protocol uses both TCP and UDP on the same port?\" → DNS. DHCP (67/68). Automatically assigns full IP configuration to clients. The DORA sequence: Step Message Direction Cast D Discover Client → Broadcast O Offer ← Server Broadcast/unicast R Request Client → Broadcast A Acknowledge ← Server Broadcast/unicast 📌 Because Discover is a broadcast , and broadcasts don't cross routers, a DHCP server on another subnet requires a relay agent / IP helper address on the router. This is one of the most common real-world DHCP failures and a frequent exam scenario — symptom is an APIPA address on one subnet while another subnet works fine. FTP vs TFTP. TFTP is a deliberately stripped-down file transfer: UDP , no authentication, no directory browsing, no encryption. Used for device firmware and config transfers where simplicity matters more than features. FTP is TCP, authenticated, full-featured. POP3 vs IMAP. 📌 The defining difference: POP3 downloads mail and typically removes it from the server — mail lives on one device. IMAP keeps mail on the server and synchronizes , so all devices see the same state. For a user with a phone and a laptop who needs both in sync, the answer is always IMAP . SMTP (25). Sends mail outbound only. ⚠️ It does not retrieve mail — POP3 and IMAP do. Many ISPs block outbound 25 to limit spam, which is why 587 exists for authenticated submission. SNMP (161/162). Network device monitoring and management. 📌 161 for polling/queries, 162 for traps. A trap is unsolicited — the device pushes an alert to the manager rather than waiting to be asked. Data is organized in a MIB (Management Information Base) and addressed by OID (Object Identifier) . ⚠️ SNMPv1 and v2c send community strings in cleartext. Only SNMPv3 adds authentication and encryption. Any \"harden SNMP\" question resolves to v3. NTP (123). Synchronizes clocks. Sounds trivial; is not. Kerberos authentication fails on clock skew, certificate validation fails, and log correlation across devices becomes impossible without it. NTS (Network Time Security) is the secured version. SMB (445). Shared access to files, directories, printers. The Windows counterpart to NFS on Linux. ⚠️ Port 445 exposed to the internet is a serious finding — it's the vector for a long history of worms. SSH (22). Encrypted remote shell, and the transport underneath SFTP and SCP. It replaced Telnet because Telnet transmits credentials in cleartext . LDAP (389) / LDAPS (636). Directory services — querying user and resource objects in a directory such as Active Directory. HTTP (80) / HTTPS (443). HTTPS is HTTP inside SSL/TLS. Look for the certificate — that's what makes the session verifiable, not just encrypted. TCP vs UDP TCP UDP Connection Connection-oriented Connectionless Handshake Three-way (SYN, SYN-ACK, ACK) None Ordering Sequenced, reassembled in order No guarantee Error recovery Acknowledgement and retransmission None Overhead Higher Lower Speed Slower Faster Use for Web, email, file transfer — anything where every byte matters Voice, video, streaming, DNS queries, DHCP — anything where a retransmit arrives too late to be useful 📌 The hockey-game framing from Day 1 is the best mental model: retransmitting a dropped video frame shows you a moment that has already passed. A brief dropout is better than ", "callouts": [{"kind": "pin", "html": "<strong>Memorize every row.</strong> Group them by the pairings below rather than learning 30 isolated numbers."}, {"kind": "trap", "html": "The exam loves to swap a secure port for its insecure counterpart. Learn the <strong>relationships</strong>, not the isolated numbers:"}, {"kind": "pin", "html": "<strong>SFTP vs FTPS — a guaranteed distractor.</strong>\n- <strong>SFTP</strong> = SSH File Transfer Protocol. Runs <strong>over SSH, port 22</strong>. A completely different protocol from FTP.\n- <strong>FTPS</strong> = FTP Secure. It <strong>is</strong> FTP, wrapped in SSL/TLS, ports 989/990."}, {"kind": "pin", "html": "Because Discover is a <strong>broadcast</strong>, and broadcasts don't cross routers, a DHCP server on another subnet requires a <strong>relay agent / IP helper address</strong> on the router. This is one of the most common real-world DHCP failures and a frequent exam scenario — symptom is an APIPA address on one subnet while another subnet works fine."}, {"kind": "pin", "html": "The hockey-game framing from Day 1 is the best mental model: retransmitting a dropped video frame shows you a moment that has already passed. A brief dropout is better than a replay. That is why real-time media chooses UDP."}, {"kind": "trap", "html": "<strong>RST in a capture is a diagnostic signal</strong>, not just noise. It usually means the port is closed or a device actively refused the connection — different from a timeout, which suggests a firewall silently dropping."}, {"kind": "pin", "html": "<strong>Traceroute is TTL manipulation.</strong> Send a packet with TTL=1; the first router decrements to 0 and returns <strong>Time Exceeded</strong>, revealing hop 1. Then TTL=2 for hop 2, and so on. Understanding this explains why traceroute output can show gaps — some devices are configured not to reply."}]}, {"id": "s07", "num": "1.5", "title": "1.5 Transmission Media, Connectors, and Ethernet Standards", "short": "Transmission Media, Connectors,…", "part": "PART 1 — Networking Concepts (Domain 1.0, 23%)", "html": "<p><em>Source: Day 3 — Cables &amp; Connectors; Day 2 (802.3, Fibre Channel, transceivers)</em></p>\n<p>This section is dense with numbers. The exam loves it because it is unambiguous — either you know that OM3 is 40 Gbps at 300 m or you don't. Drill the tables.</p>\n<h3>Copper: shielded vs unshielded</h3>\n<p>The vulnerability of any electrical signal on a metal wire is <strong>EMI (electromagnetic interference)</strong> — from strong power sources, radio sources, or anything magnetic.</p>\n<ul>\n<li><strong>STP (shielded twisted pair)</strong> — adds a braided metal mesh around the internal cores. Better transmission characteristics, more expensive. Common in 1980s–90s <strong>token ring</strong>.</li>\n<li><strong>UTP (unshielded twisted pair)</strong> — no shield. Cheaper. Became the standard as Ethernet took over.</li>\n</ul>\n<div class=\"callout pin\"><p>📌 The twisting <em>itself</em> provides some EMI protection even without a shield — that's why UTP works at all. Twisting causes interference picked up on adjacent wires to cancel.</p></div>\n<div class=\"callout trap\"><p>⚠️ <strong>Why UTP won:</strong> token ring never exceeded 16 Mbps, so STP's transmission advantage was irrelevant once Ethernet reached the gigabit range. Cost was the driver. As long as you follow installation guidelines — keep it away from strong power and radio sources — interference isn't a practical problem.</p></div>\n<h3>UTP categories</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Category</th>\n<th>Max speed</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Cat 1</td>\n<td>—</td>\n<td>Original telephone cable, no data</td>\n</tr>\n<tr>\n<td>Cat 2</td>\n<td>4 Mbps</td>\n<td>Suitable for original token ring</td>\n</tr>\n<tr>\n<td>Cat 3</td>\n<td>10 Mbps</td>\n<td>Distances up to ~100 m</td>\n</tr>\n<tr>\n<td>Cat 4</td>\n<td>16 Mbps</td>\n<td>Token ring maximum</td>\n</tr>\n<tr>\n<td><strong>Cat 5</strong></td>\n<td><strong>100 Mbps</strong></td>\n<td>\"Fast Ethernet\"</td>\n</tr>\n<tr>\n<td><strong>Cat 5e</strong></td>\n<td><strong>1 Gbps</strong></td>\n<td>e = <strong>enhanced</strong> (not \"extended\")</td>\n</tr>\n<tr>\n<td><strong>Cat 6</strong></td>\n<td>1 Gbps / <strong>10 Gbps @ ~55 m</strong></td>\n<td>10 G only over roughly half the standard distance</td>\n</tr>\n<tr>\n<td><strong>Cat 6a</strong></td>\n<td>1 Gbps / 10 Gbps</td>\n<td><em>a</em> = augmented; more insulation, better EMI resistance. <strong>No difference in transmission spec vs Cat 6</strong></td>\n</tr>\n<tr>\n<td>Cat 7</td>\n<td>10 Gbps @ 100 m</td>\n<td>Available but less common</td>\n</tr>\n<tr>\n<td>Cat 8</td>\n<td>40 Gbps</td>\n<td>In development at time of recording</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>Standard Ethernet distance limit is 100 meters.</strong> This number appears everywhere. Memorize it.</p></div>\n<h3>Coaxial and twinax</h3>\n<p><strong>Coax</strong> — a single solid copper conductor at the core, surrounded by insulation, then a <em>grounded</em> conductive metal shield. The shield keeps interference out and signal in.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Designation</th>\n<th>Nickname</th>\n<th>Speed</th>\n<th>Distance</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>10BASE5</strong></td>\n<td>Thick Ethernet / Thicknet</td>\n<td>10 Mbps</td>\n<td>~500 m (5 × standard)</td>\n</tr>\n<tr>\n<td><strong>10BASE2</strong></td>\n<td>Thin Ethernet / Thinnet</td>\n<td>10 Mbps</td>\n<td>~185 m (~2 × standard)</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>Decoding the naming convention</strong> — this is worth internalizing because it generalizes:\n- <strong>10 / 100 / 1000 / 10G</strong> = speed\n- <strong>BASE</strong> = <strong>baseband</strong>\n- <strong>5 / 2 / T / F / S / L</strong> = distance or media type</p></div>\n<p><strong>Baseband vs broadband.</strong> Baseband means the signal has access to the <strong>entire bandwidth</strong> of the cable — think of the waveform running from the top of the pipe to the bottom, with top = 1 and bottom = 0. Broadband uses <strong>variations in frequency and amplitude</strong> to carve the cable into multiple channels — which is how a single TV cable carries many channels, each occupying maybe 5% of available bandwidth. <strong>Ethernet LANs use baseband.</strong></p>\n<p>Modern coax types: <strong>RG6</strong> and <strong>RG11</strong>, used for cable TV, telephony, and internet delivery. Coax in a LAN is effectively extinct.</p>\n<p><strong>Twinax / Twinaxial</strong> — like coax but with <strong>two conductors</strong> instead of one, twisted, shielded, jacketed. Enables <strong>differential signaling</strong> (the receiver interprets the <em>difference</em> between the two signals). Used in the data center for very high speed over short runs (~10 m or less). Cost-effective vs fiber.</p>\n<p><strong>DAC (Direct Attach Copper)</strong> — twinax with <strong>transceivers permanently attached</strong> to each end, containing their own logic. Fixed cable length, plugs straight into high-speed switches, routers, or servers. Short runs, tens of Gbps, electromagnetically shielded.</p>\n<p><strong>Plenum vs non-plenum.</strong> The plenum is the air-handling space above a ceiling where cables and piping run. Ordinary cable jacket plastic emits <strong>toxic fumes</strong> when burned. <strong>Plenum-rated cable is fire-resistant and must be used in plenum spaces</strong>, because a fire there can distribute poisonous chemicals through the building's air before anyone notices it.</p>\n<h3>Wiring standards: T568A and T568B</h3>\n<p>Defined by <strong>TIA/EIA</strong>. They apply to twisted pair and specify only the <strong>color sequence</strong> of the 8 wires (4 twisted pairs). <strong>There is no functional difference between them.</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Pin</th>\n<th>T568A</th>\n<th>T568B</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>White/Green</td>\n<td>White/Orange</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Green</td>\n<td>Orange</td>\n</tr>\n<tr>\n<td>3</td>\n<td>White/Orange</td>\n<td>White/Green</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Blue</td>\n<td>Blue</td>\n</tr>\n<tr>\n<td>5</td>\n<td>White/Blue</td>\n<td>White/Blue</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Orange</td>\n<td>Green</td>\n</tr>\n<tr>\n<td>7</td>\n<td>White/Brown</td>\n<td>White/Brown</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Brown</td>\n<td>Brown</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 The change between A and B is <strong>swapping the green and orange pairs</strong>. Pins 4, 5, 7, 8 are identical in both.</p></div>\n<p><strong>Which to use:</strong> match whatever is already installed; follow project specs; match internally-wired/hardwired components. Residential work typically favors 568A.</p>\n<p><strong>Straight-through vs crossover.</strong></p>\n<ul>\n<li><strong>Straight-through</strong> — same standard on both ends. Four wires send, four receive, and the port design assumes that alignment.</li>\n<li><strong>Crossover</strong> — different standard on each end (568A on one, 568B on the other). Flips senders and receivers.</li>\n</ul>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Use straight-through</th>\n<th>Use crossover</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>PC ↔ switch</td>\n<td>PC ↔ PC</td>\n</tr>\n<tr>\n<td>Switch ↔ router</td>\n<td>Switch ↔ switch</td>\n</tr>\n<tr>\n<td>PC ↔ hub</td>\n<td>Switch ↔ hub</td>\n</tr>\n<tr>\n<td></td>\n<td>Hub ↔ hub</td>\n</tr>\n<tr>\n<td></td>\n<td>Router ↔ router</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>The rule of thumb:</strong> <em>different</em> device types → straight-through. <em>Same</em> device types → crossover. The reason is sender/receiver alignment — PC-to-PC with a straight-through cable sends into the other side's senders, so nothing works.</p></div>\n<div class=\"callout trap\"><p>⚠️ You can identify a crossover cable visually: hold both clear connectors side by side. Straight-through looks identical on both ends; crossover doesn't.</p></div>\n<p>🔗 <strong>A+ crossover:</strong> <strong>crimping</strong> is stripping bulk cable to bare copper, seating wires in the connector, and clamping. Large installs buy bulk cable and crimp to length because it's cheaper than pre-made patch cables.</p>\n<h3>Fiber optic construction</h3>\n<p>Interior → exterior: <strong>Core</strong> (light travels here) → <strong>Cladding</strong> (often plexiglass, flexible) → <strong>Primary coating</strong> (protects inner components) → <strong>Strength members</strong> → <strong>Cable jacket</strong>.</p>\n<h3>Single-mode vs multimode</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Single-mode (SMF)</th>\n<th>Multimode (MMF)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Core diameter</td>\n<td>~8.3 µm</td>\n<td>50 or 62.5 µm</td>\n</tr>\n<tr>\n<td>Light source</td>\n<td>High-powered <strong>lasers</strong></td>\n<td><strong>LEDs</strong> or lasers</td>\n</tr>\n<tr>\n<td>Modes carried</td>\n<td>One beam, down the center</td>\n<td>Multiple paths simultaneously</td>\n</tr>\n<tr>\n<td>Distance</td>\n<td>Long</td>\n<td>Short</td>\n</tr>\n<tr>\n<td>Typical use</td>\n<td>Outdoor, telco, campus-to-campus</td>\n<td>Indoor, data center patch cables</td>\n</tr>\n<tr>\n<td>Cost</td>\n<td>Higher per cable, cheaper over miles (fewer connection points)</td>\n<td>Cheaper for short runs</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ <strong>Counterintuitive but tested:</strong> \"multimode\" sounds more capable, but <strong>multimode is generally the less expensive option.</strong> Single-mode is a dedicated, precision implementation. The multiple light paths in MMF interfere with each other, which is exactly why it can't go far.</p></div>\n<h3>Fiber categories</h3>\n<p><strong>Single-mode — OS (Optical Service):</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Theoretical distance</th>\n<th>Realistic</th>\n<th>Use</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>OS1</strong></td>\n<td>up to 10 km</td>\n<td>~2–5 km</td>\n<td>Indoor / campus, tunnels, pedways, airport terminals</td>\n</tr>\n<tr>\n<td><strong>OS2</strong></td>\n<td>up to 200 km</td>\n<td>Far less in practice</td>\n<td>Outdoor, telephone-pole runs, long haul</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Multimode — OM (Optical Mode):</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Speed</th>\n<th>Distance</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>OM1</strong></td>\n<td>10 Gbps</td>\n<td>33 m</td>\n</tr>\n<tr>\n<td><strong>OM2</strong></td>\n<td>10 Gbps</td>\n<td>82 m</td>\n</tr>\n<tr>\n<td><strong>OM3</strong></td>\n<td>40 Gbps</td>\n<td>300 m</td>\n</tr>\n<tr>\n<td><strong>OM4</strong></td>\n<td>40 Gbps</td>\n<td>550 m</td>\n</tr>\n<tr>\n<td><strong>OM5</strong></td>\n<td>28 Gbps <strong>per channel × 4 channels</strong></td>\n<td>—</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 OM5 uses a different multiplexing method to run 4 channels. It's relatively new and increasingly deployed.</p></div>\n<div class=\"callout trap\"><p>⚠️ These are <strong>maximums at maximum distance.</strong> Shorten the run and speed can increase — OM3 at 50 m might carry 100 Gbps rather than 40.</p></div>\n<h3>Fiber connectors</h3>\n<p>All fiber connectors share three components: the <strong>ferrule</strong> (holds the core; light travels through it), the <strong>connector body</strong> (plastic, metal, or ceramic; holds the ferrule), and the <strong>coupling mechanism</strong> (friction-fit, clip, bayonet, or screw-on).</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Connector</th>\n<th>Full name</th>\n<th>Shape / mechanism</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>LC</strong></td>\n<td>Local Connector (a.k.a. Lucent, \"little\")</td>\n<td>Square, friction/push, latch</td>\n<td><strong>Most common in modern installs.</strong> Ferrule <strong>1.25 mm</strong> — half the SC. Duplex = two separate ferrules</td>\n</tr>\n<tr>\n<td><strong>ST</strong></td>\n<td>Straight Tip</td>\n<td><strong>Round</strong>, <strong>bayonet</strong> — push and twist to lock</td>\n<td>Being replaced by LC</td>\n</tr>\n<tr>\n<td><strong>SC</strong></td>\n<td>Subscriber Connector (\"square connector\")</td>\n<td>Square, push-pull</td>\n<td>Common at the home demarc for fiber service. Ferrule <strong>2.5 mm</strong></td>\n</tr>\n<tr>\n<td><strong>MT-RJ</strong></td>\n<td>Mechanical Transfer Registered Jack</td>\n<td>Small form factor</td>\n<td><strong>Both cores in a single ferrule.</strong> Multimode only, always full duplex. Higher density</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>Duplex fiber needs two cores.</strong> You cannot send and receive over a single core simultaneously — light traveling in opposite directions would interfere. Simplex single-core does exist for one-way applications (e.g. digital audio into an amplifier).</p></div>\n<h3>UPC vs APC</h3>\n<p>This is about the <strong>polish angle at the end face of the ferrule</strong>, and it's about <strong>back-reflection</strong>.</p>\n<ul>\n<li><strong>UPC (Ultra Physical Contact)</strong> — rounded/straight. Reflected light travels <strong>straight back down the cable toward the source</strong>, causing noise.</li>\n<li><strong>APC (Angled Physical Contact)</strong> — flat but polished at an <strong>8° angle</strong>. Reflected light is deflected at an angle, bounces around inside the cable, and loses energy with every reflection — so far less makes it back to the source.</li>\n</ul>\n<p><strong>Where APC matters:</strong> high-frequency optical transmissions are more sensitive to back-reflection. Fiber-to-the-home carrying modulated video signals typically uses APC exclusively.</p>\n<div class=\"callout both\"><p>⚠️ 📌 <strong>Never intermix UPC and APC.</strong> They won't work correctly and you can <strong>physically destroy the connectors</strong> because the end faces don't mate. They are <strong>color-coded</strong> (commonly green for APC, blue for UPC) specifically to prevent this.</p></div>\n<h3>Copper connectors</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Connector</th>\n<th>Pins</th>\n<th>Use</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>RJ11</strong></td>\n<td>6 (often 4 wires used)</td>\n<td>Telephone / landline</td>\n</tr>\n<tr>\n<td><strong>RJ45</strong></td>\n<td><strong>8</strong></td>\n<td>Standard UTP Ethernet</td>\n</tr>\n<tr>\n<td><strong>F-type</strong></td>\n<td>—</td>\n<td>Coax; screw-on \"banjo\" type; domestic TV equipment, satellite ground</td>\n</tr>\n</tbody>\n</table></div>\n<p>Both RJ types use the same plastic clip mechanism — you should hear the click, or you don't have a good connection.</p>\n<h3>Optical transceivers</h3>\n<p>A <strong>transceiver</strong> converts electrical signals to light for transmission over fiber. Physically about the size of a flash drive, and <strong>hot-pluggable</strong> — which is what makes switches modular. Swap the transceiver, change the communication standard, keep the same switch.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Channels</th>\n<th>Rate</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>SFP</strong> (small form-factor pluggable)</td>\n<td>1</td>\n<td>100 Mbps – 4 Gbps</td>\n</tr>\n<tr>\n<td><strong>SFP+</strong></td>\n<td>1</td>\n<td><strong>8 Gbps</strong> (Fibre Channel) / <strong>10 Gbps</strong> (Ethernet, OTN)</td>\n</tr>\n<tr>\n<td><strong>QSFP</strong> (quad SFP)</td>\n<td><strong>4</strong></td>\n<td>1 Gbps per channel</td>\n</tr>\n<tr>\n<td><strong>QSFP+</strong></td>\n<td><strong>4</strong></td>\n<td><strong>10 Gbps per channel</strong>; combinable into a single <strong>40 Gbps</strong> Ethernet link</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 SFP superseded <strong>GBIC</strong> (gigabit interface converter) at <strong>half the physical volume</strong> — meaning more transceivers per switch.</p></div>\n<p><strong>Compatibility rules:</strong>\n- SFP and SFP+ are <strong>nearly identical in size but not interchangeable in connection.</strong> An SFP+ transceiver <em>can accept data from</em> an SFP transceiver at the lower rate.\n- QSFP and QSFP+ <strong>are</strong> compatible both physically and in data communications — they negotiate down to the lowest common denominator.</p>\n<h3>Ethernet over copper — standards</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Standard</th>\n<th>Speed</th>\n<th>Cabling</th>\n<th>Distance</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>10BASE-T</td>\n<td>10 Mbps</td>\n<td>Twisted pair</td>\n<td>100 m</td>\n</tr>\n<tr>\n<td>100BASE-TX</td>\n<td>100 Mbps</td>\n<td>Cat 5 UTP</td>\n<td>100 m</td>\n</tr>\n<tr>\n<td>1000BASE-T</td>\n<td>1 Gbps</td>\n<td>Cat 5e / 6 / 6a / 7</td>\n<td>100 m</td>\n</tr>\n<tr>\n<td>10GBASE-T</td>\n<td>10 Gbps</td>\n<td><strong>Cat 6 → ~55 m</strong>, Cat 7 → 100 m</td>\n<td>see left</td>\n</tr>\n<tr>\n<td>40GBASE-T</td>\n<td>40 Gbps</td>\n<td>Cat 7 / Cat 8</td>\n<td>~30 m</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ The <strong>X</strong> in 100BASE-TX/FX was originally just a <strong>placeholder</strong> for T (twisted pair) or F (fiber). It carries no independent meaning and often gets dropped in conversation.</p></div>\n<h3>Ethernet over fiber — standards</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Standard</th>\n<th>Speed</th>\n<th>Fiber type</th>\n<th>Distance</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>100BASE-FX</td>\n<td>100 Mbps</td>\n<td>Fiber</td>\n<td>Fast Ethernet era; still seen in automation systems</td>\n</tr>\n<tr>\n<td>100BASE-SX</td>\n<td>100 Mbps</td>\n<td>MMF</td>\n<td>Shorter wavelength; cheaper optics (LEDs not lasers)</td>\n</tr>\n<tr>\n<td><strong>1000BASE-SX</strong></td>\n<td>1 Gbps</td>\n<td><strong>MMF only</strong></td>\n<td><strong>220 m</strong> @ 62.5 µm, <strong>500 m</strong> @ 50 µm</td>\n</tr>\n<tr>\n<td><strong>1000BASE-LX</strong></td>\n<td>1 Gbps</td>\n<td><strong>SMF</strong> (MMF possible)</td>\n<td><strong>5 km</strong> on SMF; falls back to SX distances on MMF</td>\n</tr>\n<tr>\n<td><strong>10GBASE-SR</strong></td>\n<td>10 Gbps</td>\n<td>MMF</td>\n<td>Short range, ~30–50 m</td>\n</tr>\n<tr>\n<td><strong>10GBASE-LR</strong></td>\n<td>10 Gbps</td>\n<td><strong>SMF</strong></td>\n<td><strong>Long reach, up to 10 km</strong></td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>The letter rule:</strong> <strong>S = short</strong> distance, <strong>L = long</strong> distance. It holds across the whole naming scheme. R = range/reach.</p></div>\n<h3>Wavelength division multiplexing</h3>\n<p>Splitting one physical fiber into channels by varying the <strong>wavelength</strong> of light — the optical equivalent of broadband over copper.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>CWDM (Coarse)</th>\n<th>DWDM (Dense)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Wavelength</td>\n<td>Lower, from <strong>1270 nm</strong></td>\n<td>Higher, more precise</td>\n</tr>\n<tr>\n<td>Channels</td>\n<td><strong>18</strong></td>\n<td>up to <strong>88</strong></td>\n</tr>\n<tr>\n<td>Channel width</td>\n<td>20 nm (13 nm channel + 7 nm spacing)</td>\n<td>Much narrower</td>\n</tr>\n<tr>\n<td>Distance</td>\n<td>Travels <strong>further</strong></td>\n<td>Travels <strong>less far</strong></td>\n</tr>\n<tr>\n<td>Optics cost</td>\n<td>Cheaper lasers (less precision needed)</td>\n<td>More expensive</td>\n</tr>\n<tr>\n<td>Bandwidth</td>\n<td>Lower</td>\n<td><strong>Higher</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Bidirectional WDM</strong> — wavelengths can be distinct enough to travel in <strong>opposite directions over the same fiber</strong>. Requires more expensive components because reflection must be tightly controlled.</p>\n<h3>Fibre Channel vs Ethernet</h3>\n<p><strong>Fibre Channel</strong> is a rapid, <strong>ordered and lossless</strong> data delivery protocol using <strong>block data transfers</strong>, point-to-point, common in switched fabric environments. It runs over fiber <strong>or</strong> copper and is used mainly <strong>between storage devices</strong> in and between data centers.</p>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>The key exam fact:</strong> Fibre Channel uses an <strong>entirely separate protocol that does not map to the OSI model at all.</strong> Ethernet transceivers use IEEE 802.3, which does map to OSI. This is the distinction to remember.</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Fibre Channel</th>\n<th>Ethernet</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Raw speed</td>\n<td>Lower</td>\n<td><strong>Higher</strong></td>\n</tr>\n<tr>\n<td>Reliability</td>\n<td><strong>Higher</strong> (lossless block transfer)</td>\n<td>Lower</td>\n</tr>\n<tr>\n<td>OSI mapping</td>\n<td><strong>None</strong></td>\n<td>802.3, maps cleanly</td>\n</tr>\n<tr>\n<td>Typical use</td>\n<td>Storage ↔ switch ↔ server in the DC</td>\n<td>LAN aggregation, switch-to-switch</td>\n</tr>\n<tr>\n<td>Security</td>\n<td>Benefits from protocol diversity</td>\n<td>Front-end and back-end share attack surface</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>The security argument:</strong> if you run Ethernet on both the front end and the storage back end, an attacker's Ethernet tooling works against both. Running Fibre Channel on the back end means those tools simply don't apply. Protocol diversity as a defensive property.</p></div>\n<p>Fibre Channel range extends to <strong>5–10 km</strong>, which supports <strong>remote disaster recovery</strong> — replicating large blocks off-site to another building on campus — and <strong>business continuity</strong>, bringing that remote data online quickly after an incident.</p>\n<div class=\"callout trap\"><p>⚠️ <strong>Fibre Channel connects only to Fibre Channel; Ethernet only to Ethernet.</strong> SFP on one end means SFP on the other; QSFP means QSFP. These technologies match themselves and do not intermix.</p></div>\n<h3>Cable management</h3>\n<p><strong>Patch panel.</strong> The termination point where all the office wall ports converge in a central room. Cables are stripped to bare wire and <strong>punched down</strong> onto the back of the panel, hardwiring them. The front presents standard <strong>RJ45</strong> ports, from which patch cables run to switches.</p>\n<p><strong>Cable trays.</strong> Overhead or under-floor channels for running cable out of the way. 📌 <strong>Use separate trays for data and power</strong> — power sources cause EMI in close proximity to data cables.</p>\n<p><strong>UPS (uninterruptible power supply).</strong> Supplies backup power and conditions power against <strong>brownouts and surges</strong>.</p>\n<div class=\"callout trap\"><p>⚠️ Two things the exam wants here:\n1. A UPS is generally <strong>not</strong> meant to run equipment for hours. It provides enough runtime for a <strong>graceful shutdown</strong> rather than an instant power loss.\n2. A UPS is a <strong>battery</strong>, and batteries — especially banks of them — are a <strong>significant source of EMI</strong>. Route data cabling away from them.</p></div>\n<div class=\"lab\"><h3>🔧 LAB 1.5 — Media Selection and Cable Fault Isolation</h3>\n<p>Build a multi-building campus in Packet Tracer requiring correct media choices at each segment (copper access, MMF between floors, SMF between buildings). Deliberately mis-select cable types — straight-through where crossover is needed, MMF where the distance demands SMF — and diagnose each failure from link-state and interface counters.</p></div>\n<hr />", "text": " Source: Day 3 — Cables & Connectors; Day 2 (802.3, Fibre Channel, transceivers) This section is dense with numbers. The exam loves it because it is unambiguous — either you know that OM3 is 40 Gbps at 300 m or you don't. Drill the tables. Copper: shielded vs unshielded The vulnerability of any electrical signal on a metal wire is EMI (electromagnetic interference) — from strong power sources, radio sources, or anything magnetic. STP (shielded twisted pair) — adds a braided metal mesh around the internal cores. Better transmission characteristics, more expensive. Common in 1980s–90s token ring . UTP (unshielded twisted pair) — no shield. Cheaper. Became the standard as Ethernet took over. 📌 The twisting itself provides some EMI protection even without a shield — that's why UTP works at all. Twisting causes interference picked up on adjacent wires to cancel. ⚠️ Why UTP won: token ring never exceeded 16 Mbps, so STP's transmission advantage was irrelevant once Ethernet reached the gigabit range. Cost was the driver. As long as you follow installation guidelines — keep it away from strong power and radio sources — interference isn't a practical problem. UTP categories Category Max speed Notes Cat 1 — Original telephone cable, no data Cat 2 4 Mbps Suitable for original token ring Cat 3 10 Mbps Distances up to ~100 m Cat 4 16 Mbps Token ring maximum Cat 5 100 Mbps \"Fast Ethernet\" Cat 5e 1 Gbps e = enhanced (not \"extended\") Cat 6 1 Gbps / 10 Gbps @ ~55 m 10 G only over roughly half the standard distance Cat 6a 1 Gbps / 10 Gbps a = augmented; more insulation, better EMI resistance. No difference in transmission spec vs Cat 6 Cat 7 10 Gbps @ 100 m Available but less common Cat 8 40 Gbps In development at time of recording 📌 Standard Ethernet distance limit is 100 meters. This number appears everywhere. Memorize it. Coaxial and twinax Coax — a single solid copper conductor at the core, surrounded by insulation, then a grounded conductive metal shield. The shield keeps interference out and signal in. Designation Nickname Speed Distance 10BASE5 Thick Ethernet / Thicknet 10 Mbps ~500 m (5 × standard) 10BASE2 Thin Ethernet / Thinnet 10 Mbps ~185 m (~2 × standard) 📌 Decoding the naming convention — this is worth internalizing because it generalizes: - 10 / 100 / 1000 / 10G = speed - BASE = baseband - 5 / 2 / T / F / S / L = distance or media type Baseband vs broadband. Baseband means the signal has access to the entire bandwidth of the cable — think of the waveform running from the top of the pipe to the bottom, with top = 1 and bottom = 0. Broadband uses variations in frequency and amplitude to carve the cable into multiple channels — which is how a single TV cable carries many channels, each occupying maybe 5% of available bandwidth. Ethernet LANs use baseband. Modern coax types: RG6 and RG11 , used for cable TV, telephony, and internet delivery. Coax in a LAN is effectively extinct. Twinax / Twinaxial — like coax but with two conductors instead of one, twisted, shielded, jacketed. Enables differential signaling (the receiver interprets the difference between the two signals). Used in the data center for very high speed over short runs (~10 m or less). Cost-effective vs fiber. DAC (Direct Attach Copper) — twinax with transceivers permanently attached to each end, containing their own logic. Fixed cable length, plugs straight into high-speed switches, routers, or servers. Short runs, tens of Gbps, electromagnetically shielded. Plenum vs non-plenum. The plenum is the air-handling space above a ceiling where cables and piping run. Ordinary cable jacket plastic emits toxic fumes when burned. Plenum-rated cable is fire-resistant and must be used in plenum spaces , because a fire there can distribute poisonous chemicals through the building's air before anyone notices it. Wiring standards: T568A and T568B Defined by TIA/EIA . They apply to twisted pair and specify only the color sequence of the 8 wires (4 twisted pairs). There is no functional difference between them. Pin T568A T568B 1 White/Green White/Orange 2 Green Orange 3 White/Orange White/Green 4 Blue Blue 5 White/Blue White/Blue 6 Orange Green 7 White/Brown White/Brown 8 Brown Brown 📌 The change between A and B is swapping the green and orange pairs . Pins 4, 5, 7, 8 are identical in both. Which to use: match whatever is already installed; follow project specs; match internally-wired/hardwired components. Residential work typically favors 568A. Straight-through vs crossover. Straight-through — same standard on both ends. Four wires send, four receive, and the port design assumes that alignment. Crossover — different standard on each end (568A on one, 568B on the other). Flips senders and receivers. Use straight-through Use crossover PC ↔ switch PC ↔ PC Switch ↔ router Switch ↔ switch PC ↔ hub Switch ↔ hub Hub ↔ hub Router ↔ router 📌 The rule of thumb: different device types → straight-through. Same device types → crossover. The reason is sender/receiver alignment — PC-to-PC with a straight-through cable sends into the other side's senders, so nothing works. ⚠️ You can identify a crossover cable visually: hold both clear connectors side by side. Straight-through looks identical on both ends; crossover doesn't. 🔗 A+ crossover: crimping is stripping bulk cable to bare copper, seating wires in the connector, and clamping. Large installs buy bulk cable and crimp to length because it's cheaper than pre-made patch cables. Fiber optic construction Interior → exterior: Core (light travels here) → Cladding (often plexiglass, flexible) → Primary coating (protects inner components) → Strength members → Cable jacket . Single-mode vs multimode Single-mode (SMF) Multimode (MMF) Core diameter ~8.3 µm 50 or 62.5 µm Light source High-powered lasers LEDs or lasers Modes carried One beam, down the center Multiple paths simultaneously Distance Long Short Typical use Outdoor, telco, campus-to-campus Indoor, data center patch cables Cost Higher per cable, cheaper over m", "callouts": [{"kind": "pin", "html": "The twisting <em>itself</em> provides some EMI protection even without a shield — that's why UTP works at all. Twisting causes interference picked up on adjacent wires to cancel."}, {"kind": "trap", "html": "<strong>Why UTP won:</strong> token ring never exceeded 16 Mbps, so STP's transmission advantage was irrelevant once Ethernet reached the gigabit range. Cost was the driver. As long as you follow installation guidelines — keep it away from strong power and radio sources — interference isn't a practical problem."}, {"kind": "pin", "html": "<strong>Standard Ethernet distance limit is 100 meters.</strong> This number appears everywhere. Memorize it."}, {"kind": "pin", "html": "<strong>Decoding the naming convention</strong> — this is worth internalizing because it generalizes:\n- <strong>10 / 100 / 1000 / 10G</strong> = speed\n- <strong>BASE</strong> = <strong>baseband</strong>\n- <strong>5 / 2 / T / F / S / L</strong> = distance or media type"}, {"kind": "pin", "html": "The change between A and B is <strong>swapping the green and orange pairs</strong>. Pins 4, 5, 7, 8 are identical in both."}, {"kind": "pin", "html": "<strong>The rule of thumb:</strong> <em>different</em> device types → straight-through. <em>Same</em> device types → crossover. The reason is sender/receiver alignment — PC-to-PC with a straight-through cable sends into the other side's senders, so nothing works."}, {"kind": "trap", "html": "You can identify a crossover cable visually: hold both clear connectors side by side. Straight-through looks identical on both ends; crossover doesn't."}, {"kind": "trap", "html": "<strong>Counterintuitive but tested:</strong> \"multimode\" sounds more capable, but <strong>multimode is generally the less expensive option.</strong> Single-mode is a dedicated, precision implementation. The multiple light paths in MMF interfere with each other, which is exactly why it can't go far."}, {"kind": "pin", "html": "OM5 uses a different multiplexing method to run 4 channels. It's relatively new and increasingly deployed."}, {"kind": "trap", "html": "These are <strong>maximums at maximum distance.</strong> Shorten the run and speed can increase — OM3 at 50 m might carry 100 Gbps rather than 40."}, {"kind": "pin", "html": "<strong>Duplex fiber needs two cores.</strong> You cannot send and receive over a single core simultaneously — light traveling in opposite directions would interfere. Simplex single-core does exist for one-way applications (e.g. digital audio into an amplifier)."}, {"kind": "pin", "html": "<strong>Never intermix UPC and APC.</strong> They won't
