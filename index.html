ecise enough (financial trading, industrial control)\n- <strong>NTS (Network Time Security)</strong> — adds authentication and integrity to NTP, protecting against an attacker feeding you false time</p>\n<div class=\"lab\"><h3>🔧 LAB 3.4 — Addressing and Name Services End to End</h3>\n<p>Build a routed multi-VLAN network with a central DHCP server serving every subnet via IP helper addresses, a DNS server carrying A, AAAA, CNAME, MX and PTR records, and NTP synchronisation across all devices. Break/fix: a missing IP helper causing APIPA on one VLAN only, a scope with no exclusions producing address conflicts, a stale DNS record, and clock skew breaking authentication.</p></div>\n<hr />", "text": " Source: Day 14 — Network Management & IP Services DHCP — dynamic addressing Client systems don't have to be manually configured; they request configuration at startup. What DHCP delivers: IP address, subnet mask, default gateway, DNS servers, and optionally NTP servers, domain name, and vendor-specific options. DORA — see section 1.4 for the exchange. Key terms: Term Meaning Scope The pool of addresses a server can hand out for a subnet Lease How long a client may keep an address before renewing Reservation 📌 A specific IP tied to a specific MAC , so a device always gets the same address while still using DHCP Exclusion Addresses inside the scope that DHCP must not hand out (e.g. static server addresses) Relay agent / IP helper Forwards DHCP broadcasts across a router to a server on another subnet 📌 ⚠️ Reservation vs static assignment. A reservation is managed centrally at the DHCP server; a static address is configured on the device itself. For printers and servers, reservations are usually preferred because you keep central visibility and control. If a question asks how to guarantee a consistent address without manually configuring each device, the answer is reservation. The classic DHCP failure modes: Symptom Cause 169.254.x.x (APIPA) on one subnet, others fine Missing IP helper / relay on that subnet's router APIPA everywhere DHCP server down, or scope exhausted Duplicate IP conflicts Static addresses inside the scope with no exclusion Client gets an address on the wrong subnet VLAN assignment or relay misconfiguration Address works, but no internet Scope handing out a wrong gateway or DNS server DNS — name resolution Maps human-readable names to IP addresses. Runs on port 53 (UDP for queries, TCP for zone transfers). The resolution order — worth knowing because troubleshooting follows it: 1. Local cache 2. HOSTS file ⚠️ — a locally modified HOSTS file overrides DNS entirely and is a classic malware trick and a classic \"why does this one machine resolve wrong?\" answer 3. Configured DNS server 4. Recursive lookup: root → TLD → authoritative Record types — memorize this table: Record Purpose A Name → IPv4 address AAAA Name → IPv6 address CNAME Alias — one name pointing to another name MX Mail exchange — where to deliver email for the domain NS Name server authoritative for the zone PTR Reverse lookup — IP → name SOA Start of Authority — zone metadata, serial number, refresh timers SRV Service location — host and port for a specific service TXT Arbitrary text; used for SPF, DKIM, DMARC and domain verification DNAME Redirects an entire subtree of names, where CNAME redirects a single name Zone concepts: - Forward lookup zone — name to IP. Reverse lookup zone — IP to name (PTR records). - Primary / secondary — the authoritative writable copy vs read-only replicas. - Zone transfer — replication between servers. ⚠️ Uses TCP , and should be restricted to authorized secondaries — an open zone transfer hands an attacker your entire network map. - Internal vs external DNS (split-brain) — different answers for internal and external clients, so internal hostnames aren't exposed publicly. ⚠️ 📌 The signature DNS symptom: ping 8.8.8.8 succeeds but ping google.com fails. Connectivity is fine at Layers 1–3; name resolution is broken. Check DNS server settings, nslookup / dig , the HOSTS file, and DNS cache ( ipconfig /flushdns ). NTP and time synchronization NTP (port 123 , UDP) synchronizes clocks across the network. Stratum levels: Stratum 0 is a reference clock (atomic, GPS); Stratum 1 is directly attached to one; each subsequent stratum is one hop further from the source. Lower stratum = more authoritative. 📌 Why time matters more than it appears: - Kerberos authentication fails on clock skew beyond a small tolerance (typically 5 minutes) - Certificate validation depends on accurate time — a wrong clock makes valid certs look expired or not-yet-valid - Log correlation across devices is impossible without synchronized timestamps, which breaks incident investigation - Scheduled tasks and backups fire at the wrong time Related protocols: - PTP (Precision Time Protocol) — sub-microsecond accuracy for environments where NTP isn't precise enough (financial trading, industrial control) - NTS (Network Time Security) — adds authentication and integrity to NTP, protecting against an attacker feeding you false time 🔧 LAB 3.4 — Addressing and Name Services End to End Build a routed multi-VLAN network with a central DHCP server serving every subnet via IP helper addresses, a DNS server carrying A, AAAA, CNAME, MX and PTR records, and NTP synchronisation across all devices. Break/fix: a missing IP helper causing APIPA on one VLAN only, a scope with no exclusions producing address conflicts, a stale DNS record, and clock skew breaking authentication. ", "callouts": [{"kind": "pin", "html": "<strong>Reservation vs static assignment.</strong> A reservation is managed centrally at the DHCP server; a static address is configured on the device itself. For printers and servers, <strong>reservations are usually preferred</strong> because you keep central visibility and control. If a question asks how to guarantee a consistent address <em>without</em> manually configuring each device, the answer is reservation."}, {"kind": "pin", "html": "<strong>The signature DNS symptom: <code>ping 8.8.8.8</code> succeeds but <code>ping google.com</code> fails.</strong> Connectivity is fine at Layers 1–3; name resolution is broken. Check DNS server settings, <code>nslookup</code>/<code>dig</code>, the HOSTS file, and DNS cache (<code>ipconfig /flushdns</code>)."}, {"kind": "pin", "html": "<strong>Why time matters more than it appears:</strong>\n- <strong>Kerberos authentication fails</strong> on clock skew beyond a small tolerance (typically 5 minutes)\n- <strong>Certificate validation</strong> depends on accurate time — a wrong clock makes valid certs look expired or not-yet-valid\n- <strong>Log correlation</strong> across devices is impossible without synchronized timestamps, which breaks incident investigation\n- Scheduled tasks and backups fire at the wrong time"}]}, {"id": "s19", "num": "3.5", "title": "3.5 VPNs and Remote Access", "short": "VPNs and Remote Access", "part": "PART 3 — Network Operations (Domain 3.0, 19%)", "html": "<p><em>Source: Day 14 — Network Management &amp; IP Services</em></p>\n<h3>VPN types</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Site-to-site</strong></th>\n<th><strong>Client-to-site (remote access)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Connects</td>\n<td><strong>Two networks</strong> that are physically separated</td>\n<td><strong>A single device</strong> to a VPN server</td>\n</tr>\n<tr>\n<td>Endpoints</td>\n<td>Gateway devices at each site</td>\n<td>Client software on the user's device</td>\n</tr>\n<tr>\n<td>Transparency</td>\n<td>Users don't know it's there</td>\n<td>User initiates the connection</td>\n</tr>\n<tr>\n<td>Typical use</td>\n<td>Branch office to head office</td>\n<td>Remote worker to corporate network</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Split tunnel vs full tunnel:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Full tunnel</strong></th>\n<th><strong>Split tunnel</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Traffic through the VPN</td>\n<td><strong>All of it</strong></td>\n<td>Only corporate-bound traffic</td>\n</tr>\n<tr>\n<td>Internet traffic</td>\n<td>Routed via corporate, inspected</td>\n<td>Goes direct</td>\n</tr>\n<tr>\n<td>Security</td>\n<td><strong>Higher</strong> — everything is inspected</td>\n<td>Lower — direct paths are uninspected</td>\n</tr>\n<tr>\n<td>Performance / bandwidth cost</td>\n<td>Worse — this is the <strong>backhaul</strong> problem from 1.8</td>\n<td>Better</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 The split vs full tunnel decision is exactly the tension SD-WAN and SASE were designed to resolve: you want the direct path <em>and</em> the policy enforcement.</p></div>\n<h3>Connecting to network devices for configuration</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Method</th>\n<th>Description</th>\n<th>Security</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Console (serial)</strong></td>\n<td>Direct physical cable to the device's console port</td>\n<td>📌 Requires <strong>physical access</strong>; works when the network is down</td>\n</tr>\n<tr>\n<td><strong>Telnet</strong></td>\n<td>Remote CLI over the network, port 23</td>\n<td>❌ <strong>Cleartext, including credentials.</strong> Never use in production</td>\n</tr>\n<tr>\n<td><strong>SSH</strong></td>\n<td>Encrypted remote CLI, port 22</td>\n<td>✅ <strong>The standard</strong></td>\n</tr>\n<tr>\n<td><strong>HTTP/HTTPS (web GUI)</strong></td>\n<td>Browser-based management</td>\n<td>Use HTTPS only</td>\n</tr>\n<tr>\n<td><strong>API</strong></td>\n<td>Programmatic access</td>\n<td>Underpins automation and SDN</td>\n</tr>\n</tbody>\n</table></div>\n<h3>In-band vs out-of-band management</h3>\n<div class=\"callout pin\"><p>📌 This distinction is a reliable exam question.</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>In-band</strong></th>\n<th><strong>Out-of-band</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Path</td>\n<td>Over the <strong>production network</strong></td>\n<td>Over a <strong>separate, dedicated</strong> path</td>\n</tr>\n<tr>\n<td>Examples</td>\n<td>SSH across the LAN, web GUI</td>\n<td>Console cable, dedicated management port, cellular modem, terminal server</td>\n</tr>\n<tr>\n<td>Cost</td>\n<td>None additional</td>\n<td>Additional infrastructure</td>\n</tr>\n<tr>\n<td>⚠️ <strong>Critical weakness / strength</strong></td>\n<td><strong>If the network is down, you can't manage the device that would fix it</strong></td>\n<td><strong>Works even when the production network is completely down</strong></td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 The whole justification for out-of-band is that catch-22: the device you need to reconfigure is unreachable precisely because it is misconfigured. Out-of-band management is what lets you fix a router remotely after you've accidentally shut down its uplink.</p></div>\n<h3>Jump servers</h3>\n<p>A <strong>jump server</strong> (jump host, jump box) is an intermediary system that sits between a user and the sensitive systems they need to reach.</p>\n<p><strong>How it works:</strong> administrators connect to the jump server first, then from there to internal devices. Direct access from user workstations to sensitive systems is <strong>blocked</strong>.</p>\n<div class=\"callout pin\"><p>📌 <strong>Why it's valuable:</strong>\n- <strong>Single hardened, monitored, audited chokepoint</strong> for administrative access\n- Reduces the attack surface — internal management interfaces are never directly exposed\n- All administrative sessions can be <strong>logged and recorded</strong> in one place\n- Enforces MFA and strong authentication at one controlled point</p></div>\n<div class=\"callout trap\"><p>⚠️ <strong>The corresponding risk:</strong> the jump server becomes a <strong>high-value target and a single point of failure</strong>. Compromise it and you've compromised the path to everything behind it. It must be among the most hardened, most monitored systems you own.</p></div>\n<div class=\"lab\"><h3>🔧 LAB 3.5 — Remote Access and Management Paths</h3>\n<p>Configure a site-to-site VPN between head office and a branch, then add client-to-site remote access. Compare split and full tunnel behaviour by tracing where internet-bound traffic actually goes. Harden device access to SSH only with Telnet disabled, place a jump server as the sole administrative path, and prove out-of-band recovery by shutting down a router's management interface and restoring it over console.</p></div>\n<hr />", "text": " Source: Day 14 — Network Management & IP Services VPN types Site-to-site Client-to-site (remote access) Connects Two networks that are physically separated A single device to a VPN server Endpoints Gateway devices at each site Client software on the user's device Transparency Users don't know it's there User initiates the connection Typical use Branch office to head office Remote worker to corporate network Split tunnel vs full tunnel: Full tunnel Split tunnel Traffic through the VPN All of it Only corporate-bound traffic Internet traffic Routed via corporate, inspected Goes direct Security Higher — everything is inspected Lower — direct paths are uninspected Performance / bandwidth cost Worse — this is the backhaul problem from 1.8 Better 📌 The split vs full tunnel decision is exactly the tension SD-WAN and SASE were designed to resolve: you want the direct path and the policy enforcement. Connecting to network devices for configuration Method Description Security Console (serial) Direct physical cable to the device's console port 📌 Requires physical access ; works when the network is down Telnet Remote CLI over the network, port 23 ❌ Cleartext, including credentials. Never use in production SSH Encrypted remote CLI, port 22 ✅ The standard HTTP/HTTPS (web GUI) Browser-based management Use HTTPS only API Programmatic access Underpins automation and SDN In-band vs out-of-band management 📌 This distinction is a reliable exam question. In-band Out-of-band Path Over the production network Over a separate, dedicated path Examples SSH across the LAN, web GUI Console cable, dedicated management port, cellular modem, terminal server Cost None additional Additional infrastructure ⚠️ Critical weakness / strength If the network is down, you can't manage the device that would fix it Works even when the production network is completely down 📌 The whole justification for out-of-band is that catch-22: the device you need to reconfigure is unreachable precisely because it is misconfigured. Out-of-band management is what lets you fix a router remotely after you've accidentally shut down its uplink. Jump servers A jump server (jump host, jump box) is an intermediary system that sits between a user and the sensitive systems they need to reach. How it works: administrators connect to the jump server first, then from there to internal devices. Direct access from user workstations to sensitive systems is blocked . 📌 Why it's valuable: - Single hardened, monitored, audited chokepoint for administrative access - Reduces the attack surface — internal management interfaces are never directly exposed - All administrative sessions can be logged and recorded in one place - Enforces MFA and strong authentication at one controlled point ⚠️ The corresponding risk: the jump server becomes a high-value target and a single point of failure . Compromise it and you've compromised the path to everything behind it. It must be among the most hardened, most monitored systems you own. 🔧 LAB 3.5 — Remote Access and Management Paths Configure a site-to-site VPN between head office and a branch, then add client-to-site remote access. Compare split and full tunnel behaviour by tracing where internet-bound traffic actually goes. Harden device access to SSH only with Telnet disabled, place a jump server as the sole administrative path, and prove out-of-band recovery by shutting down a router's management interface and restoring it over console. ", "callouts": [{"kind": "pin", "html": "The split vs full tunnel decision is exactly the tension SD-WAN and SASE were designed to resolve: you want the direct path <em>and</em> the policy enforcement."}, {"kind": "pin", "html": "This distinction is a reliable exam question."}, {"kind": "pin", "html": "The whole justification for out-of-band is that catch-22: the device you need to reconfigure is unreachable precisely because it is misconfigured. Out-of-band management is what lets you fix a router remotely after you've accidentally shut down its uplink."}, {"kind": "pin", "html": "<strong>Why it's valuable:</strong>\n- <strong>Single hardened, monitored, audited chokepoint</strong> for administrative access\n- Reduces the attack surface — internal management interfaces are never directly exposed\n- All administrative sessions can be <strong>logged and recorded</strong> in one place\n- Enforces MFA and strong authentication at one controlled point"}, {"kind": "trap", "html": "<strong>The corresponding risk:</strong> the jump server becomes a <strong>high-value target and a single point of failure</strong>. Compromise it and you've compromised the path to everything behind it. It must be among the most hardened, most monitored systems you own."}]}, {"id": "s20", "num": "4.1", "title": "4.1 Security Concepts, Authentication, and Segmentation Enforcement", "short": "Security Concepts, Authenticatio…", "part": "PART 4 — Network Security (Domain 4.0, 14%)", "html": "<h3>The CIA triad</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Principle</th>\n<th>Meaning</th>\n<th>Protected by</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Confidentiality</strong></td>\n<td>Only authorized parties can read the data</td>\n<td>Encryption, access control</td>\n</tr>\n<tr>\n<td><strong>Integrity</strong></td>\n<td>Data hasn't been altered</td>\n<td>Hashing, digital signatures, checksums</td>\n</tr>\n<tr>\n<td><strong>Availability</strong></td>\n<td>Authorized users can access it when needed</td>\n<td>Redundancy, HA, DDoS mitigation, backups</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 Match a control to the leg it protects. Encryption protects confidentiality, <strong>not</strong> integrity — hashing does that.</p></div>\n<h3>Risk vocabulary</h3>\n<div class=\"callout pin\"><p>📌 Precise definitions; the exam tests them as definitions.</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Term</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Risk</strong></td>\n<td>The <strong>possibility of an adverse event</strong> occurring</td>\n</tr>\n<tr>\n<td><strong>Threat</strong></td>\n<td>The potential cause of an unwanted incident</td>\n</tr>\n<tr>\n<td><strong>Vulnerability</strong></td>\n<td>A <strong>weakness</strong> that a threat can exploit</td>\n</tr>\n<tr>\n<td><strong>Exploit</strong></td>\n<td>The method of taking advantage of a vulnerability</td>\n</tr>\n<tr>\n<td><strong>Impact</strong></td>\n<td>The consequence if it happens</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Risk = Threat × Vulnerability × Impact.</strong> A threat with no matching vulnerability presents no risk.</p>\n<p><strong>Risk responses:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Response</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Avoid</strong></td>\n<td>Stop doing the risky activity</td>\n</tr>\n<tr>\n<td><strong>Mitigate</strong></td>\n<td>Reduce likelihood or impact with controls</td>\n</tr>\n<tr>\n<td><strong>Transfer</strong></td>\n<td>Shift it — insurance, or a third-party provider</td>\n</tr>\n<tr>\n<td><strong>Accept</strong></td>\n<td>Acknowledge and take no further action</td>\n</tr>\n</tbody>\n</table></div>\n<h3>Encryption</h3>\n<p>Encryption converts readable data into an unreadable form so only authorized parties can access it.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Symmetric</strong></th>\n<th><strong>Asymmetric</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Keys</td>\n<td><strong>One shared key</strong> for encrypt and decrypt</td>\n<td><strong>Key pair</strong> — public and private</td>\n</tr>\n<tr>\n<td>Speed</td>\n<td><strong>Fast</strong></td>\n<td>Slow</td>\n</tr>\n<tr>\n<td>Problem</td>\n<td><strong>Key distribution</strong> — how do you share the key securely?</td>\n<td>Solves key distribution</td>\n</tr>\n<tr>\n<td>Examples</td>\n<td><strong>AES</strong>, 3DES, <strong>DES</strong> (broken)</td>\n<td><strong>RSA</strong>, <strong>ECC</strong>, Diffie-Hellman</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>How TLS actually uses both:</strong> asymmetric cryptography is used to <strong>exchange</strong> a symmetric session key; the bulk data is then encrypted <strong>symmetrically</strong> because it's far faster. This hybrid model is worth understanding rather than memorizing — it explains why both types exist.</p></div>\n<p><strong>Data states:</strong>\n- <strong>At rest</strong> — stored. Protected by full-disk or file-level encryption.\n- <strong>In transit</strong> — moving. Protected by TLS, IPsec, VPN.\n- <strong>In use</strong> — in memory. Hardest to protect.</p>\n<p><strong>Hashing</strong> is <strong>one-way</strong> — it produces a fixed-length digest that cannot be reversed. Used for <strong>integrity verification</strong> and password storage, not confidentiality. Examples: SHA-256, MD5 (⚠️ broken, collision-prone).</p>\n<p><strong>PKI concepts:</strong> a <strong>certificate</strong> binds a public key to an identity, signed by a <strong>Certificate Authority</strong>. <strong>Self-signed</strong> certificates provide encryption but not third-party-verified identity — which is why browsers warn about them.</p>\n<h3>Honeypots and honeynets</h3>\n<div class=\"callout pin\"><p>📌 <strong>A honeypot is a virtual trap intended to entice potential attackers.</strong> It is a system <strong>deliberately left compromised</strong> — anything from a server to a router to a client computer.</p></div>\n<p><strong>Why deploy one:</strong>\n- Understand attacker behavior and the techniques currently in use\n- Aid investigation of security breaches\n- Collect intelligence on intruder behavior\n- 📌 <strong>Use that intelligence to tune automated IDS/IPS and eliminate false positives</strong> — this connects directly to the anomaly-based detection tuning discussed in 1.2</p>\n<p><strong>Deployment types:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Behavior</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Pure</strong></td>\n<td>Full system; interaction is <strong>recorded for later analysis</strong></td>\n</tr>\n<tr>\n<td><strong>Low interaction</strong></td>\n<td>Automatically records activity from <strong>botnets and worms</strong> — automated threats, no human interaction</td>\n</tr>\n<tr>\n<td><strong>High interaction</strong></td>\n<td><strong>Acts like a real production system.</strong> Intent is for a human to actually compromise it so their actions can be monitored</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ <strong>High-interaction honeypots require more maintenance and higher expertise</strong>, because you must ensure the attacker doesn't use the honeypot as a pivot into the real network. A badly run honeypot is a liability, not an asset.</p></div>\n<p><strong>A honeynet</strong> is a network of honeypots — a more convincing environment.</p>\n<h3>Compliance</h3>\n<p>Being compliant means <strong>adhering to standards created by industry and following industry best practice</strong>.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Framework</th>\n<th>Applies to</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>PCI DSS</strong></td>\n<td>Payment card data</td>\n</tr>\n<tr>\n<td><strong>HIPAA</strong></td>\n<td>Healthcare information (US)</td>\n</tr>\n<tr>\n<td><strong>GDPR</strong></td>\n<td>Personal data of EU residents</td>\n</tr>\n<tr>\n<td><strong>SOX</strong></td>\n<td>Financial reporting (US public companies)</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 Compliance is a <strong>floor, not a ceiling</strong> — meeting a standard is not the same as being secure. But failing one carries legal and financial penalties independent of whether a breach occurs.</p></div>\n<div class=\"callout trap\"><p>⚠️ Connect this to multitenancy in 1.3: regulated data on shared cloud infrastructure raises compliance questions that private or hybrid deployment avoids.</p></div>\n<h3>Network segmentation</h3>\n<p><strong>The process of isolating network devices from one another</strong>, with each segment operating as its own network.</p>\n<p><strong>Why:</strong>\n- <strong>Contains breaches</strong> — an attacker who compromises one segment cannot move laterally into others\n- <strong>Reduces broadcast traffic</strong> and improves performance\n- <strong>Simplifies compliance scope</strong> — isolate cardholder data and only that segment falls under PCI\n- <strong>Enforces least privilege</strong> at the network level</p>\n<p><strong>Methods:</strong> VLANs (2.1), subnets and routing with ACLs, physical separation/air gap, <strong>microsegmentation</strong> (see 1.6), and DMZ/screened subnet (see 1.2).</p>\n<div class=\"callout pin\"><p>📌 <strong>Segmentation is the standard answer</strong> for IoT (2.4), SCADA/ICS (2.4), guest networks (2.3), and east-west lateral movement (1.6). When a scenario involves untrusted or unpatchable devices needing network access, segment them.</p></div>\n<h3>Network access control</h3>\n<p><strong>Port security.</strong> Restricts <strong>ingress traffic</strong> on a switch port by limiting which <strong>MAC addresses</strong> may connect. The switch compares the MAC of each incoming frame against its allowed list; a mismatch triggers a <strong>violation</strong>.</p>\n<div class=\"callout pin\"><p>📌 <strong>Two violation triggers to know:</strong>\n1. <strong>Maximum MAC count exceeded</strong> — the port is configured to allow a limited number of addresses (learned dynamically or configured statically). If the limit is 20 and traffic from a 21st MAC arrives, violation.\n2. ⚠️ <strong>Move violation</strong> — a MAC learned on one port appears on <strong>another port in the same VLAN</strong>. It looks like the system moved to a port it wasn't authorized for.</p></div>\n<p><strong>Violation modes</strong> (see 2.2): protect (discard silently), restrict (discard and log), <strong>shutdown</strong> (err-disable the port — the default).</p>\n<p><strong>802.1X.</strong> Port-based network access control requiring <strong>authentication before the port is opened</strong>.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Component</th>\n<th>Role</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Supplicant</strong></td>\n<td>The client device requesting access</td>\n</tr>\n<tr>\n<td><strong>Authenticator</strong></td>\n<td>The switch or AP controlling the port</td>\n</tr>\n<tr>\n<td><strong>Authentication server</strong></td>\n<td><strong>RADIUS</strong>, which makes the decision</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>EAP</strong> is the framework carrying the authentication exchange (PEAP, EAP-TLS, EAP-TTLS).</p>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>802.1X is fundamentally stronger than MAC filtering or port security</strong>, because it authenticates an <strong>identity</strong> rather than a <strong>hardware address</strong>. MAC addresses are trivially spoofed; credentials and certificates are not.</p></div>\n<p><strong>MAC filtering.</strong> Allow or deny based on MAC address. ⚠️ <strong>Weak security</strong> — MAC addresses are transmitted in cleartext in every frame and can be cloned in seconds. Treat it as an inventory convenience, not a control.</p>\n<p><strong>RADIUS vs TACACS+:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th></th>\n<th><strong>RADIUS</strong></th>\n<th><strong>TACACS+</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Standard</td>\n<td><strong>Open</strong></td>\n<td><strong>Cisco-proprietary</strong></td>\n</tr>\n<tr>\n<td>Transport</td>\n<td>UDP</td>\n<td><strong>TCP</strong></td>\n</tr>\n<tr>\n<td>Encryption</td>\n<td><strong>Password only</strong></td>\n<td><strong>Entire payload</strong></td>\n</tr>\n<tr>\n<td>AAA</td>\n<td>Combines authentication and authorization</td>\n<td><strong>Separates</strong> all three</td>\n</tr>\n<tr>\n<td>Typical use</td>\n<td>Network access, wireless, VPN</td>\n<td><strong>Device administration</strong></td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>The discriminator: TACACS+ encrypts the whole payload and separates AAA functions</strong>, which is why it's preferred for administrative access to network devices.</p></div>\n<h3>Access control models</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Model</th>\n<th>Basis</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>RBAC (Role-Based)</strong></td>\n<td>Permissions attached to <strong>roles</strong>; users inherit via role membership</td>\n</tr>\n<tr>\n<td><strong>MAC (Mandatory)</strong></td>\n<td>System-enforced labels and clearances; users cannot change permissions</td>\n</tr>\n<tr>\n<td><strong>DAC (Discretionary)</strong></td>\n<td>The data <strong>owner</strong> decides who gets access</td>\n</tr>\n<tr>\n<td><strong>ABAC (Attribute-Based)</strong></td>\n<td>Decisions from attributes — user, device, location, time</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>Least privilege</strong> and <strong>separation of duties</strong> are the governing principles, and they run through the zero trust discussion in 1.8.</p></div>\n<h3>ACLs, URL filtering, and content filtering</h3>\n<p><strong>ACLs (Access Control Lists)</strong> grant or deny traffic based on criteria — source/destination IP, protocol, port.</p>\n<div class=\"callout pin\"><p>📌 <strong>Two rules that decide most ACL questions:</strong>\n1. <strong>Processed top to bottom; first match wins.</strong> Order matters enormously — a permissive rule above a restrictive one makes the restrictive one dead code.\n2. <strong>Implicit deny at the end.</strong> Anything not explicitly permitted is denied.</p></div>\n<p><strong>URL filtering</strong> — allow/deny by web address (see the proxy discussion in 1.2).\n<strong>Content filtering</strong> — inspect and filter by content category or type, including scanning for malware and for sensitive data leaving the organization.</p>\n<div class=\"lab\"><h3>🔧 LAB 4.1 — Segmentation and Access Control</h3>\n<p>Build a flat network and segment it properly: separate VLANs for corporate, guest, IoT and management, with a Layer 3 device applying inter-VLAN ACLs. Add 802.1X with a RADIUS server so ports authenticate identities rather than MAC addresses. Break/fix: an ACL whose rule order silently permits traffic it was written to block, and a segment that reaches the management VLAN because of a missing implicit-deny assumption.</p></div>\n<hr />", "text": " The CIA triad Principle Meaning Protected by Confidentiality Only authorized parties can read the data Encryption, access control Integrity Data hasn't been altered Hashing, digital signatures, checksums Availability Authorized users can access it when needed Redundancy, HA, DDoS mitigation, backups 📌 Match a control to the leg it protects. Encryption protects confidentiality, not integrity — hashing does that. Risk vocabulary 📌 Precise definitions; the exam tests them as definitions. Term Definition Risk The possibility of an adverse event occurring Threat The potential cause of an unwanted incident Vulnerability A weakness that a threat can exploit Exploit The method of taking advantage of a vulnerability Impact The consequence if it happens Risk = Threat × Vulnerability × Impact. A threat with no matching vulnerability presents no risk. Risk responses: Response Meaning Avoid Stop doing the risky activity Mitigate Reduce likelihood or impact with controls Transfer Shift it — insurance, or a third-party provider Accept Acknowledge and take no further action Encryption Encryption converts readable data into an unreadable form so only authorized parties can access it. Symmetric Asymmetric Keys One shared key for encrypt and decrypt Key pair — public and private Speed Fast Slow Problem Key distribution — how do you share the key securely? Solves key distribution Examples AES , 3DES, DES (broken) RSA , ECC , Diffie-Hellman 📌 How TLS actually uses both: asymmetric cryptography is used to exchange a symmetric session key; the bulk data is then encrypted symmetrically because it's far faster. This hybrid model is worth understanding rather than memorizing — it explains why both types exist. Data states: - At rest — stored. Protected by full-disk or file-level encryption. - In transit — moving. Protected by TLS, IPsec, VPN. - In use — in memory. Hardest to protect. Hashing is one-way — it produces a fixed-length digest that cannot be reversed. Used for integrity verification and password storage, not confidentiality. Examples: SHA-256, MD5 (⚠️ broken, collision-prone). PKI concepts: a certificate binds a public key to an identity, signed by a Certificate Authority . Self-signed certificates provide encryption but not third-party-verified identity — which is why browsers warn about them. Honeypots and honeynets 📌 A honeypot is a virtual trap intended to entice potential attackers. It is a system deliberately left compromised — anything from a server to a router to a client computer. Why deploy one: - Understand attacker behavior and the techniques currently in use - Aid investigation of security breaches - Collect intelligence on intruder behavior - 📌 Use that intelligence to tune automated IDS/IPS and eliminate false positives — this connects directly to the anomaly-based detection tuning discussed in 1.2 Deployment types: Type Behavior Pure Full system; interaction is recorded for later analysis Low interaction Automatically records activity from botnets and worms — automated threats, no human interaction High interaction Acts like a real production system. Intent is for a human to actually compromise it so their actions can be monitored ⚠️ High-interaction honeypots require more maintenance and higher expertise , because you must ensure the attacker doesn't use the honeypot as a pivot into the real network. A badly run honeypot is a liability, not an asset. A honeynet is a network of honeypots — a more convincing environment. Compliance Being compliant means adhering to standards created by industry and following industry best practice . Framework Applies to PCI DSS Payment card data HIPAA Healthcare information (US) GDPR Personal data of EU residents SOX Financial reporting (US public companies) 📌 Compliance is a floor, not a ceiling — meeting a standard is not the same as being secure. But failing one carries legal and financial penalties independent of whether a breach occurs. ⚠️ Connect this to multitenancy in 1.3: regulated data on shared cloud infrastructure raises compliance questions that private or hybrid deployment avoids. Network segmentation The process of isolating network devices from one another , with each segment operating as its own network. Why: - Contains breaches — an attacker who compromises one segment cannot move laterally into others - Reduces broadcast traffic and improves performance - Simplifies compliance scope — isolate cardholder data and only that segment falls under PCI - Enforces least privilege at the network level Methods: VLANs (2.1), subnets and routing with ACLs, physical separation/air gap, microsegmentation (see 1.6), and DMZ/screened subnet (see 1.2). 📌 Segmentation is the standard answer for IoT (2.4), SCADA/ICS (2.4), guest networks (2.3), and east-west lateral movement (1.6). When a scenario involves untrusted or unpatchable devices needing network access, segment them. Network access control Port security. Restricts ingress traffic on a switch port by limiting which MAC addresses may connect. The switch compares the MAC of each incoming frame against its allowed list; a mismatch triggers a violation . 📌 Two violation triggers to know: 1. Maximum MAC count exceeded — the port is configured to allow a limited number of addresses (learned dynamically or configured statically). If the limit is 20 and traffic from a 21st MAC arrives, violation. 2. ⚠️ Move violation — a MAC learned on one port appears on another port in the same VLAN . It looks like the system moved to a port it wasn't authorized for. Violation modes (see 2.2): protect (discard silently), restrict (discard and log), shutdown (err-disable the port — the default). 802.1X. Port-based network access control requiring authentication before the port is opened . Component Role Supplicant The client device requesting access Authenticator The switch or AP controlling the port Authentication server RADIUS , which makes the decision EAP is the framework carrying the authentication exchange (PEAP,", "callouts": [{"kind": "pin", "html": "Match a control to the leg it protects. Encryption protects confidentiality, <strong>not</strong> integrity — hashing does that."}, {"kind": "pin", "html": "Precise definitions; the exam tests them as definitions."}, {"kind": "pin", "html": "<strong>How TLS actually uses both:</strong> asymmetric cryptography is used to <strong>exchange</strong> a symmetric session key; the bulk data is then encrypted <strong>symmetrically</strong> because it's far faster. This hybrid model is worth understanding rather than memorizing — it explains why both types exist."}, {"kind": "pin", "html": "<strong>A honeypot is a virtual trap intended to entice potential attackers.</strong> It is a system <strong>deliberately left compromised</strong> — anything from a server to a router to a client computer."}, {"kind": "trap", "html": "<strong>High-interaction honeypots require more maintenance and higher expertise</strong>, because you must ensure the attacker doesn't use the honeypot as a pivot into the real network. A badly run honeypot is a liability, not an asset."}, {"kind": "pin", "html": "Compliance is a <strong>floor, not a ceiling</strong> — meeting a standard is not the same as being secure. But failing one carries legal and financial penalties independent of whether a breach occurs."}, {"kind": "trap", "html": "Connect this to multitenancy in 1.3: regulated data on shared cloud infrastructure raises compliance questions that private or hybrid deployment avoids."}, {"kind": "pin", "html": "<strong>Segmentation is the standard answer</strong> for IoT (2.4), SCADA/ICS (2.4), guest networks (2.3), and east-west lateral movement (1.6). When a scenario involves untrusted or unpatchable devices needing network access, segment them."}, {"kind": "pin", "html": "<strong>Two violation triggers to know:</strong>\n1. <strong>Maximum MAC count exceeded</strong> — the port is configured to allow a limited number of addresses (learned dynamically or configured statically). If the limit is 20 and traffic from a 21st MAC arrives, violation.\n2. ⚠️ <strong>Move violation</strong> — a MAC learned on one port appears on <strong>another port in the same VLAN</strong>. It looks like the system moved to a port it wasn't authorized for."}, {"kind": "pin", "html": "<strong>802.1X is fundamentally stronger than MAC filtering or port security</strong>, because it authenticates an <strong>identity</strong> rather than a <strong>hardware address</strong>. MAC addresses are trivially spoofed; credentials and certificates are not."}, {"kind": "pin", "html": "<strong>The discriminator: TACACS+ encrypts the whole payload and separates AAA functions</strong>, which is why it's preferred for administrative access to network devices."}, {"kind": "pin", "html": "<strong>Least privilege</strong> and <strong>separation of duties</strong> are the governing principles, and they run through the zero trust discussion in 1.8."}, {"kind": "pin", "html": "<strong>Two rules that decide most ACL questions:</strong>\n1. <strong>Processed top to bottom; first match wins.</strong> Order matters enormously — a permissive rule above a restrictive one makes the restrictive one dead code.\n2. <strong>Implicit deny at the end.</strong> Anything not explicitly permitted is denied."}]}, {"id": "s21", "num": "4.2", "title": "4.2 Common Network Attacks", "short": "Common Network Attacks", "part": "PART 4 — Network Security (Domain 4.0, 14%)", "html": "<p><em>New section. The N10-009 objectives dedicate 4.2 entirely to attack types, and the Day-format transcripts covered them only in passing. Written to close that gap.</em></p>\n<div class=\"callout trap\"><p>⚠️ This objective is <strong>pure recall under pressure</strong>. The exam gives you a symptom or a scenario and asks which attack it is. Learn each one by its <strong>distinguishing signature</strong> — the detail that rules the others out.</p></div>\n<h3>Denial of Service</h3>\n<p><strong>DoS</strong> makes a resource unavailable to legitimate users by exhausting something finite: bandwidth, connection state, CPU, or memory.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Variant</th>\n<th>Mechanism</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>DoS</strong></td>\n<td>A single source overwhelms a target</td>\n</tr>\n<tr>\n<td><strong>DDoS</strong></td>\n<td>📌 <strong>Many</strong> compromised hosts — a <strong>botnet</strong> — attack at once. Harder to block because there is no single source IP to filter</td>\n</tr>\n<tr>\n<td><strong>Amplification / reflection</strong></td>\n<td>Attacker sends small spoofed requests to third-party servers, which send <strong>large</strong> replies to the victim. DNS and NTP are classic amplifiers</td>\n</tr>\n<tr>\n<td><strong>Friendly / unintentional DoS</strong></td>\n<td>No attacker at all — a link saturated by a legitimate traffic spike, or a misconfiguration causing a loop</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>The amplification insight worth understanding:</strong> the attacker spoofs the <em>victim's</em> address as the source, so replies go to the victim. A small query producing a large answer means the attacker multiplies their own bandwidth many times over.</p></div>\n<div class=\"callout trap\"><p>⚠️ <strong>Friendly DoS is a real exam answer.</strong> If a scenario describes an outage with no evidence of malice — a backup job saturating a WAN link, or a broadcast storm from a switching loop — the answer is unintentional, not an attack.</p></div>\n<p><strong>Mitigation:</strong> upstream filtering and scrubbing services, rate limiting, anycast distribution (see 1.7), and eliminating the loops that cause the friendly variety.</p>\n<h3>VLAN hopping</h3>\n<p>Reaching a VLAN you were never assigned to. Two methods, and the exam distinguishes them:</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Method</th>\n<th>How it works</th>\n<th>Prevention</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Switch spoofing</strong></td>\n<td>The attacker's device <strong>pretends to be a switch</strong> and negotiates a trunk, which then carries every VLAN</td>\n<td>📌 <strong>Disable automatic trunk negotiation.</strong> Set access ports explicitly to access mode</td>\n</tr>\n<tr>\n<td><strong>Double tagging</strong></td>\n<td>The frame is given <strong>two 802.1Q tags</strong>. The first switch strips the outer tag and forwards it; the second switch acts on the inner tag and delivers it into the target VLAN</td>\n<td>📌 <strong>Change the native VLAN</strong> to an unused one and never carry user traffic on it</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout both\"><p>⚠️ 📌 <strong>Double tagging exploits the native VLAN directly</strong> — this is exactly why section 2.2 insists the native VLAN must match on both trunk ends and should be an unused VLAN. It is also <strong>one-way</strong>: the attacker can send into the target VLAN but receives nothing back.</p></div>\n<h3>MAC flooding</h3>\n<p>The attacker floods a switch with frames carrying <strong>thousands of bogus source MAC addresses</strong>, filling the finite MAC address table.</p>\n<div class=\"callout pin\"><p>📌 <strong>What happens next is the whole point.</strong> Once the table is full, the switch can no longer learn or store legitimate entries. Unable to look up a destination, it <strong>floods frames out every port</strong> — reverting to hub-like behaviour (see 2.4). The attacker now sees traffic intended for other hosts.</p></div>\n<p><strong>This is an availability attack that becomes a confidentiality attack.</strong> That progression is the exam's favourite thing about it.</p>\n<p><strong>Mitigation:</strong> <strong>port security</strong> with a MAC limit per port (see 4.1) — the control is a direct answer to this attack.</p>\n<h3>ARP poisoning and ARP spoofing</h3>\n<p>ARP has <strong>no authentication</strong> (see 2.2). Any device can answer for any IP address.</p>\n<p><strong>The attack:</strong> the attacker sends unsolicited ARP replies claiming that the <strong>default gateway's IP</strong> belongs to the <strong>attacker's MAC</strong>. Victims update their ARP caches and begin sending all off-subnet traffic to the attacker, who forwards it on — becoming an <strong>on-path attacker</strong>.</p>\n<div class=\"callout pin\"><p>📌 <strong>Detection signature:</strong> two different IP addresses resolving to the <strong>same MAC</strong>, or a gateway MAC that changes unexpectedly. <code>arp -a</code> shows it.</p></div>\n<div class=\"callout trap\"><p>⚠️ <strong>On-path attack</strong> is the current term for what older material calls <strong>man-in-the-middle</strong>. Both may appear; they mean the same thing.</p></div>\n<p><strong>Mitigation:</strong> <strong>Dynamic ARP Inspection (DAI)</strong>, DHCP snooping, static ARP entries for critical hosts, and encryption so intercepted traffic is unreadable.</p>\n<h3>DNS poisoning and spoofing</h3>\n<p>Corrupting name resolution so a legitimate name resolves to an attacker's address.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Where it happens</th>\n<th>Mechanism</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Local HOSTS file</strong></td>\n<td>📌 Modified on the host. Overrides DNS entirely — see 3.4</td>\n</tr>\n<tr>\n<td><strong>Resolver cache poisoning</strong></td>\n<td>Forged responses injected into a caching server, affecting <strong>everyone</strong> who uses it</td>\n</tr>\n<tr>\n<td><strong>Rogue DNS server</strong></td>\n<td>Clients handed a malicious DNS server, often via a rogue DHCP server</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout trap\"><p>⚠️ <strong>The signature symptom:</strong> the address bar shows the correct name, but the site is wrong — or the certificate warning fires because the attacker cannot produce a valid certificate for that name. <strong>That certificate warning is the user's last line of defence</strong>, which is why training people to click through it is so damaging.</p></div>\n<p><strong>Mitigation:</strong> <strong>DNSSEC</strong>, restricting recursion, securing zone transfers (see 3.4), and HTTPS with proper certificate validation.</p>\n<h3>Rogue services</h3>\n<p>Unauthorised services offering legitimate-looking functions on the network.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Rogue service</th>\n<th>Effect</th>\n<th>Detection</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Rogue DHCP server</strong></td>\n<td>Hands out wrong gateway and DNS, redirecting traffic through the attacker</td>\n<td>📌 Clients receive addressing from an unexpected server or an unexpected subnet</td>\n</tr>\n<tr>\n<td><strong>Rogue access point</strong></td>\n<td>An unauthorised AP on the corporate network. ⚠️ <strong>Often an employee, not an attacker</strong> (see 1.2)</td>\n<td>Wireless scanning, WLC detection</td>\n</tr>\n<tr>\n<td><strong>Evil twin</strong></td>\n<td>An AP broadcasting a <strong>legitimate SSID</strong> to lure clients</td>\n<td>Two identical SSIDs, unexpected signal strength</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Mitigation for rogue DHCP: DHCP snooping</strong>, which permits DHCP server responses only from trusted ports. 📌 That is the specific named control, and it is the expected answer.</p>\n<h3>Social engineering</h3>\n<p>Manipulating <strong>people</strong> rather than technology. 📌 The exam treats this as its own attack category because no technical control fully prevents it.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Attack</th>\n<th>Definition</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Phishing</strong></td>\n<td>Fraudulent messages at scale seeking credentials or action</td>\n</tr>\n<tr>\n<td><strong>Spear phishing</strong></td>\n<td>Phishing <strong>targeted</strong> at a specific person using researched detail</td>\n</tr>\n<tr>\n<td><strong>Whaling</strong></td>\n<td>Spear phishing aimed at <strong>executives</strong></td>\n</tr>\n<tr>\n<td><strong>Vishing</strong></td>\n<td>Voice phishing, by phone</td>\n</tr>\n<tr>\n<td><strong>Smishing</strong></td>\n<td>Phishing by <strong>SMS</strong></td>\n</tr>\n<tr>\n<td><strong>Pretexting</strong></td>\n<td>Inventing a scenario to establish false legitimacy</td>\n</tr>\n<tr>\n<td><strong>Tailgating / piggybacking</strong></td>\n<td>Following an authorised person through a controlled door (see 4.3)</td>\n</tr>\n<tr>\n<td><strong>Shoulder surfing</strong></td>\n<td>Observing credentials being entered</td>\n</tr>\n<tr>\n<td><strong>Dumpster diving</strong></td>\n<td>Recovering sensitive material from discarded waste</td>\n</tr>\n<tr>\n<td><strong>Watering hole</strong></td>\n<td>Compromising a site the target group is known to visit</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>The principles attackers exploit:</strong> authority, urgency, scarcity, familiarity, trust, and intimidation. If a scenario emphasises <strong>time pressure</strong> plus an <strong>authority claim</strong>, it is social engineering regardless of the delivery method.</p></div>\n<p><strong>Mitigation:</strong> user training, verification procedures for unusual requests, and MFA so a stolen password alone is insufficient.</p>\n<h3>Malware</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Type</th>\n<th>Distinguishing behaviour</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Virus</strong></td>\n<td>Attaches to a file and requires <strong>user action</strong> to execute</td>\n</tr>\n<tr>\n<td><strong>Worm</strong></td>\n<td>📌 <strong>Self-replicating across the network with no user interaction</strong> — which is why worms spread so fast</td>\n</tr>\n<tr>\n<td><strong>Trojan</strong></td>\n<td>Disguised as legitimate software</td>\n</tr>\n<tr>\n<td><strong>Ransomware</strong></td>\n<td>Encrypts data and demands payment</td>\n</tr>\n<tr>\n<td><strong>Spyware / keylogger</strong></td>\n<td>Covertly gathers information</td>\n</tr>\n<tr>\n<td><strong>Rootkit</strong></td>\n<td>Hides at a deep level, often kernel or firmware, to evade detection</td>\n</tr>\n<tr>\n<td><strong>Botnet client</strong></td>\n<td>Enrols the host into a network of remotely controlled machines</td>\n</tr>\n<tr>\n<td><strong>Logic bomb</strong></td>\n<td>Dormant until a trigger condition, such as a date or an event</td>\n</tr>\n<tr>\n<td><strong>Fileless malware</strong></td>\n<td>Runs in memory using legitimate system tools, leaving little on disk</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout both\"><p>⚠️ 📌 <strong>Virus versus worm is the single most tested malware distinction.</strong> A virus needs a user to open something; a <strong>worm needs nothing</strong>. If a scenario describes rapid spread across a network with no user action, it is a worm.</p></div>\n<div class=\"callout pin\"><p>📌 <strong>Ransomware is where backups become a security control, not just an operations one.</strong> The 3-2-1 rule and an <strong>offline or immutable</strong> copy are what defeat it — see 3.3. An attacker who can encrypt your backups has defeated the backup strategy entirely.</p></div>\n<h3>Other attacks worth knowing</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Attack</th>\n<th>Signature</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>On-path (MITM)</strong></td>\n<td>Attacker positioned between two parties, relaying and possibly altering traffic</td>\n</tr>\n<tr>\n<td><strong>Deauthentication</strong></td>\n<td>Forged 802.11 management frames disconnect wireless clients — often a precursor to an evil twin</td>\n</tr>\n<tr>\n<td><strong>Brute force / password spraying</strong></td>\n<td>Guessing credentials. Spraying tries <strong>one common password across many accounts</strong> to avoid lockout</td>\n</tr>\n<tr>\n<td><strong>Credential stuffing</strong></td>\n<td>Reusing credentials leaked from another breach</td>\n</tr>\n<tr>\n<td><strong>DNS tunnelling</strong></td>\n<td>Exfiltrating data inside DNS queries, which firewalls often permit unexamined</td>\n</tr>\n<tr>\n<td><strong>Spoofing</strong></td>\n<td>Forging a source address — IP, MAC, or email</td>\n</tr>\n<tr>\n<td><strong>Insider threat</strong></td>\n<td>Authorised access misused. ⚠️ Perimeter controls never see it — connects to east-west visibility in 1.6</td>\n</tr>\n</tbody>\n</table></div>\n<h3>Attack → control quick reference</h3>\n<div class=\"callout pin\"><p>📌 <strong>Learn this table in the control direction too.</strong> The exam asks both \"what attack is this?\" and \"which control prevents it?\"</p></div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Attack</th>\n<th>Primary control</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>MAC flooding</td>\n<td><strong>Port security</strong></td>\n</tr>\n<tr>\n<td>ARP poisoning</td>\n<td><strong>Dynamic ARP Inspection</strong></td>\n</tr>\n<tr>\n<td>Rogue DHCP</td>\n<td><strong>DHCP snooping</strong></td>\n</tr>\n<tr>\n<td>VLAN hopping (spoofing)</td>\n<td><strong>Disable trunk negotiation</strong></td>\n</tr>\n<tr>\n<td>VLAN hopping (double tag)</td>\n<td><strong>Unused native VLAN</strong></td>\n</tr>\n<tr>\n<td>DNS poisoning</td>\n<td><strong>DNSSEC</strong></td>\n</tr>\n<tr>\n<td>Evil twin</td>\n<td><strong>802.1X / WPA3, certificate validation</strong></td>\n</tr>\n<tr>\n<td>Deauthentication</td>\n<td><strong>802.11w management frame protection</strong></td>\n</tr>\n<tr>\n<td>Social engineering</td>\n<td><strong>Training and MFA</strong></td>\n</tr>\n<tr>\n<td>Ransomware</td>\n<td><strong>Offline, tested backups</strong></td>\n</tr>\n<tr>\n<td>DDoS</td>\n<td><strong>Upstream scrubbing, rate limiting</strong></td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"lab\"><h3>🔧 LAB 4.2 — Attack and Defence</h3>\n<p>Packet Tracer supports several of these directly. Build a network and demonstrate MAC flooding filling the CAM table and triggering flooding, then stop it with port security. Introduce a rogue DHCP server and watch clients take bad addressing, then defeat it with DHCP snooping. Create a VLAN hopping scenario via an unused native VLAN, and stage an evil twin alongside a legitimate SSID. Each stage is build it, break it, then defend it.</p></div>\n<hr />", "text": " New section. The N10-009 objectives dedicate 4.2 entirely to attack types, and the Day-format transcripts covered them only in passing. Written to close that gap. ⚠️ This objective is pure recall under pressure . The exam gives you a symptom or a scenario and asks which attack it is. Learn each one by its distinguishing signature — the detail that rules the others out. Denial of Service DoS makes a resource unavailable to legitimate users by exhausting something finite: bandwidth, connection state, CPU, or memory. Variant Mechanism DoS A single source overwhelms a target DDoS 📌 Many compromised hosts — a botnet — attack at once. Harder to block because there is no single source IP to filter Amplification / reflection Attacker sends small spoofed requests to third-party servers, which send large replies to the victim. DNS and NTP are classic amplifiers Friendly / unintentional DoS No attacker at all — a link saturated by a legitimate traffic spike, or a misconfiguration causing a loop 📌 The amplification insight worth understanding: the attacker spoofs the victim's address as the source, so replies go to the victim. A small query producing a large answer means the attacker multiplies their own bandwidth many times over. ⚠️ Friendly DoS is a real exam answer. If a scenario describes an outage with no evidence of malice — a backup job saturating a WAN link, or a broadcast storm from a switching loop — the answer is unintentional, not an attack. Mitigation: upstream filtering and scrubbing services, rate limiting, anycast distribution (see 1.7), and eliminating the loops that cause the friendly variety. VLAN hopping Reaching a VLAN you were never assigned to. Two methods, and the exam distinguishes them: Method How it works Prevention Switch spoofing The attacker's device pretends to be a switch and negotiates a trunk, which then carries every VLAN 📌 Disable automatic trunk negotiation. Set access ports explicitly to access mode Double tagging The frame is given two 802.1Q tags . The first switch strips the outer tag and forwards it; the second switch acts on the inner tag and delivers it into the target VLAN 📌 Change the native VLAN to an unused one and never carry user traffic on it ⚠️ 📌 Double tagging exploits the native VLAN directly — this is exactly why section 2.2 insists the native VLAN must match on both trunk ends and should be an unused VLAN. It is also one-way : the attacker can send into the target VLAN but receives nothing back. MAC flooding The attacker floods a switch with frames carrying thousands of bogus source MAC addresses , filling the finite MAC address table. 📌 What happens next is the whole point. Once the table is full, the switch can no longer learn or store legitimate entries. Unable to look up a destination, it floods frames out every port — reverting to hub-like behaviour (see 2.4). The attacker now sees traffic intended for other hosts. This is an availability attack that becomes a confidentiality attack. That progression is the exam's favourite thing about it. Mitigation: port security with a MAC limit per port (see 4.1) — the control is a direct answer to this attack. ARP poisoning and ARP spoofing ARP has no authentication (see 2.2). Any device can answer for any IP address. The attack: the attacker sends unsolicited ARP replies claiming that the default gateway's IP belongs to the attacker's MAC . Victims update their ARP caches and begin sending all off-subnet traffic to the attacker, who forwards it on — becoming an on-path attacker . 📌 Detection signature: two different IP addresses resolving to the same MAC , or a gateway MAC that changes unexpectedly. arp -a shows it. ⚠️ On-path attack is the current term for what older material calls man-in-the-middle . Both may appear; they mean the same thing. Mitigation: Dynamic ARP Inspection (DAI) , DHCP snooping, static ARP entries for critical hosts, and encryption so intercepted traffic is unreadable. DNS poisoning and spoofing Corrupting name resolution so a legitimate name resolves to an attacker's address. Where it happens Mechanism Local HOSTS file 📌 Modified on the host. Overrides DNS entirely — see 3.4 Resolver cache poisoning Forged responses injected into a caching server, affecting everyone who uses it Rogue DNS server Clients handed a malicious DNS server, often via a rogue DHCP server ⚠️ The signature symptom: the address bar shows the correct name, but the site is wrong — or the certificate warning fires because the attacker cannot produce a valid certificate for that name. That certificate warning is the user's last line of defence , which is why training people to click through it is so damaging. Mitigation: DNSSEC , restricting recursion, securing zone transfers (see 3.4), and HTTPS with proper certificate validation. Rogue services Unauthorised services offering legitimate-looking functions on the network. Rogue service Effect Detection Rogue DHCP server Hands out wrong gateway and DNS, redirecting traffic through the attacker 📌 Clients receive addressing from an unexpected server or an unexpected subnet Rogue access point An unauthorised AP on the corporate network. ⚠️ Often an employee, not an attacker (see 1.2) Wireless scanning, WLC detection Evil twin An AP broadcasting a legitimate SSID to lure clients Two identical SSIDs, unexpected signal strength Mitigation for rogue DHCP: DHCP snooping , which permits DHCP server responses only from trusted ports. 📌 That is the specific named control, and it is the expected answer. Social engineering Manipulating people rather than technology. 📌 The exam treats this as its own attack category because no technical control fully prevents it. Attack Definition Phishing Fraudulent messages at scale seeking credentials or action Spear phishing Phishing targeted at a specific person using researched detail Whaling Spear phishing aimed at executives Vishing Voice phishing, by phone Smishing Phishing by SMS Pretexting Inventing a scenario to establish false ", "callouts": [{"kind": "trap", "html": "This objective is <strong>pure recall under pressure</strong>. The exam gives you a symptom or a scenario and asks which attack it is. Learn each one by its <strong>distinguishing signature</strong> — the detail that rules the others out."}, {"kind": "pin", "html": "<strong>The amplification insight worth understanding:</strong> the attacker spoofs the <em>victim's</em> address as the source, so replies go to the victim. A small query producing a large answer means the attacker multiplies their own bandwidth many times over."}, {"kind": "trap", "html": "<strong>Friendly DoS is a real exam answer.</strong> If a scenario describes an outage with no evidence of malice — a backup job saturating a WAN link, or a broadcast storm from a switching loop — the answer is unintentional, not an attack."}, {"kind": "pin", "html": "<strong>Double tagging exploits the native VLAN directly</strong> — this is exactly why section 2.2 insists the native VLAN must match on both trunk ends and should be an unused VLAN. It is also <strong>one-way</strong>: the attacker can send into the target VLAN but receives nothing back."}, {"kind": "pin", "html": "<strong>What happens next is the whole point.</strong> Once the table is full, the switch can no longer learn or store legitimate entries. Unable to look up a destination, it <strong>floods frames out every port</strong> — reverting to hub-like behaviour (see 2.4). The attacker now sees traffic intended for other hosts."}, {"kind": "pin", "html": "<strong>Detection signature:</strong> two different IP addresses resolving to the <strong>same MAC</strong>, or a gateway MAC that changes unexpectedly. <code>arp -a</code> shows it."}, {"kind": "trap", "html": "<strong>On-path attack</strong> is the current term for what older material calls <strong>man-in-the-middle</strong>. Both may appear; they mean the same thing."}, {"kind": "trap", "html": "<strong>The signature symptom:</strong> the address bar shows the correct name, but the site is wrong — or the certificate warning fires because the attacker cannot produce a valid certificate for that name. <strong>That certificate warning is the user's last line of defence</strong>, which is why training people to click through it is so damaging."}, {"kind": "pin", "html": "<strong>The principles attackers exploit:</strong> authority, urgency, scarcity, familiarity, trust, and intimidation. If a scenario emphasises <strong>time pressure</strong> plus an <strong>authority claim</strong>, it is social engineering regardless of the delivery method."}, {"kind": "pin", "html": "<strong>Virus versus worm is the single most tested malware distinction.</strong> A virus needs a user to open something; a <strong>worm needs nothing</strong>. If a scenario describes rapid spread across a network with no user action, it is a worm."}, {"kind": "pin", "html": "<strong>Ransomware is where backups become a security control, not just an operations one.</strong> The 3-2-1 rule and an <strong>offline or immutable</strong> copy are what defeat it — see 3.3. An attacker who can encrypt your backups has defeated the backup strategy entirely."}, {"kind": "pin", "html": "<strong>Learn this table in the control direction too.</strong> The exam asks both \"what attack is this?\" and \"which control prevents it?\""}]}, {"id": "s22", "num": "4.3", "title": "4.3 Device Security and Security Rules", "short": "Device Security and Security Rules", "part": "PART 4 — Network Security (Domain 4.0, 14%)", "html": "<h3>Physical security controls</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Control</th>\n<th>Purpose</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Fencing / bollards</strong></td>\n<td>Perimeter deterrence and vehicle barriers</td>\n</tr>\n<tr>\n<td><strong>Locks</strong></td>\n<td>Physical, electronic, biometric</td>\n</tr>\n<tr>\n<td><strong>Access badges / key fobs / smart cards</strong></td>\n<td>Controlled entry with an audit trail</td>\n</tr>\n<tr>\n<td><strong>Mantrap / access control vestibule</strong></td>\n<td>📌 Two interlocking doors preventing <strong>tailgating</strong> — only one person passes at a time</td>\n</tr>\n<tr>\n<td><strong>Security guards</strong></td>\n<td>Judgment that automated systems lack</td>\n</tr>\n<tr>\n<td><strong>Cameras / CCTV</strong></td>\n<td>⚠️ <strong>Detective</strong>, not preventative — records but doesn't stop</td>\n</tr>\n<tr>\n<td><strong>Motion detection and sensors</strong></td>\n<td>Detect presence in restricted areas</td>\n</tr>\n<tr>\n<td><strong>Asset tags / RFID</strong></td>\n<td>Track equipment movement</td>\n</tr>\n<tr>\n<td><strong>Lighting and signage</strong></td>\n<td>Deterrence</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>Classify controls correctly — the exam asks:</strong>\n- <strong>Deterrent</strong> — discourages (signage, lighting, visible cameras)\n- <strong>Preventative</strong> — stops (locks, mantraps, guards)\n- <strong>Detective</strong> — identifies after the fact (cameras, logs, alarms)\n- <strong>Corrective</strong> — restores (backups, DR sites)</p></div>\n<p><strong>Tailgating / piggybacking</strong> is the specific threat a mantrap addresses: an unauthorized person following an authorized one through a controlled door.</p>\n<h3>Geofencing</h3>\n<p><strong>Defining geographical boundaries</strong> monitored by <strong>GPS satellites, RFID, cellular service, or Wi-Fi</strong>, triggering an alert when a monitored device <strong>enters or exits</strong> the boundary. Boundaries are typically drawn in a <strong>web interface overlaid on a map or satellite imagery</strong>.</p>\n<div class=\"callout pin\"><p>📌 <strong>Where it's actually used.</strong> As the transcript notes, \"geo\" implies geography, so this isn't usually how you harden an <em>internal</em> network — it's more often used to <strong>harden the services you offer</strong>. Examples: restricting an application so it only functions within a facility, or blocking authentication attempts originating from countries where you have no operations.</p></div>\n<div class=\"callout trap\"><p>⚠️ <strong>Virtual barriers</strong> — a design consideration covering the <strong>level of participation required</strong> from the person or device being monitored. Some implementations require an app or agent; others work passively. That difference determines what you can actually enforce.</p></div>\n<p><strong>Hardening</strong> is reducing attack surface by removing or securing everything that isn't required.</p>\n<h3>Default credentials</h3>\n<div class=\"callout pin\"><p>📌 <strong>The first and most important step, always.</strong> Devices ship with published default usernames and passwords that are freely searchable. Changing them is the single highest-value hardening action.</p></div>\n<div class=\"callout trap\"><p>⚠️ <strong>Establish a secure connection first.</strong> Changing a password over <strong>Telnet</strong> transmits the new password in cleartext — you've just handed an eavesdropper the credential you were trying to protect. <strong>Use SSH or console access.</strong></p></div>\n<h3>Password strength</h3>\n<p>Passwords remain one of the weakest links.</p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Factor</th>\n<th>Guidance</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Length</strong></td>\n<td>📌 <strong>The most important factor</strong> — length beats complexity</td>\n</tr>\n<tr>\n<td><strong>Complexity</strong></td>\n<td>Mixed character types</td>\n</tr>\n<tr>\n<td><strong>Uniqueness</strong></td>\n<td>No reuse across systems</td>\n</tr>\n<tr>\n<td><strong>Passphrases</strong></td>\n<td>Long and memorable beats short and cryptic</td>\n</tr>\n<tr>\n<td><strong>MFA</strong></td>\n<td>⚠️ <strong>The strongest single improvement</strong> — a stolen password alone becomes insufficient</td>\n</tr>\n<tr>\n<td><strong>Password managers</strong></td>\n<td>Enable unique, long credentials per system</td>\n</tr>\n<tr>\n<td><strong>Account lockout</strong></td>\n<td>Blunts brute force</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>MFA factors:</strong> something you <strong>know</strong> (password), <strong>have</strong> (token, phone), <strong>are</strong> (biometric). 📌 True MFA requires factors from <strong>different categories</strong> — two passwords is not MFA.</p>\n<h3>Disabling unused ports</h3>\n<div class=\"callout pin\"><p>📌 Applies to <strong>both</strong> meanings of \"port\":</p></div>\n<ul>\n<li><strong>Physical switch ports</strong> — an enabled unused port in a lobby or conference room is an open door onto the network. Shut them down administratively, or place them in an unused VLAN (a \"black hole\" VLAN).</li>\n<li><strong>Logical service ports</strong> — every open TCP/UDP port is a service listening, and every listening service is potential attack surface. Disable services you don't use.</li>\n</ul>\n<div class=\"callout trap\"><p>⚠️ <strong>The principle behind both: if it isn't needed, it shouldn't be running or reachable.</strong></p></div>\n<h3>Firewall rules</h3>\n<p><strong>Components of a rule:</strong> source, destination, service/port, action, direction, and logging.</p>\n<p><strong>Actions:</strong></p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Action</th>\n<th>Behavior</th>\n<th>Sender sees</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Allow / Permit</strong></td>\n<td>Traffic passes</td>\n<td>Success</td>\n</tr>\n<tr>\n<td><strong>Deny / Drop</strong></td>\n<td><strong>Silently discarded</strong></td>\n<td><strong>Timeout</strong> — no response</td>\n</tr>\n<tr>\n<td><strong>Reject</strong></td>\n<td>Discarded <strong>with notification</strong></td>\n<td>Immediate refusal (RST or ICMP unreachable)</td>\n</tr>\n<tr>\n<td><strong>Log</strong></td>\n<td>Records the match</td>\n<td>—</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout both\"><p>📌 ⚠️ <strong>Drop vs reject is a real design decision, not trivia.</strong> Dropping reveals nothing to a scanner and slows reconnaissance, but produces confusing timeouts for legitimate users. Rejecting gives fast, clear failures for legitimate traffic but confirms to an attacker that a host exists. External-facing rules typically drop; internal rules often reject.</p></div>\n<p><strong>Rule ordering</strong> follows the ACL rules above: <strong>top-down, first match wins, implicit deny at the end.</strong></p>\n<h3>Wireless hardening</h3>\n<p>Beyond WPA3/WPA2 and 802.1X (see 2.3):</p>\n<ul>\n<li><strong>Transmit power tuning</strong> — 📌 reduce AP power so the signal doesn't extend past your walls into the parking lot. More power is not better; it extends your attack surface geographically.</li>\n<li><strong>Disable WPS</strong> — ⚠️ the PIN mechanism is brute-forceable and should be off.</li>\n<li><strong>Change default SSID names</strong> — defaults reveal the vendor and model, telling an attacker which vulnerabilities to try.</li>\n<li><strong>Guest network isolation</strong> — client isolation so guests can't reach each other or internal resources.</li>\n<li><strong>Rogue AP detection</strong> — see 1.2. Wireless scanning and WLC-based detection.</li>\n<li><strong>Disable unused radios and bands.</strong></li>\n</ul>\n<h3>IoT security</h3>\n<div class=\"callout trap\"><p>⚠️ IoT concerns, restated from 2.4 in security terms: default credentials, infrequent or absent patching, weak or no built-in security, and long deployment lifetimes on unsupported firmware.</p></div>\n<div class=\"callout pin\"><p>📌 <strong>Controls:</strong> segment onto a dedicated VLAN, restrict outbound as well as inbound traffic, change defaults, disable UPnP, monitor for anomalous behavior, and inventory ruthlessly — you cannot secure devices you don't know are connected.</p></div>\n<h3>Remote access security</h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Protocol</th>\n<th>Port</th>\n<th>Security</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>SSH</strong></td>\n<td>22</td>\n<td>✅ Encrypted. The standard for CLI</td>\n</tr>\n<tr>\n<td><strong>RDP</strong></td>\n<td>3389</td>\n<td>Microsoft's GUI remote access. ⚠️ <strong>Never expose directly to the internet</strong> — put it behind a VPN or jump server</td>\n</tr>\n<tr>\n<td><strong>VNC</strong></td>\n<td>5900</td>\n<td>Cross-platform GUI; ⚠️ often unencrypted by default</td>\n</tr>\n<tr>\n<td><strong>Telnet</strong></td>\n<td>23</td>\n<td>❌ Cleartext. Disable it</td>\n</tr>\n<tr>\n<td><strong>VPN</strong></td>\n<td>Varies</td>\n<td>Encrypted tunnel (see 1.2, 3.1)</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"callout pin\"><p>📌 <strong>RDP and VNC exposed to the internet are among the most reliably exploited entry points in real breaches.</strong> The answer in any scenario is: <strong>VPN first, or a jump server (see 3.5), then RDP internally.</strong></p></div>\n<p><strong>Remote access authentication:</strong> RADIUS, TACACS+, LDAP/Active Directory integration, SSO, and MFA.</p>\n<div class=\"lab\"><h3>🔧 LAB 4.3 — Device Hardening</h3>\n<p>Take a deliberately insecure Packet Tracer network — default credentials, Telnet enabled, no port security, flat VLAN, open guest wireless — and harden it systematically: SSH-only management, port security with all three violation modes, 802.1X with RADIUS, segmented IoT and guest VLANs, ACLs demonstrating first-match-wins and implicit deny, and a DMZ. Break/fix: an ACL with rules in the wrong order silently permitting blocked traffic, a port security move violation, and an over-powered AP leaking signal beyond the building.</p></div>\n<hr />", "text": " Physical security controls Control Purpose Fencing / bollards Perimeter deterrence and vehicle barriers Locks Physical, electronic, biometric Access badges / key fobs / smart cards Controlled entry with an audit trail Mantrap / access control vestibule 📌 Two interlocking doors preventing tailgating — only one person passes at a time Security guards Judgment that automated systems lack Cameras / CCTV ⚠️ Detective , not preventative — records but doesn't stop Motion detection and sensors Detect presence in restricted areas Asset tags / RFID Track equipment movement Lighting and signage Deterrence 📌 ⚠️ Classify controls correctly — the exam asks: - Deterrent — discourages (signage, lighting, visible cameras) - Preventative — stops (locks, mantraps, guards) - Detective — identifies after the fact (cameras, logs, alarms) - Corrective — restores (backups, DR sites) Tailgating / piggybacking is the specific threat a mantrap addresses: an unauthorized person following an authorized one through a controlled door. Geofencing Defining geographical boundaries monitored by GPS satellites, RFID, cellular service, or Wi-Fi , triggering an alert when a monitored device enters or exits the boundary. Boundaries are typically drawn in a web interface overlaid on a map or satellite imagery . 📌 Where it's actually used. As the transcript notes, \"geo\" implies geography, so this isn't usually how you harden an internal network — it's more often used to harden the services you offer . Examples: restricting an application so it only functions within a facility, or blocking authentication attempts originating from countries where you have no operations. ⚠️ Virtual barriers — a design consideration covering the level of participation required from the person or device being monitored. Some implementations require an app or agent; others work passively. That difference determines what you can actually enforce. Hardening is reducing attack surface by removing or securing everything that isn't required. Default credentials 📌 The first and most important step, always. Devices ship with published default usernames and passwords that are freely searchable. Changing them is the single highest-value hardening action. ⚠️ Establish a secure connection first. Changing a password over Telnet transmits the new password in cleartext — you've just handed an eavesdropper the credential you were trying to protect. Use SSH or console access. Password strength Passwords remain one of the weakest links. Factor Guidance Length 📌 The most important factor — length beats complexity Complexity Mixed character types Uniqueness No reuse across systems Passphrases Long and memorable beats short and cryptic MFA ⚠️ The strongest single improvement — a stolen password alone becomes insufficient Password managers Enable unique, long credentials per system Account lockout Blunts brute force MFA factors: something you know (password), have (token, phone), are (biometric). 📌 True MFA requires factors from different categories — two passwords is not MFA. Disabling unused ports 📌 Applies to both meanings of \"port\": Physical switch ports — an enabled unused port in a lobby or conference room is an open door onto the network. Shut them down administratively, or place them in an unused VLAN (a \"black hole\" VLAN). Logical service ports — every open TCP/UDP port is a service listening, and every listening service is potential attack surface. Disable services you don't use. ⚠️ The principle behind both: if it isn't needed, it shouldn't be running or reachable. Firewall rules Components of a rule: source, destination, service/port, action, direction, and logging. Actions: Action Behavior Sender sees Allow / Permit Traffic passes Success Deny / Drop Silently discarded Timeout — no response Reject Discarded with notification Immediate refusal (RST or ICMP unreachable) Log Records the match — 📌 ⚠️ Drop vs reject is a real design decision, not trivia. Dropping reveals nothing to a scanner and slows reconnaissance, but produces confusing timeouts for legitimate users. Rejecting gives fast, clear failures for legitimate traffic but confirms to an attacker that a host exists. External-facing rules typically drop; internal rules often reject. Rule ordering follows the ACL rules above: top-down, first match wins, implicit deny at the end. Wireless hardening Beyond WPA3/WPA2 and 802.1X (see 2.3): Transmit power tuning — 📌 reduce AP power so the signal doesn't extend past your walls into the parking lot. More power is not better; it extends your attack surface geographically. Disable WPS — ⚠️ the PIN mechanism is brute-forceable and should be off. Change default SSID names — defaults reveal the vendor and model, telling an attacker which vulnerab
